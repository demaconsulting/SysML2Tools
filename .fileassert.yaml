---
# FileAssert document validation tests for SysML2Tools.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: build-notes, code-quality, code-review, design, verification, user-guide, requirements, package.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence. The package tests run
# after `dotnet pack` in the build job and validate the packed NuGet packages.

tests:

  # --- PACKAGE ---
  # These tests guard against regressions such as the historical Tool package size
  # bloat (native SkiaSharp symbol/runtime bloat pushed the package to ~435 MB) and
  # verify each package's expected contents are present.

  - name: Package_ToolSizeWithinLimit
    description: "Tool package stays within its size budget"
    tags: [package]
    files:
      - pattern: "artifacts/packages/DemaConsulting.SysML2Tools.Tool.*.nupkg"
        count: 1
        max-size: 73400320  # 70 MiB

  - name: Package_ToolContentsValid
    description: "Tool package contains the expected assemblies and native runtimes, with no stray symbols"
    tags: [package]
    files:
      - pattern: "artifacts/packages/DemaConsulting.SysML2Tools.Tool.*.nupkg"
        zip:
          files:
            - pattern: "README.md"
              min: 1
            - pattern: "tools/net10.0/any/DemaConsulting.SysML2Tools.dll"
              min: 1
              max: 1
            - pattern: "tools/net10.0/any/DemaConsulting.SysML2Tools.Core.dll"
              min: 1
            - pattern: "tools/net10.0/any/DemaConsulting.SysML2Tools.Language.dll"
              min: 1
            - pattern: "tools/net10.0/any/DemaConsulting.SysML2Tools.Stdlib.dll"
              min: 1
            - pattern: "tools/net10.0/any/runtimes/*/native/*"
              count: 8
            - pattern: "tools/net10.0/any/runtimes/**/*.pdb"
              max: 0

  - name: Package_CoreSizeAndContentsValid
    description: "Core package stays within budget and contains the expected multi-targeted assemblies"
    tags: [package]
    files:
      - pattern: "artifacts/packages/DemaConsulting.SysML2Tools.Core.*.nupkg"
        count: 1
        max-size: 5242880  # 5 MiB
        zip:
          files:
            - pattern: "README.md"
              min: 1
            - pattern: "lib/net8.0/DemaConsulting.SysML2Tools.Core.dll"
              min: 1
            - pattern: "lib/net9.0/DemaConsulting.SysML2Tools.Core.dll"
              min: 1
            - pattern: "lib/net10.0/DemaConsulting.SysML2Tools.Core.dll"
              min: 1

  - name: Package_LanguageSizeAndContentsValid
    description: "Language package stays within budget and contains the expected multi-targeted assemblies"
    tags: [package]
    files:
      - pattern: "artifacts/packages/DemaConsulting.SysML2Tools.Language.*.nupkg"
        count: 1
        max-size: 5242880  # 5 MiB
        zip:
          files:
            - pattern: "README.md"
              min: 1
            - pattern: "lib/net8.0/DemaConsulting.SysML2Tools.Language.dll"
              min: 1
            - pattern: "lib/net9.0/DemaConsulting.SysML2Tools.Language.dll"
              min: 1
            - pattern: "lib/net10.0/DemaConsulting.SysML2Tools.Language.dll"
              min: 1

  - name: Package_StdlibSizeAndContentsValid
    description: "Stdlib package stays within budget and contains the expected multi-targeted assemblies"
    tags: [package]
    files:
      - pattern: "artifacts/packages/DemaConsulting.SysML2Tools.Stdlib.*.nupkg"
        count: 1
        max-size: 5242880  # 5 MiB
        zip:
          files:
            - pattern: "README.md"
              min: 1
            - pattern: "lib/net8.0/DemaConsulting.SysML2Tools.Stdlib.dll"
              min: 1
            - pattern: "lib/net9.0/DemaConsulting.SysML2Tools.Stdlib.dll"
              min: 1
            - pattern: "lib/net10.0/DemaConsulting.SysML2Tools.Stdlib.dll"
              min: 1

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/SysML2Tools Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "SysML2 Tools"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"


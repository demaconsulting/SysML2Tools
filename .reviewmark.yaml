  # GeneralViewLayoutStrategy — General View layout. This review-set covers the three edge
  # notations the strategy draws between definition boxes: specialization (solid line, hollow
  # triangle at the supertype), structural/reference membership (solid line, filled/hollow diamond
  # at the owner), and attribute typing (dashed dependency line, open chevron at the attribute-type
  # definition). Attribute typing is a usage-type dependency, not composition.

---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish type'
        required: true
        type: choice
        options:
          - none
          - release
          - publish

jobs:
  # Calls the reusable build workflow to build, test, and generate documentation
  # for the release version.
  build:
    name: Build
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ inputs.version }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cuts the release, creating a GitHub release with artifacts. This job has no
  # OIDC access so third-party release actions cannot mint a NuGet token.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-ubuntu-latest
          path: artifacts

      - name: Download documents artifact
        uses: actions/download-artifact@v8
        with:
          name: documents
          path: artifacts

      - name: Create GitHub Release
        if: inputs.publish == 'release' || inputs.publish == 'publish'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          artifacts: artifacts/*
          bodyFile: artifacts/build_notes.md
          generateReleaseNotes: false

  # Publishes the NuGet packages (the Core, Language, and Stdlib libraries and
  # the Tool) using Trusted Publishing. This is the only job granted
  # id-token: write, and the only third-party action it runs is the official
  # NuGet login.
  publish:
    name: Publish to NuGet
    if: inputs.publish == 'publish'
    runs-on: ubuntu-latest
    needs: release
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write  # lets GitHub issue the token NuGet checks

    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-ubuntu-latest
          path: artifacts

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # your nuget.org profile name, not your email address

      - name: Publish to NuGet.org
        run: |-
          set -e
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/api/**"  # ApiMark-generated Markdown API reference docs
  - "**/Parser/Antlr/**"
  - "**/Stdlib/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "ROADMAP.md"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json

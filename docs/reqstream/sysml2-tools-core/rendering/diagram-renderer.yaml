---
# DiagramRenderer Unit Requirements
#
# PURPOSE:
# - Define requirements for the DiagramRenderer unit
# - DiagramRenderer is the high-level rendering orchestrator for the Rendering subsystem
# - Requirements describe the observable orchestration behavior of the full pipeline
# - Unit requirements decompose the Rendering subsystem DiagramRenderer responsibility into this unit

sections:
  - title: DiagramRenderer Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Rendering-DiagramRenderer-RendersEachView
        title: >-
          For each user-defined view in a workspace, the diagram renderer shall lay the
          view out and render it, returning one output whose content reflects the view's
          rendered elements.
        justification: |
          DiagramRenderer is the single orchestration point that wires layout and rendering together.
          Producing one output per view, with the view's elements present in the output, proves the
          whole pipeline runs end to end.
        tests:
          - DiagramRenderer_RenderWorkspace_SoftwareStructureModel_ReturnsSvgOutput
          - DiagramRenderer_RenderWorkspace_GeneralViewModel_SvgContainsElementNames

      - id: SysML2Tools-Core-Rendering-DiagramRenderer-RendererAgnostic
        title: >-
          The diagram renderer shall drive any supplied format renderer, producing valid
          format-specific output for both the SVG and PNG renderers from the same workspace.
        justification: |
          Because the orchestrator depends only on the IRenderer contract, the same pipeline serves
          every renderer. Exercising it with both shipped renderers proves the abstraction holds.
        tests:
          - DiagramRenderer_RenderWorkspace_SoftwareStructureModel_PngRenderer_ReturnsPngOutput
          - DiagramRenderer_RenderWorkspace_GeneralViewModel_PngProducesValidOutput

      - id: SysML2Tools-Core-Rendering-DiagramRenderer-NoViews
        title: >-
          The diagram renderer shall return an empty result when the workspace contains
          no user-defined view declarations, fabricating no output.
        justification: |
          A workspace without views has nothing to render. Returning an empty list rather than a
          placeholder keeps the caller's output free of spurious files.
        tests:
          - DiagramRenderer_RenderWorkspace_NoViews_ReturnsEmptyList

      - id: SysML2Tools-Core-Rendering-DiagramRenderer-SynthesizeDynamicView
        title: >-
          DiagramRenderer shall expose a SynthesizeDynamicView method that delegates entirely to
          the internal DynamicViewSynthesizer, returning a synthesized view node (or a diagnostic
          on failure) for the render --view-type/--view-target/--filter CLI feature, without
          duplicating any of DynamicViewSynthesizer's validation or construction logic.
        justification: |
          Keeping DiagramRenderer as a thin public-surface delegate (mirroring
          SynthesizeAutoView's own existing pattern) preserves DynamicViewSynthesizer as the
          single source of truth for dynamic-view synthesis rules, avoiding drift between two
          copies of the same per-kind compatibility logic.
        tests:
          - Synthesize_GeneralKind_ResolvableTarget_Succeeds
          - Synthesize_UnresolvedTarget_Fails

      - id: SysML2Tools-Core-Rendering-DiagramRenderer-EmptyViewWarning
        title: >-
          When a caller supplies a diagnostics collection, the diagram renderer shall report, located
          at the view's declaration, a warning for each rendered view whose diagram contains nothing
          renderable, and otherwise an informational hint for each view laid out as a General View
          that exposes a package with
          a bare `expose <Package>;` while none of its members are exposed (suggesting
          `expose <Package>::**;`), while still returning the view's rendered output.
        justification: |
          A blank diagram is almost always a modeling mistake and has gone unnoticed in published
          design documents for weeks, so it warrants a located warning. A bare `expose P;` is valid
          SysML (SysML 8.3.26.3: a MembershipExpose of the package element itself) and renders as a
          package node, so it only merits an informational hint that `expose P::**;` also shows
          the members. Still returning the output keeps existing output files current.
        tests:
          - DiagramRenderer_RenderWorkspace_ViewExposesBarePackage_RendersPackageNodeWithInfoHint
          - DiagramRenderer_RenderWorkspace_NonGeneralViewExposesBarePackage_ReportsNoHint
          - DiagramRenderer_RenderWorkspace_ViewWithNothingRenderable_ReportsEmptyViewWarning
          - DiagramRenderer_RenderWorkspace_ViewExposesPackageRecursively_ReportsNoWarning
          - DiagramRenderer_RenderWorkspace_ViewExposesRenderableElement_ReportsNoWarning

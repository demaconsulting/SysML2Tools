---
# DiagramTypeRouter Unit Requirements
#
# PURPOSE:
# - Define requirements for the DiagramTypeRouter unit
# - DiagramTypeRouter selects the layout strategy for a given view
# - Requirements describe observable selection behavior, not the matching algorithm

sections:
  - title: DiagramTypeRouter Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Rendering-Internal-DiagramTypeRouter-KindDispatch
        title: >-
          DiagramTypeRouter shall select the layout strategy that corresponds to a view's
          kind, as identified from the view's name or its declared supertypes.
        justification: |
          Each view kind (interconnection, state transition, action flow, grid, browser,
          sequence) requires a different layout. Selecting by the view's declared identity
          lets an author choose a diagram type by naming or specializing the appropriate
          viewpoint.
        tests:
          - GetStrategy_InterconnectionNamedView_ReturnsInterconnectionStrategy
          - GetStrategy_ViewSpecializingInterconnection_ReturnsInterconnectionStrategy
          - GetStrategy_StateTransitionNamedView_ReturnsStateStrategy
          - GetStrategy_ActionFlowNamedView_ReturnsActionFlowStrategy
          - GetStrategy_MatrixNamedView_ReturnsGridStrategy
          - GetStrategy_BrowserNamedView_ReturnsBrowserStrategy
          - GetStrategy_SequenceNamedView_ReturnsSequenceStrategy

      - id: SysML2Tools-Core-Rendering-Internal-DiagramTypeRouter-DefaultGeneral
        title: >-
          When a view matches no recognized view kind, DiagramTypeRouter shall select the
          general view strategy.
        justification: |
          A sensible default keeps every view renderable. The general view is the most
          broadly applicable layout and is the natural fallback for an unspecified view kind.
        tests:
          - GetStrategy_PlainView_ReturnsGeneralViewStrategy

      - id: SysML2Tools-Core-Rendering-Internal-DiagramTypeRouter-RenderTargetOverride
        title: >-
          When a view declares a render target of asTreeDiagram, asInterconnectionDiagram,
          asGeneralDiagram, asStateTransitionDiagram, asActionFlowDiagram, asSequenceDiagram, or
          asGridDiagram, DiagramTypeRouter shall select the corresponding layout strategy, taking
          precedence over the name/supertype heuristic.
        justification: |
          A view's declared render target is an explicit, author-specified rendering-style
          selection per the SysML v2 grammar. Honoring it ahead of the name/supertype heuristic
          lets an author pick a diagram type directly, without relying on naming conventions, and
          resolves any conflict between the two in the author's favor. The five additive tokens
          (asGeneralDiagram, asStateTransitionDiagram, asActionFlowDiagram, asSequenceDiagram,
          asGridDiagram) give every remaining layout strategy the same explicit,
          precedence-taking dispatch path already enjoyed by asTreeDiagram/
          asInterconnectionDiagram, and are the exact-match tokens the dynamic (ad-hoc) view CLI
          feature (<c>render --view-type &lt;kind&gt; --view-target &lt;name&gt;</c>) relies on
          to select a layout strategy independently of the target's own name.
        tests:
          - GetStrategy_RenderAsTreeDiagram_ReturnsBrowserStrategy
          - GetStrategy_RenderAsInterconnectionDiagram_ReturnsInterconnectionStrategy
          - GetStrategy_RenderTargetPrecedenceOverridesNameHeuristic
          - GetStrategy_RenderAsGeneralDiagram_ReturnsGeneralViewStrategy
          - GetStrategy_RenderAsStateTransitionDiagram_ReturnsStateTransitionStrategy
          - GetStrategy_RenderAsActionFlowDiagram_ReturnsActionFlowStrategy
          - GetStrategy_RenderAsSequenceDiagram_ReturnsSequenceStrategy
          - GetStrategy_RenderAsGridDiagram_ReturnsGridStrategy
          - GetStrategy_RenderAsGeneralDiagram_PrecedenceOverridesNameHeuristic

      - id: SysML2Tools-Core-Rendering-Internal-DiagramTypeRouter-RenderTargetUnrecognizedFallthrough
        title: >-
          When a view declares an unrecognized render target — including asElementTable,
          asTextualNotation, or none at all — DiagramTypeRouter shall fall through unchanged to
          the name/supertype heuristic, with no diagnostic.
        justification: |
          Rendering-style names with no corresponding layout strategy (asElementTable is a
          fundamentally tabular composition distinct from the Grid View; asTextualNotation is
          non-graphical) are not errors — render selects presentation, not content — so dispatch
          must continue to resolve via the existing heuristic without regressing or emitting a
          spurious diagnostic.
        tests:
          - GetStrategy_RenderAsElementTable_FallsThroughUnchanged
          - GetStrategy_RenderAsTextualNotation_FallsThroughUnchanged
          - GetStrategy_UnrecognizedRenderTarget_FallsThroughUnchanged

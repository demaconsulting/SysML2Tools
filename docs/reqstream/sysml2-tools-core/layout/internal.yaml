          - SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-ExposeScoping
          - SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-NoExposeFallback
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ExposedName_UnionsAdditionalSubtree

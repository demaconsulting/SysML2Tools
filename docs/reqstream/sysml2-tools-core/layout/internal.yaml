          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Allocate
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Dependency
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Binding
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Subsetting
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NonStructuralMembership
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AttributeTyping
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterEvaluation

          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-BareNameForm
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-NoEdgeOnFailure
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AnnotationNote
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-RequirementConstraintCompartments
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Internals
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Ports
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Connectors

      - id: SysML2Tools-Core-Layout-Internal-LayoutWarnings
        title: >-
          When a view layout cannot avoid a layout-quality problem such as a connector
          crossing a box, the view layout strategies shall surface a non-fatal warning
          identifying the affected view, and shall emit no warning for a clean layout.
        justification: |
          Layout-quality problems degrade diagram readability but should not fail the render.
          Surfacing a warning lets the user judge and address the problem, while withholding a
          warning for a clean layout keeps attention on real issues. The warning text is the
          observable evidence of this behavior.
        children:
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterFallbackWarning
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-DroppedRelationshipEdgeWarning
          - SysML2Tools-Core-Layout-Internal-LayoutWarnings-NoCrossings
          - SysML2Tools-Core-Layout-Internal-LayoutWarnings-CrossingWarning
          - SysML2Tools-Core-Layout-Internal-LayoutWarnings-UnevaluatedFilter
          - SysML2Tools-Core-Layout-Internal-LayoutWarnings-UnevaluatedExposeBracketFilter
        tests:
          - ForCrossings_Zero_ReturnsEmpty
          - ForCrossings_One_ReturnsSingularWarning
          - ForCrossings_Many_ReturnsPluralWarning

      - id: SysML2Tools-Core-Layout-Internal-EmptyCanvas
        title: >-
          When the workspace contains no elements relevant to a view, the view layout strategy
          shall return a minimal empty canvas with no nodes.
        justification: |
          A view with nothing to show must still yield a well-formed, empty layout tree so the
          renderer produces a valid (blank) diagram rather than failing. The empty node set is
          the observable evidence of this behavior.
        children:
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-EmptyCanvas
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-EmptyCanvas
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-EmptyCanvas
          - SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-EmptyCanvas
          - SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-EmptyInput
          - SysML2Tools-Core-Layout-Internal-BrowserViewLayoutStrategy-EmptyInput
          - SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-EmptyInput
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas
          - InterconnectionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas
          - StateTransitionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas
          - ActionFlowView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas
          - SequenceView_BuildLayout_NoMessages_ReturnsMinimalCanvas
          - BrowserAndGrid_BuildLayout_EmptyWorkspace_ReturnMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-StdlibExclusion
        title: >-
          The view layout strategies shall exclude standard-library elements from the produced
          diagrams.
        justification: |
          Diagrams are meant to show the user's model, not the imported standard library.
          Excluding standard-library elements keeps the rendered views focused and readable.
        children:
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-StdlibExclusion
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_StdlibOnlyWorkspace_ReturnsMinimalCanvas
          - GeneralViewLayoutStrategy_BuildLayout_SeedStdlibNames_AreExcluded

      - id: SysML2Tools-Core-Layout-Internal-NonOverlapping
        title: >-
          The view layout strategies shall position the boxes of a diagram so that they do not
          overlap one another.
        justification: |
          Overlapping boxes produce unreadable diagrams. Non-overlap is an observable property
          of the produced geometry that every view layout must guarantee.
        children:
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-LayeredPlacement
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NonOverlapping
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ContainerSizing
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ChildPositioning
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortTitleCollisionAvoidance
          - SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-OrthogonalFlow
          - SysML2Tools-Core-Layout-Internal-LayeredPlacement-Adapt
          - SysML2Tools-Core-Layout-Internal-LayeredPlacement-NodeOrder
          - SysML2Tools-Core-Layout-Internal-LayeredPlacement-NamedPorts
          - SysML2Tools-Core-Layout-Internal-LayeredPlacement-TitleAwarePorts
        tests:
          - InterconnectionView_BuildLayout_PartBoxes_DoNotOverlap

      - id: SysML2Tools-Core-Layout-Internal-SharedExposeScoping
        title: >-
          Each view layout strategy shall honor a view's resolved expose scope via the shared
          ExposeScopeResolver helper, rendering every non-stdlib element (or the pre-scoping
          heuristic root) unchanged when the view has no resolved Expose edge, and scoping to the
          union of every exposed target's containment subtree (including any usage's resolved
          type) when it does.
        justification: |
          Every view kind must apply `expose` scoping identically so a user's `expose` statement
          behaves predictably regardless of which diagram kind renders it; sharing one resolver
          across all seven strategies is what makes that consistency observable rather than
          coincidental, including the critical "no expose statement renders everything unchanged"
          fallback and the "multiple expose targets union" case.
        children:
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ScopedBarePackageFolderSuppression
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeScoping
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeBracketFilterEvaluation
          - SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NoExposeFallback
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingRootSelection
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingPartFiltering
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingConnectionRetention
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingRecursionDepthLimit
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PerBranchRecursionIndependence
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NoExposeFallback
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedSpecificityTieBreak
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallback
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallbackConnections
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallbackEmptyCanvas
          - SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-TopLevelOwnerScopedConnections
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingRootSelection
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingStateFiltering
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingTransitionEndpointRetention
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-NoExposeFallback
          - SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ScopedSpecificityTieBreak
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-ResolveExposedTargets
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-UsageToTypeFallback
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NoScopeFallback
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-SubjectScopeMembership
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-MembershipExactNarrowScope
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NamespaceDirectChildrenNarrowScope
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-RecursiveWholeSubtreeUnchanged
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NamespaceRecursiveExcludesSubject
          - SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-RootRelevance

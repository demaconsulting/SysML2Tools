---
# GeneralViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the GeneralViewLayoutStrategy unit
# - GeneralViewLayoutStrategy lays out a General View diagram from user definitions
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: GeneralViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Definitions
        title: >-
          GeneralViewLayoutStrategy shall render each user-defined definition as a labeled box
          that carries the definition's keyword.
        justification: |
          A General View shows the user's declared definitions of every kind (part, port,
          interface, action, and so on). Rendering each as a keyword-labeled box is the
          observable content the view exists to provide.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_OneUserPartDef_ProducesLayoutBox
          - GeneralViewLayoutStrategy_BuildLayout_MixedDefinitionKinds_RendersAllWithKeywords

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NameLine
        title: >-
          GeneralViewLayoutStrategy shall label each definition box's name line in the textual
          notation — the short name, the name, and its specialization (`:>`) as declared in the
          model — omitting any piece the model does not declare, and shall size the box to fit
          that label.
        justification: |
          The SysML v2 graphical notation shows an element's short name before its name and a
          definition's specialization after it. Showing the declared pieces lets a reader
          identify each definition and its direct supertypes from the box alone; sizing the box
          from the full label keeps the text from being clipped. The name line of a usage is
          covered by the UsageNameLine requirement.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionNameLine_ShowsShortNameAndSupertypes
          - GeneralViewLayoutStrategy_FormatNameLine_AllOptionalsNull_ReturnsNameOnly
          - GeneralViewLayoutStrategy_FormatNameLine_EachOptionalAlone_UsesTextualNotation
          - GeneralViewLayoutStrategy_FormatNameLine_AllPieces_CombinesInSpecOrder

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageShape
        title: >-
          GeneralViewLayoutStrategy shall draw every usage that has a box of its own — a top-level
          usage or a usage nested in another box — with rounded corners and a definition as a box
          with square corners.
        justification: |
          The SysML v2 graphical notation distinguishes usages from definitions by corner shape.
          Drawing each with its own shape lets a reader tell the two apart without reading the
          keyword.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_TopLevelUsage_IsRoundedAndDefinitionIsSquare
          - GeneralViewLayoutStrategy_BuildLayout_PilotPolicy_PartUsage_IsOwnNodeBesideOwner

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageNodes
        title: >-
          By default, GeneralViewLayoutStrategy shall draw each part, item, occurrence, action,
          state, requirement, and concern usage, and each port usage that owns nested features,
          as a box of its own placed beside its owner and joined to it, and shall list attributes,
          enumeration values, plain reference usages, and ports without nested features as
          compartment rows of their owner instead; a usage nested in a usage shall be joined to
          that usage, and a usage nested at any depth shall not be dropped.
        justification: |
          The OMG SysML v2 reference implementation draws occurrence-kind usages as nodes and
          shows attributes and plain references as compartment rows, so a General View that
          follows it reads the same as the notation reference diagrams. A usage that owns content
          (a port with nested features, a part with parts) needs a box in which that content can
          be drawn, while a plain port or attribute is fully described by one row. Showing the
          structure of nested usages as nodes also lets typing, subsetting, and redefinition be
          drawn between the usages themselves. Dropping a nested usage whose owner is not
          rendered would silently lose model content.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_PilotPolicy_PartUsage_IsOwnNodeBesideOwner
          - GeneralViewLayoutStrategy_BuildLayout_PilotPolicy_AttributeAndPlainReference_StayRows
          - GeneralViewLayoutStrategy_BuildLayout_PilotPolicy_NestedUsageInUsage_ChainsOwners
          - GeneralViewLayoutStrategy_BuildLayout_PlainPort_IsRowOfOwnerPortsCompartment
          - GeneralViewLayoutStrategy_BuildLayout_PortWithNestedContent_IsNodeAndPlainPortStaysRow
          - GeneralViewLayoutStrategy_BuildLayout_IdenticalUsageNodesOfDifferentOwners_AreBothDrawn
          - GeneralViewLayoutStrategy_BuildLayout_DepthLimit_OwnerWithUsageNodes_StaysLeafWithEllipsisRow
          - GeneralViewLayoutStrategy_BuildLayout_ScopedExpose_RecursiveIncludesUsageNodes_NamespaceKeepsRows
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_RendersDeeplyNestedGrandchildUsageWhenIntermediateParentExcluded

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NodePolicy
        title: >-
          GeneralViewLayoutStrategy shall decide by a selectable policy which nested usages are
          drawn as boxes of their own: the default policy as specified for UsageNodes, an
          alternative that draws every named usage with a keyword as a box (except constraint
          expressions and enumeration values), and an alternative that draws no nested usage as a
          box, lists every usage as a compartment row, and draws no usage relationship edge; an
          unnamed usage, a usage without a keyword, and a usage that carries an expression shall
          never be drawn as a box.
        justification: |
          Whether nested usages are boxes or rows is a notation-density decision that differs
          between the SysML v2 reference implementation and compartment-only styles. Making the
          decision a single selectable policy keeps the default faithful to the reference while
          allowing a denser or a compartment-only presentation to be offered later without
          changing how the rest of the diagram is built. The policy is not yet exposed through the
          command line or the public rendering options.
        tests:
          - GeneralViewLayoutStrategy_NodePolicy_IsNode_KeywordMatrix_ReturnsExpected
          - GeneralViewLayoutStrategy_NodePolicy_IsNode_UnnamedWithoutKeywordOrExpression_IsNeverNode
          - GeneralViewLayoutStrategy_NodePolicy_IsNode_PilotPort_IsNodeOnlyWithNestedContent
          - GeneralViewLayoutStrategy_BuildLayout_RowsOnlyPolicy_PartUsage_StaysRowAndDrawsNoEdges
          - GeneralViewLayoutStrategy_BuildLayout_PortPolicyVariants_AllUsagesDrawsPlainPortAsNode_RowsOnlyDoesNot
          - GeneralViewLayoutStrategy_BuildLayout_AllUsages_AttributeUsage_IsNodeWithTypingAndHollowDiamond

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageNameLine
        title: >-
          GeneralViewLayoutStrategy shall label the name line of a usage box in the textual
          notation — the short name, the name, the typing (a conjugated typing with a leading
          `~`), the multiplicity, the `ordered`/`nonunique` modifiers, then the subsetting
          (`:>`), redefinition (`:>>`), and reference-subsetting (`::>`) references — omitting any
          piece the model does not declare, and shall write the keyword of a usage with its
          prefix words (`abstract`, `variation`, `individual`, `variant`, `ref`) inside the
          guillemet marks without repeating `ref` for a plain reference usage.
        justification: |
          The SysML v2 graphical notation shows the same textual pieces on a usage node as in the
          source model. Reproducing them lets a reader see a usage's type, multiplicity, and the
          features it narrows or redefines from the box alone, and the prefix words classify the
          usage (abstract, variant, reference) without a separate legend.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_UsageNameLine_ShowsTypeMultiplicitySubsettingRedefinitionAndReferenceSubsetting
          - GeneralViewLayoutStrategy_BuildLayout_ConjugatedTyping_ShowsTildeAndTypesTheUsageByThePortDefinition
          - GeneralViewLayoutStrategy_BuildLayout_UsageKeyword_PrefixWords_AreInsideTheKeyword
          - GeneralViewLayoutStrategy_BuildLayout_PlainReferenceUsage_KeywordIsNotDoubled

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FeatureRows
        title: >-
          GeneralViewLayoutStrategy shall write each usage that is shown as a compartment row in
          the textual notation — an optional direction keyword (`in`, `out`, `inout`), the name,
          the typing (a conjugated typing with a leading `~`), the multiplicity with its
          `ordered`/`nonunique` modifiers, the subsetting, redefinition, and reference-subsetting
          clauses, and the value clause — omitting any piece the model does not declare.
        justification: |
          Attributes, plain ports, and the other usages shown as rows are specified by their
          textual form in the SysML v2 graphical notation. Showing every declared piece keeps the
          row a faithful summary of the declaration, since these usages have no box of their own
          to carry the detail.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FeatureRows_UseTextualNotation
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionWithUsages_ProducesCompartments

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AbstractDefinitionName
        title: >-
          GeneralViewLayoutStrategy shall write the name of an abstract definition in italics and
          its keyword with the `abstract` prefix word, and shall not write the name of an abstract
          usage in italics.
        justification: |
          Table 4 of the SysML v2 graphical notation sets the name of an abstract definition in
          italics; an abstract usage is marked by its `abstract` keyword prefix only. Following
          the table lets a reader recognize an abstract definition at a glance without confusing
          it with an abstract usage.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AbstractDefinition_NameIsItalicButAbstractUsageIsNot

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ReferenceUsageShape
        title: >-
          GeneralViewLayoutStrategy shall draw the box of a reference usage with a dashed outline
          and the box of a composite usage with a solid outline.
        justification: |
          The SysML v2 graphical notation draws a reference part (a usage that does not own its
          value) with a dashed outline. The outline style lets a reader tell a referenced usage
          from an owned one without reading the keyword.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ReferenceUsage_OutlineIsDashedAndCompositeUsageIsSolid
          - GeneralViewLayoutStrategy_BuildLayout_ReferenceMembership_ProducesHollowDiamondEdgeAndDashedNode

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-PackageGrouping
        title: >-
          When the view has no resolved expose scope, GeneralViewLayoutStrategy shall group the
          definitions that belong to a bare package within a folder-shaped container box labeled
          with the package name, without a «package» keyword line.
        justification: |
          Grouping a package's definitions inside a labeled folder communicates ownership and
          keeps related definitions visually together, which is essential for readable diagrams
          of larger models, for the unscoped (whole-workspace) case where every ancestor package
          is genuinely part of what the view renders. The SysML v2 graphical notation identifies
          a package by its folder shape and name alone, so no keyword line is drawn.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_PackagedDefinitions_ProducesFolderBox
          - GeneralViewLayoutStrategy_BuildLayout_Unscoped_StillRendersFullPackageFolderStructure

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-PackageTabTitle
        title: >-
          GeneralViewLayoutStrategy shall write the name of a package folder that has content in
          the folder's tab, and shall keep the name inside the body of a package that has no
          content (an exposed package without exposed members) and of a package collapsed by the
          depth limit.
        justification: |
          The SysML v2 graphical notation draws a package with its name in the tab when the
          package shows its members, and with its name inside the body when it shows none. Placing
          the name in the tab leaves the whole body to the members, which keeps the folder compact.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_PackageFolder_NameInTabOnlyWhenItHasContent

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NestedDefinitionContainment
        title: >-
          GeneralViewLayoutStrategy shall render a definition that owns nested definitions as a
          single box, with its nested definitions placed inside that box rather than as a
          duplicate sibling container.
        justification: |
          A definition that owns nested definitions (for example a part def containing further
          part def declarations) is one model element and must appear as exactly one box.
          Rendering it a second time as a separate sibling folder holding its own children is a
          duplicate-content defect that misrepresents the model's containment structure and
          confuses the reader.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxUnscoped
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxScoped

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ScopedBarePackageFolderSuppression
        title: >-
          When the view has a resolved expose scope, GeneralViewLayoutStrategy shall not render a
          bare package as a wrapping folder merely because it is an ancestor of admitted content;
          the package's admitted items shall be promoted directly to the diagram's root instead.
        justification: |
          An expose statement deliberately narrows a view to specific content. Wrapping that
          content's bare-package ancestor in a folder anyway — even though the package itself was
          never referenced by the expose scope — draws a container the scope did not request and
          misleadingly suggests the whole package is in view.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxScoped
          - GeneralViewLayoutStrategy_BuildLayout_ExposedNamespaceChildren_BarePackageAncestor_NoFolderRendered
          - GeneralViewLayoutStrategy_BuildLayout_ExposedDefinitionInsideBarePackage_NoAncestorFolderRendered

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Compartments
        title: >-
          GeneralViewLayoutStrategy shall populate a definition or usage box with compartments
          listing the owned usages that are shown as rows rather than as boxes of their own.
        justification: |
          The usages a box owns (attributes, plain ports, and, under an all-rows presentation,
          parts) are part of its shown content. Listing them in compartments lets a reader see
          an element's features without opening another view. An `event occurrence` usage is
          sequence data, not a feature of the element's shape, and is not listed.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionWithUsages_ProducesCompartments
          - GeneralViewLayoutStrategy_BuildLayout_EventOccurrenceUsage_IsNotACompartmentRow

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CompartmentTitles
        title: >-
          GeneralViewLayoutStrategy shall center the title of every compartment of a box and write
          it in italics.
        justification: |
          The SysML v2 graphical notation sets compartment titles (`attributes`, `parts`, `doc`,
          and so on) centered and in italics, which separates a compartment's title from its rows.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionWithUsages_ProducesCompartments

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CompartmentOrder
        title: >-
          GeneralViewLayoutStrategy shall list a definition box's compartments in a fixed
          order — documentation first, then attributes, enums, parts, and ports, then every
          other kind of compartment in declaration order — and shall title the compartment of
          enumerated values "enums".
        justification: |
          The SysML v2 graphical notation stacks a definition's compartments in a fixed order
          and titles the enumerated-value compartment "enums". A fixed order makes every box
          read the same way regardless of the order its members were declared in.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Compartments_AreInCanonicalOrder
          - GeneralViewLayoutStrategy_BuildLayout_EnumDefLiteralValues_ProducesEnumsCompartment

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Specialization
        title: >-
          GeneralViewLayoutStrategy shall connect a specialized definition to each of its
          supertypes present in the workspace with a line ending in an open end marker at the
          supertype, matching each supertype reference to its own resolved edge by the
          reference's exact text (never by name suffix), and shall draw no edge for a
          reference that has no resolved edge.
        justification: |
          Specialization (generalization) relationships are core model structure. Drawing them
          as open-end-marker lines toward the supertype matches diagram notation and makes the
          inheritance hierarchy visible. Two references that share a simple name (`:> Y::X, X`)
          must each reach their own target rather than both reaching the first name match, and
          an unresolved reference (`:> X, A` where only the alias `A` resolves to `P::X`) must
          not borrow the target another reference resolved to.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Subclassification_ProducesEdge
          - GeneralViewLayoutStrategy_BuildLayout_UnresolvedSupertypeAndAliasOfSameTarget_DrawsOneEdge
          - GeneralViewLayoutStrategy_BuildLayout_QualifiedAndBareSupertypesSharingName_DrawsBothEdges
          - GeneralViewLayoutStrategy_TryGetResolvedTarget_IdentifiedEdges_MatchesExactTextOnly
          - GeneralViewLayoutStrategy_TryGetResolvedTarget_NoIdentifiedEdges_ReportsNotKnown
          - GeneralViewLayoutStrategy_TryGetResolvedTarget_DuplicateAndQualifiedText_UsesExactKey

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-StdlibExclusion
        title: >-
          GeneralViewLayoutStrategy shall exclude standard-library definitions from the diagram,
          identifying them by origin (the workspace's seed-derived stdlib names) and never by
          name, so a user package named like a standard-library package is still drawn.
        justification: |
          The General View is meant to show the user's model, not the imported standard library.
          Excluding standard-library definitions keeps the diagram focused on user content;
          deciding by origin instead of by package name keeps a user package such as `Parts`
          visible.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_StdlibOnlyWorkspace_ReturnsMinimalCanvas
          - GeneralViewLayoutStrategy_BuildLayout_SeedStdlibNames_AreExcluded
          - GeneralViewLayoutStrategy_BuildLayout_UserPackageNamedLikeStdlibPackage_RendersUserMembersOnly
          - GeneralViewLayoutStrategy_BuildLayout_UserPackageNamedLikeStdlibPackage_StdlibMembersStayExcluded

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no user-defined definitions, GeneralViewLayoutStrategy shall
          return a minimal empty canvas with no nodes.
        justification: |
          A model with no user definitions has nothing to draw; returning a well-formed empty
          canvas lets the renderer produce a valid blank diagram rather than failing.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CompositeMembership
        title: >-
          GeneralViewLayoutStrategy shall connect each usage box to the box of the definition or
          usage that owns it with a solid line ending in a filled-diamond end marker at the owner
          when the usage is composite.
        justification: |
          Composite ownership (a part owning its sub-parts, a definition owning its parts and
          ports) is the core structural relationship of a General View and is drawn as a solid
          line with a filled diamond at the owner in the SysML v2 graphical notation.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_CompositeMembership_ProducesFilledDiamondEdge
          - GeneralViewLayoutStrategy_BuildLayout_PortFeature_ProducesFilledDiamondEdge
          - GeneralViewLayoutStrategy_BuildLayout_PilotPolicy_NestedUsageInUsage_ChainsOwners

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ReferenceMembership
        title: >-
          GeneralViewLayoutStrategy shall connect each usage box that is referential to the box of
          its owner with a solid line ending in a hollow-diamond end marker at the owner.
        justification: |
          A reference usage (and an attribute or enumeration usage when it is drawn as a box) does
          not own its value; the SysML v2 graphical notation shows that non-composite feature
          membership with a hollow diamond at the owner, distinct from the filled diamond of
          composite ownership.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ReferenceMembership_ProducesHollowDiamondEdgeAndDashedNode
          - GeneralViewLayoutStrategy_BuildLayout_AllUsages_AttributeUsage_IsNodeWithTypingAndHollowDiamond

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FeatureTyping
        title: >-
          GeneralViewLayoutStrategy shall connect each usage box to the box of the definition that
          types it with a solid line ending in a hollow-triangle-with-two-dots end marker at the
          definition (a conjugated typing connecting to the underlying port definition), and shall
          draw no typing edge for a usage whose type does not resolve to a box in the view.
        justification: |
          Feature typing is the relationship between a usage and its definition and is drawn with
          the triangle-and-two-dots glyph of the SysML v2 graphical notation. An unresolved type
          has no box to connect to; drawing nothing is consistent with every other reference kind
          of this unit, and the type remains readable in the usage's name line.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AllUsages_AttributeUsage_IsNodeWithTypingAndHollowDiamond
          - GeneralViewLayoutStrategy_BuildLayout_EnumTypedAttribute_ProducesFeatureTypingEdge
          - GeneralViewLayoutStrategy_BuildLayout_UsageTyping_UnresolvedType_ProducesNoTypingEdge
          - GeneralViewLayoutStrategy_BuildLayout_ConjugatedTyping_ShowsTildeAndTypesTheUsageByThePortDefinition
          - GeneralViewLayoutStrategy_BuildLayout_TwoAttributesSameType_ProducesTwoTypingEdgesWithoutException

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Connect
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Connect edge's source endpoint to the owning rendered box of its target endpoint with
          a solid line and no end marker, and shall draw no edge when both endpoints resolve to
          the same box (a genuine self-loop).
        justification: |
          `connect A to B;` (and a `message`'s from/to events) is a core SysML v2 relationship;
          rendering it with a plain solid line (no marker) matches OMG connector notation and
          distinguishes it from every other edge kind, all of which carry either a marker, a
          dashed style, or both. Suppressing same-box self-loops is required because a rarer,
          genuinely self-referential model shape (e.g. two sibling ports of the very same
          enclosing definition, with no distinguishing intermediate owner) would otherwise draw
          a self-loop with no informational value. The dominant real-world corpus shape — two
          sibling features declared directly in their owning `part def`s, referenced from an
          enclosing part via bare usages with no per-instance nested redeclaration — resolves to
          two *distinct* boxes (not a self-loop), verified end to end against the real
          `WorkspaceLoader`/`BuildLayout` pipeline.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Connect_DifferentOwningTypes_ProducesUnmarkedSolidEdge
          - GeneralViewLayoutStrategy_BuildLayout_Connect_SameOwningType_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_ConnectDominantShape_RealWorkspaceLoader_ProducesDistinctBoxes

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Allocate
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Allocate edge's source endpoint to the owning rendered box of its target endpoint with
          a solid line ending in an open chevron at the target, carrying a <c>«allocate»</c>
          midpoint label.
        justification: |
          `allocate A to B;` is the SysML v2 allocation relationship, drawn as a solid line with
          an open arrowhead and an explicit <c>«allocate»</c> stereotype label distinguishing it
          from an unlabeled, dashed Dependency edge that shares the same marker.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Allocate_ProducesSolidChevronEdgeWithLabel

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Dependency
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Dependency edge's source endpoint to the owning rendered box of its target endpoint
          with a dashed line ending in an open chevron at the target (the depended-upon
          element), carrying a midpoint label that is the dependency's declared name when it
          has one and `«depend»` otherwise.
        justification: |
          A standalone `dependency A to B;` declaration is the general OMG dependency
          relationship, rendered per convention as a dashed line with an open arrowhead pointing
          at the depended-upon element, distinct from the solid line of an allocation. The
          Pilot labels the edge with its relationship keyword, as the other labeled
          relationships here are, and a named dependency identifies itself by its name.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Dependency_ProducesDashedChevronEdge
          - GeneralViewLayoutStrategy_BuildLayout_Dependency_Named_ShowsDeclaredNameInsteadOfKeyword

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Binding
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Binding edge's source endpoint to the owning rendered box of its target endpoint with
          a solid line and no end marker, carrying a <c>=</c> midpoint label.
        justification: |
          `bind A = B;` (a binding connector) asserts equality between its two connector ends;
          rendering it as a solid, unmarked line (matching `Connect`'s notation, since both are
          connector-shaped relationships) with an explicit <c>=</c> midpoint label distinguishes
          it from a plain `Connect` edge while preserving the shared connector notation.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Binding_ProducesSolidEdgeWithEqualsLabel

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-SatisfyVerify
        title: >-
          GeneralViewLayoutStrategy shall connect the nearest rendered box of each resolved
          satisfy or verify relationship's source to the nearest rendered box of the requirement
          with a solid line ending in an open arrowhead at the requirement, carrying a
          <c>«satisfy»</c> or <c>«verify»</c> midpoint label.
        justification: |
          `satisfy` and `verify` relate a design element or a verification to the requirement it
          addresses and are drawn as solid lines with an open arrowhead and a keyword label in the
          SysML v2 graphical notation. The relating element is often a nested declaration (an
          objective, a subject) that has no box of its own, so it is drawn on the nearest box that
          contains it.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Satisfy_ProducesSolidOpenArrowEdgeWithKeywordLabel
          - GeneralViewLayoutStrategy_BuildLayout_Verify_NestedSourceMapsToNearestRenderedBox
          - GeneralViewLayoutStrategy_BuildLayout_SatisfyAndVerifyOfSamePair_DrawTwoEdgesAndRepeatsCoalesce

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ImportEdges
        title: >-
          GeneralViewLayoutStrategy shall connect the folder or box of each importing namespace to
          the folder or box of the namespace it imports with a dashed line ending in an open
          arrowhead at the imported namespace, labeled <c>«import»</c> for a membership import,
          <c>«import»*</c> for a namespace import, and <c>«import»**</c> for a recursive import,
          and shall draw one edge per distinct importer, imported namespace, and import kind
          (imports of different kinds between the same pair each keep their edge and label, an
          exact repeat draws one), and shall draw nothing for an import of the standard library,
          of an unrendered namespace, or between a namespace and a namespace nested in it.
        justification: |
          Imports make the structure of a multi-package model readable: they show which package
          depends on which. The SysML v2 graphical notation draws them as dashed lines with an open
          arrowhead and the import kind as the label. The standard library is excluded from the
          diagram, and a package nested in its importer is already visible by containment, so
          neither would add information.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Imports_ProduceDashedOpenArrowEdgesLabeledByKind
          - GeneralViewLayoutStrategy_BuildLayout_Imports_StdlibAndContainedNamespace_DrawNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_Imports_NamespaceAndRecursiveOfSamePackage_DrawTwoEdgesWithDistinctLabels
          - GeneralViewLayoutStrategy_BuildLayout_Imports_MembershipAndNamespaceOfSameTarget_DrawTwoEdgesWithDistinctLabels
          - GeneralViewLayoutStrategy_BuildLayout_Imports_ExactDuplicate_DrawsOneEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Subsetting
        title: >-
          GeneralViewLayoutStrategy shall connect a usage box that declares a `subsets`/`:>`
          reference to the box of the subsetted usage with a solid line ending in a hollow-triangle
          end marker at the subsetted usage, matching each subsetted reference to its own resolved
          edge by the reference's exact text, and shall draw no edge when the reference cannot be
          resolved (including when only another reference of the same usage, such as an alias of
          the same usage, resolved) or resolves back to the subsetting usage itself.
        justification: |
          Subsetting is the SysML v2 relationship by which a usage narrows another usage; the
          graphical notation draws it between the two usages with the hollow triangle that also
          marks specialization, since both express an "is-a-kind-of" narrowing. A subsetting
          between two usages of the same definition and one that crosses a specialization boundary
          are both drawn between the usage boxes themselves. An unresolved or self-referential
          reference has nothing to connect, so nothing is drawn.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Subsetting_CrossesSpecializationBoundary_ProducesSolidHollowTriangleUsageEdge
          - GeneralViewLayoutStrategy_BuildLayout_SameDefinitionSubsetting_ProducesUsageToUsageEdge
          - GeneralViewLayoutStrategy_BuildLayout_SelfReferentialSubsetting_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_UnresolvedSubsettingAndAliasOfSameFeature_DrawsOneEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ReferenceSubsetting
        title: >-
          GeneralViewLayoutStrategy shall connect a usage box that declares a `::>` reference to
          the box of the referenced usage with a solid line ending in a
          hollow-triangle-with-four-dots end marker at the referenced usage, and shall draw no
          edge when the reference cannot be resolved.
        justification: |
          Reference subsetting is the SysML v2 relationship by which a usage references another
          usage, drawn with the triangle-and-four-dots glyph of the graphical notation. Resolving
          the reference by name resolution lets the glyph connect the actual usages; an
          unresolved reference draws nothing, as for every other reference kind of this unit.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ReferenceSubsetting_ProducesHollowTriangleFourDotsEdgeOnlyWhenResolved

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NonStructuralMembership
        title: >-
          GeneralViewLayoutStrategy shall draw neither a membership edge nor a typing edge for a
          feature that is shown as a compartment row — an attribute, an enumeration value, a
          plain reference usage, or a port without nested features.
        justification: |
          A feature shown as a row is fully described by the row, which already shows its type.
          Joining it to its owner or to its type by an edge would add a line for every attribute
          of every definition and bury the structural relationships of the diagram.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AttributeFeature_DoesNotProduceDiamondEdge
          - GeneralViewLayoutStrategy_BuildLayout_AttributeTyping_RowDrawsNoTypingEdge
          - GeneralViewLayoutStrategy_BuildLayout_PlainPort_IsRowOfOwnerPortsCompartment

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-LayeredPlacement
        title: >-
          GeneralViewLayoutStrategy shall place definitions and usages through the bundled
          DemaConsulting.Rendering.Layout hierarchical layout engine so that no two boxes overlap
          — including many unconnected boxes of one package — and every package folder stays
          clear of the others.
        justification: |
          The whole General View is expressed as a single input LayoutGraph — package folders as
          container nodes, definitions and usages as leaves — and placed with one LayoutEngine.Layout
          call via the "auto" meta-algorithm (AutoLayoutAlgorithm): the root scope and each
          folder's own contents are classified by connectivity, routing connected groups through
          the bundled layered algorithm (LayeredLayoutAlgorithm) and packing disconnected or
          singleton nodes by reading order (ContainmentLayoutAlgorithm). Delegating the whole
          placement, including cross-container edge
          anchoring, to Rendering's own engine gives the General View ELK-style box placement and
          orthogonal edge routing without SysML2Tools duplicating any layout logic. The observable
          guarantee that matters to readers is that boxes and folders never overlap, regardless of
          model size or density, so the diagram stays legible without manual layout hints; a
          layered algorithm pinned to a folder was observed to stack unconnected boxes of one layer
          on top of each other, so the unconnected case is guarded explicitly.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AdaptiveGap_DenseModelProducesNonOverlappingBoxes
          - GeneralViewLayoutStrategy_BuildLayout_HeatLayout_ConnectedModelKeepsBoxesSeparated
          - GeneralViewLayoutStrategy_BuildLayout_HeatLayout_SparseModelProducesCompactCanvas
          - GeneralViewLayoutStrategy_BuildLayout_TopDown_UnconnectedDefinitionsDoNotOverlap

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Direction
        title: >-
          GeneralViewLayoutStrategy shall flow the diagram from top to bottom: the owner and the
          supertype shall be placed above the usage or definition that is owned by it or
          specializes it, and the definition that types a usage shall be placed below the usage;
          each connector shall keep its notation direction, with its end marker on the owner,
          the supertype, or the typing definition.
        justification: |
          The SysML v2 reference implementation and the training material draw the owner and the
          general element on top, so a reader scans the diagram from the most general element down
          to the most specific. A definition typing a usage hangs below the usage it types, which
          keeps each definition close to the usages that rely on it instead of forming a rigid tier
          above every usage. The marker still sits on the end the notation prescribes, whatever
          direction the picture flows.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_TopDown_OwnerAndGeneralAboveUsageAndDefinitionBelow

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-LayoutCompactness
        title: >-
          GeneralViewLayoutStrategy shall keep a General View of one definition that owns several
          usages compact: the usages of the owner shall share one row directly below it, each
          definition typing a usage shall hang below that usage, and the drawing shall stay within
          a readable size.
        justification: |
          A General View that grows several thousand pixels wide cannot be read in documentation
          or shown on one page. Placing every usage of an owner in one row below it and each
          typing definition below its usage, instead of in rigid tiers above every usage, keeps
          the diagram a short tree whose size grows with the model rather than with its
          relationships.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DroneLikeModel_IsCompactAndTopDown

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CanvasFit
        title: >-
          GeneralViewLayoutStrategy shall size the canvas so that every connector of the drawing,
          including a connector joining two top-level package folders, lies entirely inside it.
        justification: |
          A connector that leaves the canvas is clipped by the renderers, which hides a
          relationship between packages. The layout engine does not grow the canvas for such a
          connector, so the strategy fits the canvas to the connectors itself.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_TopDown_ConnectorsBetweenRootFolders_StayInsideCanvas

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-EndDecorationClearance
        title: >-
          GeneralViewLayoutStrategy shall give every connector end decoration that is reached
          over a lane (a connector with two bends) a straight final leg at least as long as the
          decoration plus one corner radius, and shall keep the lanes of one box face distinct,
          ordered, and at least one lane pitch apart.
        justification: |
          A connector that bends within the length of its own end decoration (a diamond or a
          triangle at an owner) leaves sideways from the decoration's tip instead of from a clean
          approach, so the decoration looks torn from the line. The layout engine reserves this
          approach only at the target end of an edge, and the General View declares most edges
          reversed so that the owner is drawn on top, which puts the decoration at the engine's
          source end. The strategy therefore moves the lanes of that face away from the box by the
          shortfall, as the engine would at a target end.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_OwnerFanOut_EndDecorationsHaveCleanApproach
          - GeneralViewLayoutStrategy_BuildLayout_SpecializationAndReferenceUsageFanOut_EndDecorationsHaveCleanApproach
          - GeneralViewLayoutStrategy_BuildLayout_FanOutLanes_KeepDistinctOrderedLanes
          - GeneralViewLayoutStrategy_BuildLayout_GalleryGeneralViews_EndDecorationsHaveCleanApproach
          - GeneralViewLayoutStrategy_ClearEndDecorations_NoViolation_ReturnsTreeUnchanged
          - GeneralViewLayoutStrategy_ClearEndDecorations_LShapedConnector_IsLeftAlone
          - GeneralViewLayoutStrategy_ClearEndDecorations_ShortFinalLeg_MovesLaneAwayFromOwner
          - GeneralViewLayoutStrategy_ClearEndDecorations_NoRoomOnFarLeg_LeavesConnectorUnchanged

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UnconnectedDefinitionPlacement
        title: >-
          GeneralViewLayoutStrategy shall place the definitions that no relationship touches in the
          free space of the drawing, inside the bounds of the connected part and clear of every
          box, connector, and connector label, when they fit and the canvas becomes smaller than
          with the layout engine's own packing; otherwise it shall keep the engine's packing, and a
          scope whose boxes are all unconnected shall keep the engine's packing.
        justification: |
          The layout engine packs every box without a relationship into one block beside the
          connected drawing. In a wide tree this leaves a large empty corner, so the leaf blocks
          cover a small share of a canvas that is wider than its content. Placing those boxes in
          the free space of the drawing, and never when that would not shrink the canvas or not
          fit, keeps the diagram compact without ever making a layout worse than the engine's.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ManyUnconnectedDefinitions_AreTuckedIntoFreeCornerOfWideTree
          - GeneralViewLayoutStrategy_BuildLayout_UnconnectedDefinitions_NoFreeSpace_KeepEngineShelf
          - GeneralViewLayoutStrategy_BuildLayout_UnconnectedDefinitions_InNestedFolder_AreTuckedInsideThatFolder
          - GeneralViewLayoutStrategy_BuildLayout_AllDefinitionsUnconnected_KeepsEngineLayout
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionWithCommentNote_IsNotDeferred
          - GeneralViewLayoutStrategy_BuildLayout_DroneGalleryModel_MeetsBlockPlacementCriteria

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeScoping
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          GeneralViewLayoutStrategy shall scope the diagram to the union of each edge's target
          containment subtree, resolved through the target's own type reference when the target
          is a usage rather than a definition.
        justification: |
          `expose <name>;` is the only real content-scoping mechanism a view has in SysML v2 —
          `render <target>;` names a rendering style/format (e.g. `asTreeDiagram`,
          `asElementTable`), never content, so it plays no role in scoping. Scoping the diagram
          to the union of every resolved `expose` target's containment subtree makes `expose`
          statements finally have an observable effect, matching the SysML v2 view mechanism's
          subject-scoping intent. When an exposed target resolves to a feature usage rather than
          a definition, its own containment subtree is typically empty — the real content lives
          under its type's subtree — so the target's own resolved type reference is additionally
          followed to include that type's subtree, fixing the usage-vs-definition containment gap.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ExposedName_UnionsAdditionalSubtree
          - GeneralViewLayoutStrategy_BuildLayout_ExposedUsage_ResolvesThroughTypingToDefinitionSubtree

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeBracketFilterEvaluation
        title: >-
          When a view's `expose <path>::**[<expr>];` entry carries a bracket-filter expression that
          parses and evaluates successfully (Phase 2a), GeneralViewLayoutStrategy shall narrow that
          entry's contribution to the resolved scope to only the descendant definitions the
          expression matches, rather than that entry's whole containment subtree, while every
          other `expose` entry in the same view continues to contribute unaffected.
        justification: |
          The bracket form is the dominant real-world `expose` shape (10/10 sampled OMG corpus
          instances). Making it an effective per-entry filter — not merely captured raw text —
          gives `expose <path>::**[<expr>];` its full SysML v2 meaning, matching how the standalone
          `filter [<expr>];` statement already narrows the whole view's resolved scope.
        tests:
          - ResolveExposedScope_BracketFilterEvaluatesSuccessfully_NarrowsToMatchedDefinitionsOnly
          - ResolveExposedScope_MixedFilteredAndUnfilteredEntries_NarrowsIndependently
          - DiagramRenderer_RenderWorkspace_BracketExposeMandatorySafetyView_FiltersToMandatoryPart

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — because the view has no
          `expose` statement, its ViewNode is null (e.g. the `--auto` synthesized view), or its
          every declared `expose` entry failed to resolve — GeneralViewLayoutStrategy shall
          render the full workspace, unchanged from its pre-scoping behavior, regardless of
          whether `RenderTargetName`/`FilterExpressionText` are present.
        justification: |
          Nearly every real-world view declares no `expose` statement at all, so rendering the
          full workspace must remain the default. This also guards against a bogus `expose <name>;`
          silently rendering nothing: an unresolvable exposed name (e.g. a typo) falls back to
          full-workspace rendering (with the unresolved-reference diagnostic already surfaced by
          `ReferenceResolver`) rather than producing a broken or empty diagram. `RenderTargetName`
          (a rendering-style/format selector, not content) never affects this decision.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_RenderTargetNameOnly_NoExposeEdges_RendersFullWorkspace
          - GeneralViewLayoutStrategy_BuildLayout_NullViewNode_RendersFullWorkspaceUnchanged

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterEvaluation
        title: >-
          When a view's FilterExpressionText parses as a supported Phase 1 filter expression,
          GeneralViewLayoutStrategy shall evaluate it against the already expose-scoped candidate
          definitions and shall render only the matched subset, including an empty canvas when no
          candidate matches.
        justification: |
          Standalone `filter [<expr>];` is the user-visible mechanism for narrowing a view by
          metadata once the expose scope has been resolved. Applying the predicate after expose
          scoping preserves the meaning of both statements: `expose` chooses the candidate scope,
          then `filter` further narrows it.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionMatchesNothing_RendersEmpty
          - DiagramRenderer_RenderWorkspace_SafetyPartsView_FiltersToAnnotatedParts
          - DiagramRenderer_RenderWorkspace_MandatorySafetyPartsView_FiltersToMandatoryPart

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterFallbackWarning
        title: >-
          When a view's FilterExpressionText fails to parse or uses a construct outside the Phase 1
          subset, GeneralViewLayoutStrategy shall emit a warning stating that the filter expression
          could not be evaluated and shall continue rendering the unfiltered resolved scope.
        justification: |
          Unsupported filter constructs are an expected Phase 1 boundary, not a crash condition.
          Falling back to the unfiltered scope while surfacing a visible warning preserves a usable
          diagram and makes the limitation explicit.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionPresent_EmitsNotYetEvaluatedWarning

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageLevelCandidates
        title: >-
          GeneralViewLayoutStrategy shall admit named usage-level declarations (feature usages),
          not only definitions, as filter/render candidates, so a metaclass-kind classification
          filter (e.g. `filter @SysML::PartUsage;`) that targets usages has matching candidates to
          narrow, and shall render such a usage-level candidate as a box of its own unless it is
          shown as a compartment row of an independently-rendered owner.
        justification: |
          The set of filter candidates and the set of rendered boxes come from the same pass over
          the model. Real-world corpus filters (e.g. OMG's `42.Views/ViewsExample.sysml`,
          `filter @SysML::PartUsage;`) classify by usage-level metaclass/kind, which a
          definitions-only candidate set could never satisfy — such a view would render empty
          rather than narrowed. Widening the candidate set to include named usages is deliberate,
          but a usage that its rendered owner already lists as a compartment row (an attribute, a
          plain port) must not also get a box, which would duplicate it and more than double the
          box count of real corpus models. A usage that is drawn as a box is kept when its owner
          was excluded by scope or filter, and a usage nested several levels deep is never dropped
          merely because an intermediate usage is shown as a row.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_QualifiedPartUsageFilter_RendersOnlyPartUsages
          - GeneralViewLayoutStrategy_BuildLayout_BarePartUsageFilter_RendersOnlyPartUsages
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_RendersUsageLevelCandidatesToo
          - GeneralViewLayoutStrategy_BuildLayout_OmgSafetyFeatureViewsFixture_ScopesToExposedVehicleSubtree
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_ExcludesUsageNestedInsideRenderedDefinition
          - GeneralViewLayoutStrategy_BuildLayout_MetaclassFilter_KeepsNestedUsageWhenParentExcluded
          - GeneralViewLayoutStrategy_BuildLayout_DroneGalleryModel_RendersExactly21BoxesMatchingCheckedInSvg
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_RendersDeeplyNestedGrandchildUsageWhenIntermediateParentExcluded

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-DroppedRelationshipEdgeWarning
        title: >-
          When a Connect/Allocate/Dependency/Binding edge's endpoint fails to resolve to a
          rendered box, or both endpoints resolve to the same box (a genuine self-loop),
          GeneralViewLayoutStrategy shall emit a warning naming the edge kind, its raw
          source/target references, and a short reason, rather than silently dropping the edge.
          An unresolved-endpoint drop caused solely by the endpoint falling outside an active
          `expose` scope narrowing is expected behavior and shall not be reported.
        justification: |
          A dropped relationship edge with no rendered box was previously indistinguishable from
          correct behavior — the diagram simply omitted it, with no signal to the user that a
          model reference failed to resolve or collapsed into an unintended self-loop. This
          defense-in-depth diagnostic makes any residual or future resolution gap visible,
          matching the same visible-not-silent principle already applied by
          `ForUnevaluatedFilter`/`ForUnevaluatedExposeBracketFilter`. Excluding drops caused by
          ordinary `expose` scope narrowing avoids misleading noise for a relationship whose
          endpoint is simply, and correctly, outside the exposed subtree by design.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Connect_SameOwningType_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_ConnectDominantShape_RealWorkspaceLoader_ProducesDistinctBoxes

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-QualifiedForm
        title: >-
          GeneralViewLayoutStrategy shall connect a usage box that declares a qualified
          `Owner::feature` `redefines`/`:>>` reference to the box of the named redefined usage with
          a solid line ending in a hollow-triangle-with-crossbar end marker at the redefined usage.
        justification: |
          `redefines`/`:>>` feature redefinition is core SysML v2 model structure; the graphical
          notation draws it between the redefining and the redefined usage with the
          triangle-and-crossbar glyph. A qualified reference names the redefined usage directly,
          matching the shape observed in the OMG corpus (e.g.
          `test/SysMLModels/OMG/validation/01-PartsTree/1a-PartsTree.sysml`'s qualified
          `redefines Vehicle::mass`).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_QualifiedRedefinition_ProducesHollowTriangleCrossbarEdgeToRedefinedUsage

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-BareNameForm
        title: >-
          GeneralViewLayoutStrategy shall connect a usage box that declares a bare-name
          `redefines`/`:>>` reference to the box of the usage that the nearest ancestor of its
          owner declares with that name, found by walking the owner's own supertype chain
          transitively, with a solid line ending in a hollow-triangle-with-crossbar end marker at
          that usage.
        justification: |
          The dominant real-world shape for `redefines` per the SysML v2 spec is a bare name
          referencing a member the owner inherits, matching the shape observed in the OMG
          corpus (e.g.
          `test/SysMLModels/OMG/training/05.Redefinition/RedefinitionExample.sysml`'s bare-name
          `redefines eng`). Resolving transitively (not just one supertype hop) is required
          because the declaring ancestor is frequently two or more hops away from the redefining
          usage's owner.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_BareNameRedefinition_ProducesHollowTriangleCrossbarEdge
          - GeneralViewLayoutStrategy_BuildLayout_TransitiveBareNameRedefinition_ProducesHollowTriangleCrossbarEdgeToDeclaringAncestorUsage

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-NoEdgeOnFailure
        title: >-
          GeneralViewLayoutStrategy shall produce no redefinition edge and no diagnostic when a
          `redefines`/`:>>` reference cannot be resolved to any ancestor member, or when it
          resolves back to the redefining usage itself.
        justification: |
          Graceful degradation for an unresolvable or self-referential redefinition reference is
          consistent with how every other reference kind in this unit behaves on failure: false
          edge is drawn, and diagram layout must never throw for a reference that cannot be
          resolved.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_UnresolvableRedefinition_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_SelfReferentialRedefinition_ProducesNoEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AnnotationNote
        title: >-
          GeneralViewLayoutStrategy shall render one `BoxShape.Note` box per definition or usage
          rendered as a box that carries exposed `comment` annotations satisfying the view
          conditions, connected to the
          element's box by a plain dashed line with no end marker (SysML 8.2.3.4 comment-node
          and annotation-link), containing the Comment text (multiple comments concatenated with a
          blank-line separator into a single note), and shall emit no note box for an element
          with no such comments. A usage that stays a compartment row draws no note.
        justification: |
          The ROADMAP's "Annotating elements" gap: `comment` annotations were already
          captured into SysmlNode.Annotations by AstBuilder but never rendered anywhere in the
          General View, silently discarding real model content. `AddAnnotationNote` implements
          this as an ordinary `LayoutGraph` node/edge pair added during the same single-pass
          `BuildGraph` traversal that builds each definition's own box — a deliberate,
          documented deviation from a literal post-layout marker-decoration approach (as used
          by `AddInitialMarker` in the State Transition View), chosen because this strategy
          builds its entire graph in one pass with no separate decoration phase. One note per
          annotated element (not one note per annotation) keeps the diagram from fragmenting
          into many small boxes when an element has several `comment`s. `doc` annotations are
          excluded: drawn as notes they made general views of fully documented models
          unreadable; documentation is drawn as a compartment instead (see DocumentationCompartment).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AnnotatedDefinition_EmitsNoteBox
          - GeneralViewLayoutStrategy_BuildLayout_UnannotatedDefinition_EmitsNoNoteBox
          - GeneralViewLayoutStrategy_BuildLayout_MultipleAnnotations_ProduceOneNoteBox

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageDocAndComment
        title: >-
          GeneralViewLayoutStrategy shall draw the `doc` of a usage that is rendered as a box of its
          own as a compartment of that usage's box, and a `comment` on such a usage as a note joined
          to that usage's box, rather than attaching either to the usage's owner. Under the default
          node policy, an attribute, a plain reference, or a port without nested features stays a
          compartment row of its owner, and its documentation and comments are not drawn.
        justification: |
          Documentation and comments belong to the element they are written on. A nested part is
          a box of its own, so its documentation and notes must appear on that box; attaching them
          to the owner would misattribute the text, and showing the part only as a row of its owner
          would lose them. A usage that stays a row has no box to carry its documentation or
          comments, and the OMG Pilot implementation likewise draws neither; the specification
          permits a dashed annotation link from a note to the row, which is recorded as a
          follow-up in the ROADMAP rather than claimed here.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_NestedPartDocAndComment_AttachToOwnNode

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-SameNamedDefinitions
        title: >-
          GeneralViewLayoutStrategy shall attach each specialization, membership, typing,
          redefinition, and subsetting edge to the definition the reference resolves to — the
          semantic model's resolved target, else KerML 8.2.3.5 name resolution (redefined features
          against the owning type's general types) — shall not draw an edge for a reference that
          does not resolve (no bare simple-name matching), and shall map relationship endpoints
          that are already qualified only to the box with that qualified name or its owning typed
          feature, never to a same-named box elsewhere. The semantic model's resolved target
          already applies KerML member visibility, filtered imports, import scoping, and file-root
          imports, so it is used as resolved; a reference those rules reject has no semantic edge
          and is not drawn.
        justification: |
          Packages commonly reuse a simple name for distinct definitions. Wiring every usage to
          the first same-named box drew one box connected to several unrelated systems plus
          unconnected duplicates, misrepresenting the architecture. Trusting the semantic edge
          keeps the diagram consistent with the model's resolved references; matching an
          unresolved reference to a same-named element elsewhere would draw a relationship the
          model does not contain, so an unresolved reference is rendered as unresolved (the load
          diagnostic reports it).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_SameNamedDefsInSiblingPackages_WiresEachToItsOwn
          - GeneralViewLayoutStrategy_BuildLayout_SameSimpleNameInUnrelatedPackage_DrawsNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_UnrenderedQualifiedEndpoint_IsNotMappedBySimpleName
          - GeneralViewLayoutStrategy_BuildLayout_UnresolvedSubsettingAndRedefinition_DrawNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_FileRootImportSubsettingAndRedefinition_DrawsEdges
          - GeneralViewLayoutStrategy_BuildLayout_PrivateMemberReference_DrawsNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_FilteredOutImportCandidate_DrawsNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_ImportOfSiblingPackage_DoesNotResolveForThisPackage

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ViewConditions
        title: >-
          GeneralViewLayoutStrategy shall render an exposed element — a definition, usage, `doc`, or
          `comment` — only when it satisfies every owned and inherited view condition (`filter`
          expressions, including metaclass classification tests such as `@SysML::Documentation`
          combined with `not`/`and`/`or`) and, when exposed through an expose filter
          (`expose P::**[expr];`), that filter.
        justification: |
          SysML 7.26.2 and 8.3.26.11 (`exposedElement`/`includeAsExposed`): a view artifact is
          generated by importing the exposed elements, filtering them by the owned and inherited
          view conditions, then rendering them; expose filters are the alternate per-import form.
          This is the standard way to exclude documentation (`filter not @SysML::Documentation;`).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FilterNotDocumentation_HidesDocButKeepsComment
          - GeneralViewLayoutStrategy_BuildLayout_PositiveFilterExcludingDocumentation_HidesDoc
          - GeneralViewLayoutStrategy_BuildLayout_InheritedViewCondition_HidesDoc
          - GeneralViewLayoutStrategy_BuildLayout_ViewTypedByStandardViewDefinition_AppliesOwnConditions
          - GeneralViewLayoutStrategy_BuildLayout_ExposeFilterNotDocumentation_HidesDoc

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-DocumentationCompartment
        title: >-
          GeneralViewLayoutStrategy shall render each exposed `doc` (Documentation) of an element
          rendered as a box that satisfies the view conditions as a `doc` compartment inside the
          element's
          own box — never as a separate note — word-wrapped into rows that fit the box width
          (widening a narrow box to a minimum readable column); documentation is exposed with its
          owner's members (`expose X::**;`, `expose X::*;`, or an unscoped view), not by a bare
          `expose X;`. The documentation of a usage that stays a compartment row is not drawn.
        justification: |
          KerML 7.2.4.2: documentation is an owned member of the documented element, so exposing
          an element's members exposes its documentation. SysML 8.2.3.4 provides the
          documentation-compartment notation, which keeps documentation visually owned by its
          element without extra boxes or leader lines; wrapping prevents very wide boxes.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DocumentationByDefault_RendersWrappedDocCompartment
          - GeneralViewLayoutStrategy_BuildLayout_MembershipExpose_ExposesDocOnlyWhenRecursive
          - GeneralViewLayoutStrategy_WrapText_LongWord_IsHardBroken

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-RequirementConstraintCompartments
        title: >-
          GeneralViewLayoutStrategy's Pluralize helper shall title a "subject", "assume
          constraint", "require constraint", or "constraint" feature compartment with the
          guillemet-wrapped stereotype form («subject», «assume constraint», «require
          constraint», «constraint») rather than the generic pluralized-keyword form, and
          FormatFeatureRow shall render a feature with a non-empty ExpressionText as its raw
          expression text (optionally prefixed with "name: ") instead of the generic "name :
          Type [multiplicity]" shape.
        justification: |
          These compartment kinds are new to AstBuilder's output (subject/actor/stakeholder/
          constraint members, enum literal values) and the plain pluralized-keyword default
          ("subjects", "assume constraints", ...) does not match the stereotype convention this
          file already applies to other individually-significant single-member compartments
          (e.g. the pre-existing `«allocate»` edge-label convention reused here), nor would a
          generic name/type row correctly convey a constraint's actual expression content.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_RequirementSubject_UsesGuillemetTitle
          - GeneralViewLayoutStrategy_BuildLayout_ConstraintFeatures_ShowExpressionText
          - GeneralViewLayoutStrategy_BuildLayout_EnumDefLiteralValues_ProducesEnumsCompartment

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposedPackageNodes
        title: >-
          In an `expose`-scoped view, GeneralViewLayoutStrategy shall draw each package that is
          itself exposed (`expose P;` or `expose P::**;`) and satisfies the view conditions as a
          package node containing whichever
          of its members are also exposed — an empty package node when none are — drawing an
          exposed package that is nested inside another exposed package inside that package's node,
          and shall not draw
          a package that is only an ancestor of exposed elements (`expose P::*;` exposes P's members
          but not P).
        justification: |
          SysML 8.3.26.3/8.3.26.4 and KerML 8.3.2.4.4: a MembershipExpose exposes the named
          membership (the package element itself) and, if recursive, its members; a
          NamespaceExpose exposes only the namespace's members. Exposed packages render with the
          package-node notation of SysML 8.2.3.5.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_BarePackageExpose_DrawsEmptyPackageNode
          - GeneralViewLayoutStrategy_BuildLayout_BarePackageExposeWithDepthLimitOne_HasNoTruncationIndicator
          - GeneralViewLayoutStrategy_BuildLayout_ViewConditionOnExposedPackage_KeepsOrRemovesPackageNode
          - GeneralViewLayoutStrategy_BuildLayout_NamespaceExpose_DrawsMembersWithoutPackageNode
          - GeneralViewLayoutStrategy_BuildLayout_RecursivePackageExpose_DrawsPackageNodeWithMembers
          - GeneralViewLayoutStrategy_BuildLayout_ScopedExpose_NestedExposedPackageInsideOwner

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NestedPackageFolders
        title: >-
          GeneralViewLayoutStrategy shall draw a package that is nested inside another drawn
          package as a folder inside the owning package's folder, shall draw an enclosing
          package's folder even when that package owns no definitions directly, and shall count
          each enclosing package folder as one nesting level when applying the depth limit.
        justification: |
          A nested package is part of its owner. Drawing it as a separate folder beside the owner
          hides that ownership and, because the layout can then only relate the two folders as
          peers, prevents relationships between their members from being drawn in the owner's
          context. Counting every enclosing folder as a nesting level keeps the depth limit
          consistent with how definitions nested inside definitions are already counted, and a
          collapsed folder must still hide everything beneath it.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackage_RendersInsideOwnerFolder
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackage_ParentWithoutDirectItems_CreatesEnclosingFolder
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackages_DepthLimit_CountsPackageNesting
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackagesGalleryModel_RendersFoldersNestedAndCrossPackageEdges

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CrossContainerEdges
        title: >-
          GeneralViewLayoutStrategy shall draw every model relationship whose two endpoints are both
          drawn, including one whose endpoints lie in different packages or at different nesting
          depths, as a connector between the two endpoint boxes themselves, declared in the
          innermost container that encloses both endpoints, shall keep two distinct relationships
          between the same two definitions as two separate connectors in every container, and
          shall draw none for a relationship that touches a depth-truncated definition.
        justification: |
          Relationships between definitions of different packages (a specialization across
          sibling packages, a part typed by a definition of a nested package) are core model
          structure. Declaring each in the lowest common ancestor scope lets the layout engine
          route it to the actual endpoint boxes instead of dropping it or stopping at a package
          border; a relationship to a hidden definition has no box to connect to. The connectors
          then do not cross (see ExternalEdgesDoNotCross).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_SiblingPackages_DeclaredAtRootAndRoutedToNestedBoxes
          - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_NestedVersusOuter_DeclaredInOuterScope
          - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_SiblingNestedPackages_DeclaredInCommonParent
          - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_DeepNestingAcrossTopLevelPackages_DrawsEdge
          - GeneralViewLayoutStrategy_BuildLayout_EdgeBetweenContainerAndOwnDescendant_DoesNotThrow
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackages_DepthLimit_EdgeToTruncatedPackageIsDropped
          - GeneralViewLayoutStrategy_BuildLayout_ParallelEdgesInNestedPackage_AreNotMerged
          - GeneralViewLayoutStrategy_BuildLayout_ParallelEdgesInDefinitionContainer_AreNotMerged
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackagesGalleryModel_RendersFoldersNestedAndCrossPackageEdges

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExternalEdgesDoNotCross
        title: >-
          GeneralViewLayoutStrategy shall draw the relationships that leave a package folder
          without crossing one another, whatever order the folder's definitions were declared in.
        justification: |
          The layout engine places a container's contents knowing where that container's outgoing
          relationships lead and orders them so the routed connectors cross as little as possible
          (see SysML2Tools-OTS-DemaRendering-ContainerOrderFollowsCrossHierarchyEdges), so the
          strategy adds the folder's definitions in declaration order and an arbitrary declaration
          order must not force relationship crossings. A definition without external relationships,
          a folder without any, and a relationship to a hidden definition leave the order untouched.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ExternalEdges_DeclarationOrder_DoesNotMoveBoxes
          - GeneralViewLayoutStrategy_BuildLayout_NoExternalEdges_KeepsDeclarationOrder
          - GeneralViewLayoutStrategy_BuildLayout_ExternalEdgeToTruncatedPartner_DoesNotThrowAndKeepsOrder
          - GeneralViewLayoutStrategy_BuildLayout_ExternalEdges_DeepNesting_DoNotCross
          - GeneralViewLayoutStrategy_BuildLayout_ExternalEdges_DefinitionToSiblingNestedPackages_DoNotCross
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackagesGalleryModel_RendersFoldersNestedAndCrossPackageEdges

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-TruncatedContainerDecoration
        title: >-
          GeneralViewLayoutStrategy shall mark each depth-truncated package folder with a bare
          ellipsis (…) label on that folder's own placed box, independent of the order in which
          the layout engine emits a scope's boxes.
        justification: |
          The ellipsis tells the reader that content was collapsed by the depth limit. A label
          attached to the wrong box (because the engine emitted boxes in a different order than
          the nodes were added) would misreport which folder is collapsed.
        tests:
          - GeneralViewLayoutStrategy_DecorateTruncated_LineBeforeBoxes_DoesNotBreakBoxToNodePairing
          - GeneralViewLayoutStrategy_DecorateTruncated_BoxOrderDiffersFromNodeOrder_DecoratesMatchingNode
          - GeneralViewLayoutStrategy_BuildLayout_NestedPackages_DepthLimit_CountsPackageNesting
          - GeneralViewLayoutStrategy_BuildLayout_PackageFolderContents_DepthLimitOne_StillTruncatesFolder

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-TruncatedDefinitionMarker
        title: >-
          When the depth limit hides the definitions nested inside a definition,
          GeneralViewLayoutStrategy shall draw that definition as a single box whose last
          compartment is an untitled ellipsis (…) row, after any compartments it already has,
          instead of drawing the hidden definitions.
        justification: |
          The SysML v2 graphical notation ends a compartment stack with an ellipsis to show that
          further contents exist but are not shown. Reusing that marker for depth-truncated
          nested definitions tells the reader content was omitted without adding a placeholder
          box to the diagram.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_NestedDefinitionContainment_DepthLimitTruncatesInnerLevel
          - GeneralViewLayoutStrategy_BuildLayout_TruncatedDefinitionWithCompartments_AppendsEllipsisRow

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExcludedMembers
        title: >-
          GeneralViewLayoutStrategy shall not draw a member flagged IsExcludedFromDiagrams (or
          anything nested in it): it adds no box, no compartment row, and does not turn a port
          into a box.
        justification: |
          Members modeled only for name resolution (bare parameters, the bodies of behavior
          usages) have no notation yet; drawing them would change existing diagrams.
        tests:
          - GeneralView_BuildLayout_ExcludedMembers_RenderIdenticallyToWorkspaceWithout

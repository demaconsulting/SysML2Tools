---
# GeneralViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the GeneralViewLayoutStrategy unit
# - GeneralViewLayoutStrategy lays out a General View diagram from user definitions
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: GeneralViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Definitions
        title: >-
          GeneralViewLayoutStrategy shall render each user-defined definition as a labeled box
          that carries the definition's keyword.
        justification: |
          A General View shows the user's declared definitions of every kind (part, port,
          interface, action, and so on). Rendering each as a keyword-labeled box is the
          observable content the view exists to provide.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_OneUserPartDef_ProducesLayoutBox
          - GeneralViewLayoutStrategy_BuildLayout_MixedDefinitionKinds_RendersAllWithKeywords

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-PackageGrouping
        title: >-
          When the view has no resolved expose scope, GeneralViewLayoutStrategy shall group the
          definitions that belong to a bare package within a folder-shaped container box labeled
          with the package name.
        justification: |
          Grouping a package's definitions inside a labeled folder communicates ownership and
          keeps related definitions visually together, which is essential for readable diagrams
          of larger models, for the unscoped (whole-workspace) case where every ancestor package
          is genuinely part of what the view renders.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_PackagedDefinitions_ProducesFolderBox
          - GeneralViewLayoutStrategy_BuildLayout_Unscoped_StillRendersFullPackageFolderStructure

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NestedDefinitionContainment
        title: >-
          GeneralViewLayoutStrategy shall render a definition that owns nested definitions as a
          single box, with its nested definitions placed inside that box rather than as a
          duplicate sibling container.
        justification: |
          A definition that owns nested definitions (for example a part def containing further
          part def declarations) is one model element and must appear as exactly one box.
          Rendering it a second time as a separate sibling folder holding its own children is a
          duplicate-content defect that misrepresents the model's containment structure and
          confuses the reader.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxUnscoped
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxScoped

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ScopedBarePackageFolderSuppression
        title: >-
          When the view has a resolved expose scope, GeneralViewLayoutStrategy shall not render a
          bare package as a wrapping folder merely because it is an ancestor of admitted content;
          the package's admitted items shall be promoted directly to the diagram's root instead.
        justification: |
          An expose statement deliberately narrows a view to specific content. Wrapping that
          content's bare-package ancestor in a folder anyway — even though the package itself was
          never referenced by the expose scope — draws a container the scope did not request and
          misleadingly suggests the whole package is in view.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionOwningNestedDefinitions_RendersOneContainerBoxScoped
          - GeneralViewLayoutStrategy_BuildLayout_ExposedNamespaceChildren_BarePackageAncestor_NoFolderRendered
          - GeneralViewLayoutStrategy_BuildLayout_ExposedDefinitionInsideBarePackage_NoAncestorFolderRendered

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Compartments
        title: >-
          GeneralViewLayoutStrategy shall populate a definition box with compartments listing the
          definition's owned usages.
        justification: |
          The usages a definition owns (attributes, ports, parts, and so on) are part of its
          shown content. Listing them in compartments lets a reader see a definition's features
          without opening another view.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_DefinitionWithUsages_ProducesCompartments

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Specialization
        title: >-
          GeneralViewLayoutStrategy shall connect a specialized definition to each of its
          supertypes present in the workspace with a line ending in an open end marker at the
          supertype.
        justification: |
          Specialization (generalization) relationships are core model structure. Drawing them
          as open-end-marker lines toward the supertype matches diagram notation and makes the
          inheritance hierarchy visible.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Subclassification_ProducesEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-StdlibExclusion
        title: >-
          GeneralViewLayoutStrategy shall exclude standard-library definitions from the diagram.
        justification: |
          The General View is meant to show the user's model, not the imported standard library.
          Excluding standard-library definitions keeps the diagram focused on user content.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_StdlibOnlyWorkspace_ReturnsMinimalCanvas
          - GeneralViewLayoutStrategy_BuildLayout_SeedStdlibNames_AreExcluded

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no user-defined definitions, GeneralViewLayoutStrategy shall
          return a minimal empty canvas with no nodes.
        justification: |
          A model with no user definitions has nothing to draw; returning a well-formed empty
          canvas lets the renderer produce a valid blank diagram rather than failing.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-CompositeMembership
        title: >-
          GeneralViewLayoutStrategy shall connect a definition to the type of each owned feature
          with keyword <c>part</c> or <c>port</c> with a filled-diamond end marker at the owning
          definition end.
        justification: |
          Structural containment relationships — part and port features — are shown as
          filled-diamond edges in a General View. Non-structural features (attribute, value,
          item, etc.) are already visible in compartments and do not need a separate arrow.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_CompositeMembership_ProducesFilledDiamondEdge
          - GeneralViewLayoutStrategy_BuildLayout_PortFeature_ProducesFilledDiamondEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ReferenceMembership
        title: >-
          GeneralViewLayoutStrategy shall connect a definition to the type of each owned <c>ref</c>
          feature with a dashed line ending in an open-chevron end marker at the referenced type,
          sharing the same rendering as a standalone Dependency edge.
        justification: |
          A `ref` (reference usage) feature is a usage-type dependency per current OMG SysML v2
          notation, not a diamond-marked structural membership. The previous hollow-diamond
          membership marker for `ref` was an obsolete notation and has been removed; rendering
          `ref` with the same dashed/open-chevron style as a `Dependency` edge keeps both visually
          identical, matching their shared semantic meaning.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ReferenceMembership_ProducesDependencyEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Connect
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Connect edge's source endpoint to the owning rendered box of its target endpoint with
          a solid line and no end marker, and shall draw no edge when both endpoints resolve to
          the same box (a genuine self-loop).
        justification: |
          `connect A to B;` (and a `message`'s from/to events) is a core SysML v2 relationship;
          rendering it with a plain solid line (no marker) matches OMG connector notation and
          distinguishes it from every other edge kind, all of which carry either a marker, a
          dashed style, or both. Suppressing same-box self-loops is required because a rarer,
          genuinely self-referential model shape (e.g. two sibling ports of the very same
          enclosing definition, with no distinguishing intermediate owner) would otherwise draw
          a self-loop with no informational value. The dominant real-world corpus shape — two
          sibling features declared directly in their owning `part def`s, referenced from an
          enclosing part via bare usages with no per-instance nested redeclaration — resolves to
          two *distinct* boxes (not a self-loop), verified end to end against the real
          `WorkspaceLoader`/`BuildLayout` pipeline.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Connect_DifferentOwningTypes_ProducesUnmarkedSolidEdge
          - GeneralViewLayoutStrategy_BuildLayout_Connect_SameOwningType_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_ConnectDominantShape_RealWorkspaceLoader_ProducesDistinctBoxes

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Allocate
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Allocate edge's source endpoint to the owning rendered box of its target endpoint with
          a dashed line ending in an open chevron at the target, carrying a <c>«allocate»</c>
          midpoint label.
        justification: |
          `allocate A to B;` is the SysML v2 allocation relationship, conventionally rendered as
          a dashed dependency-style edge with an explicit <c>«allocate»</c> stereotype label
          distinguishing it from an unlabeled Dependency edge that shares the same line style and
          marker.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Allocate_ProducesDashedChevronEdgeWithLabel

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Dependency
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Dependency edge's source endpoint to the owning rendered box of its target endpoint
          with a dashed line ending in an open chevron at the target (the depended-upon
          element), with no midpoint label.
        justification: |
          A standalone `dependency A to B;` declaration is the general OMG dependency
          relationship, rendered per convention as a dashed line with an open arrowhead pointing
          at the depended-upon element — the same rendering the `ref`-fix reuses, since both are
          semantically a usage-type dependency.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Dependency_ProducesDashedChevronEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Binding
        title: >-
          GeneralViewLayoutStrategy shall connect the owning rendered box of each resolved
          Binding edge's source endpoint to the owning rendered box of its target endpoint with
          a solid line and no end marker, carrying a <c>=</c> midpoint label.
        justification: |
          `bind A = B;` (a binding connector) asserts equality between its two connector ends;
          rendering it as a solid, unmarked line (matching `Connect`'s notation, since both are
          connector-shaped relationships) with an explicit <c>=</c> midpoint label distinguishes
          it from a plain `Connect` edge while preserving the shared connector notation.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Binding_ProducesSolidEdgeWithEqualsLabel

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Subsetting
        title: >-
          GeneralViewLayoutStrategy shall connect a subtype feature that declares a `subsets`/`:>`
          reference to the owning definition of the subsetted (ancestor) feature — resolved via
          the same owner-resolution walk used for Redefinition — with a dashed line ending in a
          hollow-triangle end marker at the owner, and shall draw no edge when the reference
          cannot be resolved or resolves back to the subtype's own owning definition.
        justification: |
          Subsetting (`subsets`/`:>` on a feature) is a distinct SysML v2 relationship from
          redefinition, but shares the same "reference to an inherited member" resolution shape;
          reusing `ResolveRedefinitionOwner` verbatim avoids adding a new public `SysmlEdgeKind`
          or duplicating the owner-resolution algorithm, per this feature's explicit design
          decision to keep Subsetting a private, view-layer-only classification derived from the
          existing `SupertypeNames`/redefinition-owner machinery. The hollow-triangle marker
          matches Specialization's marker (both express an "is-a-kind-of" narrowing), while the
          dashed line style distinguishes it from Specialization's solid line, mirroring how
          Typing is distinguished from Membership.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Subsetting_CrossesSpecializationBoundary_ProducesDashedHollowTriangleEdge
          - GeneralViewLayoutStrategy_BuildLayout_SelfReferentialSubsetting_ProducesNoEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NonStructuralMembership
        title: >-
          GeneralViewLayoutStrategy shall not draw membership (diamond) edges for features with
          non-structural keywords such as <c>attribute</c>, <c>value</c>, or <c>item</c>.
        justification: |
          Non-structural features describe usage, not containment or reference. Omitting their
          membership diamond edges prevents the General View from confusing attribute typing with
          composition; where an attribute's type is a definition in the view it is instead shown as
          a dependency edge (see the AttributeTyping requirement).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AttributeFeature_DoesNotProduceDiamondEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AttributeTyping
        title: >-
          GeneralViewLayoutStrategy shall connect a definition to the type of each owned
          <c>attribute</c> (or <c>enum</c>-typed attribute) feature whose type resolves to a
          definition in the view with a dashed dependency line ending in an open chevron at the
          attribute-type definition.
        justification: |
          An attribute or enumeration definition referenced only by attribute features would
          otherwise float as a disconnected box. Drawing an owner-to-type dependency joins it into
          the cluster near the definitions that use it. Attribute typing is a usage-type dependency,
          not composition, so it uses the OMG dependency notation (a dashed line with an open
          arrowhead) rather than a membership diamond, keeping it visually distinct from structural
          memberships (filled diamond) and specializations (hollow triangle). Unresolved types and
          self-references are skipped, exactly as for the other edge kinds.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AttributeTyping_ProducesDashedOpenChevronEdge
          - GeneralViewLayoutStrategy_BuildLayout_EnumTypedAttribute_ProducesDashedOpenChevronEdge
          - GeneralViewLayoutStrategy_BuildLayout_AttributeTyping_UnresolvedType_ProducesNoEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-LayeredPlacement
        title: >-
          GeneralViewLayoutStrategy shall place definitions through the bundled
          DemaConsulting.Rendering.Layout hierarchical layout engine so that no two definition
          boxes overlap and every package folder stays clear of the others.
        justification: |
          The whole General View is expressed as a single input LayoutGraph — package folders as
          container nodes, definitions as leaves — and placed with one
          HierarchicalLayoutAlgorithm.Apply call: the root scope packs folders and top-level
          definitions by reading order (ContainmentLayoutAlgorithm), while each folder's own
          contents are ordered by their intra-package edges with the bundled layered algorithm
          (LayeredLayoutAlgorithm). Delegating the whole placement, including cross-container edge
          anchoring, to Rendering's own engine gives the General View ELK-style box placement and
          orthogonal edge routing without SysML2Tools duplicating any layout logic. The observable
          guarantee that matters to readers is that boxes and folders never overlap, regardless of
          model size or density, so the diagram stays legible without manual layout hints.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AdaptiveGap_DenseModelProducesNonOverlappingBoxes
          - GeneralViewLayoutStrategy_BuildLayout_HeatLayout_ConnectedModelKeepsBoxesSeparated
          - GeneralViewLayoutStrategy_BuildLayout_HeatLayout_SparseModelProducesCompactCanvas

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeScoping
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          GeneralViewLayoutStrategy shall scope the diagram to the union of each edge's target
          containment subtree, resolved through the target's own type reference when the target
          is a usage rather than a definition.
        justification: |
          `expose <name>;` is the only real content-scoping mechanism a view has in SysML v2 —
          `render <target>;` names a rendering style/format (e.g. `asTreeDiagram`,
          `asElementTable`), never content, so it plays no role in scoping. Scoping the diagram
          to the union of every resolved `expose` target's containment subtree makes `expose`
          statements finally have an observable effect, matching the SysML v2 view mechanism's
          subject-scoping intent. When an exposed target resolves to a feature usage rather than
          a definition, its own containment subtree is typically empty — the real content lives
          under its type's subtree — so the target's own resolved type reference is additionally
          followed to include that type's subtree, fixing the usage-vs-definition containment gap.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_ExposedName_UnionsAdditionalSubtree
          - GeneralViewLayoutStrategy_BuildLayout_ExposedUsage_ResolvesThroughTypingToDefinitionSubtree

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-ExposeBracketFilterEvaluation
        title: >-
          When a view's `expose <path>::**[<expr>];` entry carries a bracket-filter expression that
          parses and evaluates successfully (Phase 2a), GeneralViewLayoutStrategy shall narrow that
          entry's contribution to the resolved scope to only the descendant definitions the
          expression matches, rather than that entry's whole containment subtree, while every
          other `expose` entry in the same view continues to contribute unaffected.
        justification: |
          The bracket form is the dominant real-world `expose` shape (10/10 sampled OMG corpus
          instances). Making it an effective per-entry filter — not merely captured raw text —
          gives `expose <path>::**[<expr>];` its full SysML v2 meaning, matching how the standalone
          `filter [<expr>];` statement already narrows the whole view's resolved scope.
        tests:
          - ResolveExposedScope_BracketFilterEvaluatesSuccessfully_NarrowsToMatchedDefinitionsOnly
          - ResolveExposedScope_MixedFilteredAndUnfilteredEntries_NarrowsIndependently
          - DiagramRenderer_RenderWorkspace_BracketExposeMandatorySafetyView_FiltersToMandatoryPart

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — because the view has no
          `expose` statement, its ViewNode is null (e.g. the `--auto` synthesized view), or its
          every declared `expose` entry failed to resolve — GeneralViewLayoutStrategy shall
          render the full workspace, unchanged from its pre-scoping behavior, regardless of
          whether `RenderTargetName`/`FilterExpressionText` are present.
        justification: |
          Nearly every real-world view declares no `expose` statement at all, so rendering the
          full workspace must remain the default. This also guards against a bogus `expose <name>;`
          silently rendering nothing: an unresolvable exposed name (e.g. a typo) falls back to
          full-workspace rendering (with the unresolved-reference diagnostic already surfaced by
          `ReferenceResolver`) rather than producing a broken or empty diagram. `RenderTargetName`
          (a rendering-style/format selector, not content) never affects this decision.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_RenderTargetNameOnly_NoExposeEdges_RendersFullWorkspace
          - GeneralViewLayoutStrategy_BuildLayout_NullViewNode_RendersFullWorkspaceUnchanged

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterEvaluation
        title: >-
          When a view's FilterExpressionText parses as a supported Phase 1 filter expression,
          GeneralViewLayoutStrategy shall evaluate it against the already expose-scoped candidate
          definitions and shall render only the matched subset, including an empty canvas when no
          candidate matches.
        justification: |
          Standalone `filter [<expr>];` is the user-visible mechanism for narrowing a view by
          metadata once the expose scope has been resolved. Applying the predicate after expose
          scoping preserves the meaning of both statements: `expose` chooses the candidate scope,
          then `filter` further narrows it.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionMatchesNothing_RendersEmpty
          - DiagramRenderer_RenderWorkspace_SafetyPartsView_FiltersToAnnotatedParts
          - DiagramRenderer_RenderWorkspace_MandatorySafetyPartsView_FiltersToMandatoryPart

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-FilterFallbackWarning
        title: >-
          When a view's FilterExpressionText fails to parse or uses a construct outside the Phase 1
          subset, GeneralViewLayoutStrategy shall emit a warning stating that the filter expression
          could not be evaluated and shall continue rendering the unfiltered resolved scope.
        justification: |
          Unsupported filter constructs are an expected Phase 1 boundary, not a crash condition.
          Falling back to the unfiltered scope while surfacing a visible warning preserves a usable
          diagram and makes the limitation explicit.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionPresent_EmitsNotYetEvaluatedWarning

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-UsageLevelCandidates
        title: >-
          GeneralViewLayoutStrategy shall admit named usage-level declarations (feature usages),
          not only definitions, as filter/render candidates, so a metaclass-kind classification
          filter (e.g. `filter @SysML::PartUsage;`) that targets usages has matching candidates to
          narrow, and shall render such a usage-level candidate as a standalone box only when it is
          not already shown as a compartment row of an independently-rendered immediate parent.
        justification: |
          `CollectDefinitions` doubles as both the filter-candidate source and the box-rendering
          function for the entire General View diagram. Real-world corpus filters (e.g. OMG's
          `42.Views/ViewsExample.sysml`, `filter @SysML::PartUsage;`) classify by usage-level
          metaclass/kind, which a definitions-only candidate set could never satisfy — such a view
          would render empty rather than narrowed. Widening the candidate set to include named
          usages is a deliberate, planned behavior change, but rendering every admitted usage
          unconditionally (Phase 2d, before Retry 1) was itself a genuine regression: a usage
          nested inside an already-rendered definition/usage duplicates the compartment row it
          already occupies there, more than doubling the box count of real corpus models (e.g. the
          gallery's `01-drone-general.sysml`, 21 → 47 boxes). `RemoveRedundantNestedUsages` (Retry
          1, hardened to a depth-ordered cascading pass in Retry 2 to avoid silently dropping
          usages nested two or more levels deep) restores the pre-Phase-2d default-rendering box
          count by excluding exactly the nested usages whose nearest still-rendered ancestor is
          also independently rendered, while still admitting usages that survive scope/filter
          narrowing when their parent does not.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_QualifiedPartUsageFilter_RendersOnlyPartUsages
          - GeneralViewLayoutStrategy_BuildLayout_BarePartUsageFilter_RendersOnlyPartUsages
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_RendersUsageLevelCandidatesToo
          - GeneralViewLayoutStrategy_BuildLayout_OmgSafetyFeatureViewsFixture_ScopesToExposedVehicleSubtree
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_ExcludesUsageNestedInsideRenderedDefinition
          - GeneralViewLayoutStrategy_BuildLayout_MetaclassFilter_KeepsNestedUsageWhenParentExcluded
          - GeneralViewLayoutStrategy_BuildLayout_DroneGalleryModel_RendersExactly21BoxesMatchingCheckedInSvg
          - GeneralViewLayoutStrategy_BuildLayout_NoFilter_RendersDeeplyNestedGrandchildUsageWhenIntermediateParentExcluded

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-DroppedRelationshipEdgeWarning
        title: >-
          When a Connect/Allocate/Dependency/Binding edge's endpoint fails to resolve to a
          rendered box, or both endpoints resolve to the same box (a genuine self-loop),
          GeneralViewLayoutStrategy shall emit a warning naming the edge kind, its raw
          source/target references, and a short reason, rather than silently dropping the edge.
          An unresolved-endpoint drop caused solely by the endpoint falling outside an active
          `expose` scope narrowing is expected behavior and shall not be reported.
        justification: |
          A dropped relationship edge with no rendered box was previously indistinguishable from
          correct behavior — the diagram simply omitted it, with no signal to the user that a
          model reference failed to resolve or collapsed into an unintended self-loop. This
          defense-in-depth diagnostic makes any residual or future resolution gap visible,
          matching the same visible-not-silent principle already applied by
          `ForUnevaluatedFilter`/`ForUnevaluatedExposeBracketFilter`. Excluding drops caused by
          ordinary `expose` scope narrowing avoids misleading noise for a relationship whose
          endpoint is simply, and correctly, outside the exposed subtree by design.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_Connect_SameOwningType_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_ConnectDominantShape_RealWorkspaceLoader_ProducesDistinctBoxes

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-QualifiedForm
        title: >-
          GeneralViewLayoutStrategy shall connect a subtype feature that declares a qualified
          `Owner::feature` `redefines`/`:>>` reference to the named owner with a solid line
          ending in a hollow-triangle-with-crossbar end marker at the owner.
        justification: |
          `redefines`/`:>>` feature redefinition is core SysML v2 model structure completing the
          ROADMAP's "Connector-end & line-style conformance" item: the already-existing
          `HollowTriangleCrossbar` end-marker style needed a producing model edge to ever appear
          in a rendered General View. A qualified reference names its owner directly, matching
          the shape observed in the OMG corpus (e.g.
          `test/SysMLModels/OMG/validation/01-PartsTree/1a-PartsTree.sysml`'s qualified
          `redefines Vehicle::mass`).
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_QualifiedRedefinition_ProducesHollowTriangleCrossbarEdgeToOwner

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-BareNameForm
        title: >-
          GeneralViewLayoutStrategy shall connect a subtype feature that declares a bare-name
          `redefines`/`:>>` reference to the ancestor definition that declares a matching member,
          found by walking the subtype's own supertype chain transitively, with a solid line
          ending in a hollow-triangle-with-crossbar end marker at that ancestor.
        justification: |
          The dominant real-world shape for `redefines` per the SysML v2 spec is a bare name
          referencing a member the subtype inherits, matching the shape observed in the OMG
          corpus (e.g.
          `test/SysMLModels/OMG/training/05.Redefinition/RedefinitionExample.sysml`'s bare-name
          `redefines eng`). Resolving transitively (not just one supertype hop) is required
          because the declaring ancestor is frequently two or more hops away from the redefining
          subtype.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_BareNameRedefinition_ProducesHollowTriangleCrossbarEdge
          - GeneralViewLayoutStrategy_BuildLayout_TransitiveBareNameRedefinition_ProducesHollowTriangleCrossbarEdgeToDeclaringAncestor

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-Redefinition-NoEdgeOnFailure
        title: >-
          GeneralViewLayoutStrategy shall produce no redefinition edge and no diagnostic when a
          `redefines`/`:>>` reference cannot be resolved to any ancestor member, or when it
          resolves back to the redefining feature's own owning definition.
        justification: |
          Graceful degradation for an unresolvable or self-referential redefinition reference is
          consistent with how every other reference kind in this unit behaves on failure: false
          edge is drawn, and diagram layout must never throw for a reference that cannot be
          resolved.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_UnresolvableRedefinition_ProducesNoEdge
          - GeneralViewLayoutStrategy_BuildLayout_SelfReferentialRedefinition_ProducesNoEdge

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-AnnotationNote
        title: >-
          GeneralViewLayoutStrategy shall render one `BoxShape.Note` box per annotated
          definition, connected to the definition's box by a plain solid line with no end
          marker, containing the definition's Documentation/Comment annotation text (multiple
          annotations concatenated with a blank-line separator into a single note), and shall
          emit no note box for a definition with no annotations.
        justification: |
          The ROADMAP's "Annotating elements" gap: `comment`/`doc` annotations were already
          captured into SysmlNode.Annotations by AstBuilder but never rendered anywhere in the
          General View, silently discarding real model content. `AddAnnotationNote` implements
          this as an ordinary `LayoutGraph` node/edge pair added during the same single-pass
          `BuildGraph` traversal that builds each definition's own box — a deliberate,
          documented deviation from a literal post-layout marker-decoration approach (as used
          by `AddInitialMarker` in the State Transition View), chosen because this strategy
          builds its entire graph in one pass with no separate decoration phase. One note per
          annotated element (not one note per annotation) keeps the diagram from fragmenting
          into many small boxes when an element has both a `doc` and one or more `comment`s.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_AnnotatedDefinition_EmitsNoteBox
          - GeneralViewLayoutStrategy_BuildLayout_UnannotatedDefinition_EmitsNoNoteBox
          - GeneralViewLayoutStrategy_BuildLayout_MultipleAnnotations_ProduceOneNoteBox

      - id: SysML2Tools-Core-Layout-Internal-GeneralViewLayoutStrategy-RequirementConstraintCompartments
        title: >-
          GeneralViewLayoutStrategy's Pluralize helper shall title a "subject", "assume
          constraint", "require constraint", or "constraint" feature compartment with the
          guillemet-wrapped stereotype form («subject», «assume constraint», «require
          constraint», «constraint») rather than the generic pluralized-keyword form, and
          FormatFeatureRow shall render a feature with a non-empty ExpressionText as its raw
          expression text (optionally prefixed with "name: ") instead of the generic "name :
          Type [multiplicity]" shape.
        justification: |
          These compartment kinds are new to AstBuilder's output (subject/actor/stakeholder/
          constraint members, enum literal values) and the plain pluralized-keyword default
          ("subjects", "assume constraints", ...) does not match the stereotype convention this
          file already applies to other individually-significant single-member compartments
          (e.g. the pre-existing `«allocate»` edge-label convention reused here), nor would a
          generic name/type row correctly convey a constraint's actual expression content.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_RequirementSubject_UsesGuillemetTitle
          - GeneralViewLayoutStrategy_BuildLayout_ConstraintFeatures_ShowExpressionText
          - GeneralViewLayoutStrategy_BuildLayout_EnumDefLiteralValues_ProducesEnumValuesCompartment

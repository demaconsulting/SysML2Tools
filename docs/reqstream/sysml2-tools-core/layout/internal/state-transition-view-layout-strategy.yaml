---
# StateTransitionViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the StateTransitionViewLayoutStrategy unit
# - StateTransitionViewLayoutStrategy lays out a State Transition View diagram
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: StateTransitionViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-States
        title: >-
          StateTransitionViewLayoutStrategy shall render a box for each state, an initial
          pseudo-state marker when the state machine declares an explicit initial transition, and
          connect transitions as arrows labeled with their trigger, guard, and effect.
        justification: |
          A State Transition View exists to show the states of a machine, where it starts, and how
          it moves between states under triggered, guarded transitions. The state boxes, initial
          marker, and labeled arrows are the observable content the view must provide.
        tests:
          - StateTransitionView_BuildLayout_StatesAndTransitions_ProducesBoxesBadgeAndLines

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ImplicitStates
        title: >-
          StateTransitionViewLayoutStrategy shall render a state box for any state referenced by a
          transition even when that state is not separately declared.
        justification: |
          A transition can name a state that was never declared on its own. Showing it anyway keeps
          the diagram complete so that no transition appears to lead nowhere.
        tests:
          - StateTransitionView_BuildLayout_UndeclaredStateInTransition_IsCreated

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-DistinctAnchors
        title: >-
          When a state edge carries both an outgoing and an incoming transition,
          StateTransitionViewLayoutStrategy shall attach them at distinct anchor points.
        justification: |
          If an outgoing and an incoming transition shared one anchor, their arrows would coincide
          and the direction of flow would be ambiguous. Distinct anchors keep each transition's
          direction readable.
        tests:
          - StateTransitionView_BuildLayout_InAndOutOnSameEdge_UseDistinctAnchors

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no state definition, StateTransitionViewLayoutStrategy shall
          return a minimal empty canvas with no nodes.
        justification: |
          With no state definition there is nothing to draw; a well-formed empty canvas lets the
          renderer produce a valid blank diagram rather than failing.
        tests:
          - StateTransitionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-TransitionArrowhead
        title: >-
          StateTransitionViewLayoutStrategy shall draw each transition edge with an open chevron
          end marker (EndMarkerStyle.OpenChevron) at the target state.
        justification: |
          SysML v2 state transition notation uses an open chevron at the target end. Applying this
          end-marker style makes rendered transitions conform to the standard notation; the chevron
          is drawn open (no closing base edge) in both the SVG and PNG renderers.
        tests:
          - StateTransitionView_BuildLayout_TransitionEdge_HasOpenArrowhead

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-TopToBottomFlow
        title: >-
          StateTransitionViewLayoutStrategy shall place states top-to-bottom along the transition
          flow and route each transition as an orthogonal (axis-aligned) polyline.
        justification: |
          A directed top-to-bottom reading with orthogonal connectors makes the state machine's flow
          clear and matches the block-diagram visual style used across the tool.
        tests:
          - StateTransitionView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingRootSelection
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          StateTransitionViewLayoutStrategy shall restrict its heuristic root selection to a
          candidate relevant to the resolved scope.
        justification: |
          The State Transition View renders exactly one selected root's states, so `expose`
          scoping cannot narrow a workspace-wide collection directly; instead it restricts which
          root is selected — accepting the current heuristic root itself, an inner state of it, a
          definition containing the heuristic default, or the resolved type of an exposed usage —
          and selecting no root at all when nothing in the workspace is relevant to the scope.
        tests:
          - StateTransitionView_BuildLayout_ExposeNonHeuristicRoot_SelectsExposedRoot
          - StateTransitionView_BuildLayout_ExposeInnerChildOfNonHeuristicRoot_SelectsItsRoot
          - StateTransitionView_BuildLayout_ExposeUnrelatedDefinition_NoRootSelected_ReturnsMinimalCanvas
          - StateTransitionView_BuildLayout_ExposedUsage_ResolvesThroughTypingToRoot

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingStateFiltering
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          StateTransitionViewLayoutStrategy shall narrow the selected root's declared states to
          those within the resolved scope.
        justification: |
          Once a root is selected, `expose` scoping must also narrow what is drawn inside it —
          otherwise every declared state of the selected root would still be rendered regardless
          of which states the view actually exposed, defeating the purpose of scoping the state
          machine's content.
        tests:
          - StateTransitionView_BuildLayout_ExposeSingleState_DropsIsolatedOutOfScopeState

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ExposeScopingTransitionEndpointRetention
        title: >-
          StateTransitionViewLayoutStrategy shall conservatively re-include any state excluded by
          state filtering that is still referenced by an in-scope transition, so only genuinely
          isolated out-of-scope states are dropped.
        justification: |
          A transition whose endpoint state was excluded by filtering would otherwise point at
          nothing; the existing transition-endpoint pass (which has no independent qualified name
          to filter against) reintroduces any state still referenced by an in-scope transition,
          keeping the state machine's transitions readable while still dropping states with no
          remaining reference.
        tests:
          - StateTransitionView_BuildLayout_ExposeSingleState_DropsIsolatedOutOfScopeState

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — StateTransitionViewLayoutStrategy shall select its root by the pre-scoping heuristic
          and render every state, unchanged from its pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; the pre-scoping heuristic root selection and full
          state rendering must remain the default in both cases.
        tests:
          - StateTransitionView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-ScopedSpecificityTieBreak
        title: >-
          When more than one candidate root is relevant to the resolved expose scope,
          StateTransitionViewLayoutStrategy shall select the most specific (deepest-qualified-name)
          relevant candidate, using its transition-count heuristic only to break ties among
          equally specific candidates.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and a nested descendant
          definition can both be relevant to the same resolved `expose` scope. Without a
          specificity-first tie-break, the ancestor could win by raw transition-count score even
          though the user's `expose` statement was scoped to the nested descendant, silently
          defeating the intended scoping.
        tests:
          - StateTransitionView_BuildLayout_ExposeInnerStateOfNestedDefinition_SelectsNestedDefinitionNotAncestor

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-PseudostateExclusion
        title: >-
          StateTransitionViewLayoutStrategy's CollectStates shall never render an ordinary state
          box for a transition source named "start"/"done" or matching a declared entry-action
          feature's name, even when that source is otherwise only referenced by a transition
          endpoint.
        justification: |
          A pseudostate ("start"/"done") or entry-action-kind transition source is not itself a
          state and must never be drawn as one; without this exclusion, the existing
          "additional states referenced only by a transition endpoint" pass would synthesize a
          spurious box labeled "start" (or the entry action's name) for every model using the
          attached-transition or entry-action-transition idiom, since that source name is never
          separately declared as a state. Only the transition source side is excluded — the
          target side of any transition is unaffected.
        tests:
          - StateTransitionView_BuildLayout_PseudostateSourceTransition_NoSpuriousBox
          - StateTransitionView_BuildLayout_EntryActionSourceTransition_NoSpuriousBoxUsesResolvedTarget

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-SemanticInitialMarker
        title: >-
          StateTransitionViewLayoutStrategy's BuildLayout shall place the initial pseudo-state
          marker at the target of the first transition whose source is a pseudostate/entry-action
          name, and shall draw no initial marker when the state machine declares no such
          transition.
        justification: |
          A guess such as "the first-declared state is the initial state" is only an approximation
          of where the machine starts — it is wrong whenever a model contains an explicit
          `first start then X;` (or attached entry-action-transition) idiom naming a different
          state, and it invents an initial state the model never declared. Drawing the marker only
          at the semantically-resolved target keeps it correct for every model using this idiom and
          matches the SysML v2 notation, which draws an initial marker only for an explicit initial
          transition.
        tests:
          - StateTransitionView_BuildLayout_PseudostateSourceTransition_MarksResolvedTargetNotFirstDeclared
          - StateTransitionView_BuildLayout_NoExplicitInitialTransition_DrawsNoInitialMarker
          - StateTransitionView_BuildLayout_DoneSourcedTransition_DrawsNoInitialMarker

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-InitialMarkerArrow
        title: >-
          StateTransitionViewLayoutStrategy shall draw the arrow from the initial pseudo-state
          marker to the initial state as a solid line with an open arrowhead at the state.
        justification: |
          The SysML v2 graphical notation draws the initial-state transition with an open
          arrowhead, like every other transition, rather than a filled one. Matching it keeps
          the initial arrow consistent with the transition edges.
        tests:
          - StateTransitionView_BuildLayout_InitialMarkerArrow_IsSolidWithOpenArrowhead

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-StateDefFrame
        title: >-
          StateTransitionViewLayoutStrategy shall enclose the whole diagram — the state boxes,
          the initial marker, and the transitions — in a single frame labeled with the state
          definition's keyword and name.
        justification: |
          The SysML v2 graphical notation draws a state definition as a box headed by its keyword
          and name that contains its states and transitions. Showing that frame tells the reader
          which state machine the diagram depicts and keeps the diagram a single self-describing
          unit.
        tests:
          - StateTransitionView_BuildLayout_RootDefinition_IsEnclosedInStateDefFrame

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-EntryDoExitCompartments
        title: >-
          StateTransitionViewLayoutStrategy shall list a state's entry, do, and exit actions in
          compartments titled with the keyword (centered, italic), in that order, and shall
          size the state box to fit them.
        justification: |
          The SysML v2 graphical notation shows what a state does on entry, while active, and on
          exit in titled compartments of its box. Omitting them hides the behavior the model
          declares; sizing the box to its content keeps the text from being clipped.
        tests:
          - StateTransitionView_BuildLayout_EntryDoExit_ProducesTitledCompartments
          - StateTransitionView_BuildLayout_EntryDoExit_NoneDeclared_NoCompartments
          - StateTransitionView_BuildLayout_EntryDoExit_WidensBoxToLongestRow
          - StateTransitionView_BuildLayout_TypedState_NameLineShowsTypeAndMultiplicity
          - StateTransitionView_BuildLayout_ElevatorGalleryModel_ShowsCompartmentsLabelsAndFinal

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-TransitionLabel
        title: >-
          StateTransitionViewLayoutStrategy shall label each transition, including a
          self-transition, with its trigger, bracketed guard, and effect in the form
          "trigger [guard] / effect", omitting each part the transition does not declare.
        justification: |
          The SysML v2 graphical notation labels a transition with its trigger, guard, and
          effect. Labeling only the guard drops the event that fires the transition and the
          action it performs.
        tests:
          - StateTransitionView_BuildLayout_TransitionTriggerGuardEffect_LabelFormat
          - StateTransitionView_BuildLayout_SelfTransition_CarriesFullLabel
          - StateTransitionView_BuildLayout_StatesAndTransitions_ProducesBoxesBadgeAndLines

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-FinalNode
        title: >-
          StateTransitionViewLayoutStrategy shall draw the target of a transition to the reserved
          name done as one shared final-state badge (a bullseye) rather than a state box.
        justification: |
          The SysML v2 graphical notation draws the completion of a state machine as a final
          pseudo-state, not as a state named done.
        tests:
          - StateTransitionView_BuildLayout_DoneTarget_RendersBullseyeNotStateBox
          - StateTransitionView_BuildLayout_DoneTarget_MultipleSources_SingleFinalBadge

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-LabelPlacement
        title: >-
          StateTransitionViewLayoutStrategy shall size the frame to the transition labels as the
          renderers place them clear of the state boxes, so that no label is clipped by the frame
          or left on a state box.
        justification: |
          The renderers place each label with an obstacle-aware placer. Sizing the frame with the
          same placer and obstacles keeps long labels inside the frame and shows that labels
          do not sit on box corners.
        tests:
          - StateTransitionView_BuildLayout_FrameWidth_AccountsForLongTransitionLabel
          - StateTransitionView_BuildLayout_LongLabel_OverhangingLeft_IsContainedByFrame
          - StateTransitionView_BuildLayout_ElevatorGalleryModel_LabelsDoNotOverlapStateBoxes

      - id: SysML2Tools-Core-Layout-Internal-StateTransitionViewLayoutStrategy-BackEdgeApproach
        title: >-
          StateTransitionViewLayoutStrategy shall give every transition, including one that
          returns to an earlier state, a final straight approach at least as long as its open
          chevron end marker.
        justification: |
          An arrowhead that is entered through a rounded corner or a short stub is distorted. The
          strategy declares the end marker on the layout graph so the engine sizes the approach.
        tests:
          - StateTransitionView_BuildLayout_BackEdge_OpenChevronWithFlushApproach

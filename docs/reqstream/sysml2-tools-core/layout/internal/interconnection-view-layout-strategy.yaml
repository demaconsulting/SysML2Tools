---
# InterconnectionViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the InterconnectionViewLayoutStrategy unit
# - InterconnectionViewLayoutStrategy lays out the internals of one part definition
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: InterconnectionViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Internals
        title: >-
          InterconnectionViewLayoutStrategy shall render the selected part definition as a
          container box enclosing one box per nested part usage.
        justification: |
          An Interconnection View exists to show the internal structure of a part definition — its
          nested parts inside a container. The container box and one box per nested part are the
          observable content the view must provide.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines
          - InterconnectionView_BuildLayout_RootContent_IsNestedAsRootBoxChildren

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-SameNamedDefinitions
        title: >-
          When several container definitions share a simple name, InterconnectionViewLayoutStrategy
          shall expand a nested part using the definition its type reference resolves to (the
          semantic model's resolved target, which already applies KerML 8.2.3.5 member visibility,
          filtered imports, and import scoping, else that name resolution from the part's owning
          namespace), never the first same-named definition found in the workspace, and shall
          treat a part whose type reference does not resolve as a leaf (no bare simple-name
          matching).
        justification: |
          Expanding the wrong same-named container would draw another package's interior inside a
          part, misrepresenting its internal structure. An unresolved type reference is rendered
          as unresolved (a leaf part); the load diagnostic reports it.
        tests:
          - InterconnectionView_BuildLayout_SameNamedContainerDefs_ExpandsOwnPackagesDefinition
          - InterconnectionView_BuildLayout_SameNamedImportsInOneFile_ExpandsOwnImportsDefinition
          - InterconnectionView_BuildLayout_PrivateMemberTyping_IsLeaf
          - InterconnectionView_BuildLayout_ImportOfSiblingPackage_IsLeaf
          - InterconnectionView_BuildLayout_FilteredOutImportCandidate_IsLeaf
          - InterconnectionView_BuildLayout_SameSimpleNameInUnrelatedPackage_IsLeaf

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NoDocumentation
        title: >-
          InterconnectionViewLayoutStrategy shall not draw `doc` (Documentation) annotation text
          for the root definition or any nested part.
        justification: |
          Interconnection diagrams show structure and connections; documentation text would crowd
          the nested boxes, so it is never drawn, consistent with the General View's default.
        tests:
          - InterconnectionView_BuildLayout_DocumentedDefinitions_DrawNoDocumentation

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Ports
        title: >-
          InterconnectionViewLayoutStrategy shall attach a connector to a port on a part box when its
          endpoint names a port of the part, and directly to the part box when the endpoint names
          only the part.
        justification: |
          A connection endpoint such as `controller.power` names a specific port, which is the
          observable anchor the connector line is drawn from; an endpoint that names only a part has
          no port to draw, and a port glyph there would show a port the model does not declare.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines
          - InterconnectionView_BuildLayout_HighConnectionDegreePart_BoxesDoNotOverlapAndPortsAreLabeled

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Connectors
        title: >-
          InterconnectionViewLayoutStrategy shall draw one connector line for each connection,
          binding, interface, and flow usage between nested parts.
        justification: |
          The connectors between nested parts are the relationships an Interconnection View
          communicates; drawing one connector line per connector is the observable evidence of them.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NonOverlapping
        title: >-
          InterconnectionViewLayoutStrategy shall position the nested part boxes so that they do
          not overlap one another.
        justification: |
          Overlapping part boxes produce an unreadable internal-structure diagram. Non-overlap is
          an observable property of the produced geometry the strategy must guarantee.
        tests:
          - InterconnectionView_BuildLayout_PartBoxes_DoNotOverlap
          - InterconnectionView_BuildLayout_HighConnectionDegreePart_BoxesDoNotOverlapAndPortsAreLabeled

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no part definition with renderable internals,
          InterconnectionViewLayoutStrategy shall return a minimal empty canvas with no nodes.
        justification: |
          With no eligible part definition there is nothing to draw; a well-formed empty canvas
          lets the renderer produce a valid blank diagram rather than failing.
        tests:
          - InterconnectionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NestedContainer
        title: >-
          When a nested part is typed by a non-standard-library part definition that has its own
          nested part usages, InterconnectionViewLayoutStrategy shall lay out that inner structure
          recursively and nest it as the children of the part's container box.
        justification: |
          A part whose type has internal structure is a container; showing that structure nested
          inside the container box is the whole purpose of a hierarchical Interconnection View.
          Reusing the same flat placement at every level (recursive bottom-up, ELK
          SEPARATE_CHILDREN) yields genuine two-level nested block diagrams.
        tests:
          - InterconnectionView_BuildLayout_NestedContainer_PlacesChildrenInsideContainerBox

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ContainerSizing
        title: >-
          InterconnectionViewLayoutStrategy shall size each container box so that it bounds its
          nested children together with its title area and edge insets.
        justification: |
          A container box must fully enclose the interior it was laid out from; if it were smaller
          than its children plus its title and insets, the nested content would overflow the border
          and produce an unreadable diagram.
        tests:
          - InterconnectionView_BuildLayout_ContainerSize_BoundsChildrenAndTitle

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ChildPositioning
        title: >-
          InterconnectionViewLayoutStrategy shall position a container's nested children at absolute
          coordinates offset from the container box's top-left origin.
        justification: |
          The renderer draws nested children using absolute coordinates, so the interior content —
          laid out relative to its own origin — must be translated to the container's absolute
          position for the nested boxes, ports, and connectors to appear inside the container.
        tests:
          - InterconnectionView_BuildLayout_NestedChildren_RenderedAtAbsoluteCoordinates

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-SingleLevelNoOp
        title: >-
          When no nested part is typed by a definition with its own nested parts,
          InterconnectionViewLayoutStrategy shall produce only leaf part boxes with no nested
          children, leaving single-level output unchanged.
        justification: |
          The recursive capability must be a strict no-op for flat models so that existing
          single-level Interconnection Views are unaffected; a leaf-only model must yield exactly
          the non-recursive layout.
        tests:
          - InterconnectionView_BuildLayout_NoNesting_ProducesFlatLeafBoxes

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-CycleGuard
        title: >-
          When a nested part is typed by a definition that is already on the recursion path,
          InterconnectionViewLayoutStrategy shall treat that part as a leaf rather than recursing
          into it.
        justification: |
          A self-referential or mutually-referential part definition would otherwise recurse
          without bound; treating an already-visited type as a leaf guarantees termination while
          still drawing the part.
        tests:
          - InterconnectionView_BuildLayout_SelfReferentialType_TreatedAsLeaf

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingRootSelection
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          InterconnectionViewLayoutStrategy shall restrict its heuristic root selection to a
          candidate relevant to the resolved scope.
        justification: |
          The Interconnection View renders exactly one selected root's interior, so `expose`
          scoping cannot narrow a workspace-wide collection directly; instead it restricts which
          root is selected — accepting the current heuristic root itself, an inner part of it, a
          definition containing the heuristic default, or an exposed part usage —
          and selecting no root at all when nothing in the workspace is relevant to the scope.
        tests:
          - InterconnectionView_BuildLayout_ExposeNonHeuristicRoot_SelectsExposedRoot
          - InterconnectionView_BuildLayout_ExposeInnerChildOfNonHeuristicRoot_SelectsItsRoot
          - InterconnectionView_BuildLayout_ExposeUnrelatedDefinition_NoRootSelected_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposedDefinitionDrawsOwnStructure
        title: >-
          When a view exposes a part definition by name (expose Car;),
          InterconnectionViewLayoutStrategy shall draw that definition as the root frame with its
          direct nested parts, its ports and the connections between its parts inside it, expanding
          a nested container part only for a recursive expose, and shall draw nothing for a
          definition that has no nested parts.
        justification: |
          StandardViewDefinitions::InterconnectionView presents exposed features as nodes and their
          nested features as nested nodes; nothing requires expose Car::** for the nested parts, and
          the OMG Pilot draws them for expose Car;. Re-applying the expose scope to the exposed
          element's own parts left the interconnection compartment empty (issue #145). Exposing a
          nested part of a definition still narrows its owner's frame to that part.
        tests:
          - InterconnectionView_BuildLayout_ExposePartDef_DrawsFrameWithNestedParts
          - InterconnectionView_BuildLayout_ExposePartDef_DrawsPortsAndConnections
          - InterconnectionView_BuildLayout_ExposePartDef_NestedContainerPartStaysLeaf
          - InterconnectionView_BuildLayout_ExposePartDefRecursive_DrawsEachNestedPartOnce
          - InterconnectionView_BuildLayout_ExposeNestedPart_StillNarrowsToThatPart
          - InterconnectionView_BuildLayout_ExposePartDefWithoutParts_DrawsNothing

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposedUsageIsRoot
        title: >-
          When a view exposes a top-level part usage by name (expose car;),
          InterconnectionViewLayoutStrategy shall draw that usage as the root frame — labeled with
          its name and type, not the definition — with the nested parts, ports and connections its
          type provides.
        justification: |
          The exposed element is the usage, so the frame is the usage; its interior is inherited
          from its type, as it is when the usage is drawn as a nested container part. Choosing the
          typing target's definition as the root drew the wrong element (issue #145).
        tests:
          - InterconnectionView_BuildLayout_ExposePartUsage_DrawsUsageFrameWithTypeStructure
          - InterconnectionView_BuildLayout_ExposedUsage_DrawsUsageWithTypeInteriorAsRoot

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingPartFiltering
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          InterconnectionViewLayoutStrategy shall narrow the selected root's nested parts to those
          within the resolved scope.
        justification: |
          Once a root is selected, `expose` scoping must also narrow what is drawn inside it —
          otherwise every nested part of the selected root would still be rendered regardless of
          which parts the view actually exposed, defeating the purpose of scoping the interior
          content.
        tests:
          - InterconnectionView_BuildLayout_ExposeSinglePart_NarrowsToThatPart
          - InterconnectionView_BuildLayout_ExposeMultipleParts_UnionsBothSubtrees

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingConnectionRetention
        title: >-
          InterconnectionViewLayoutStrategy shall drop any connection whose endpoint was excluded
          by part filtering, while keeping a connection whose endpoints are both still in scope.
        justification: |
          A connector line referencing a part that scoping has removed would point at nothing;
          dropping such dangling connections keeps the diagram consistent, while a connection
          between two parts that both remain in scope must still be drawn.
        tests:
          - InterconnectionView_BuildLayout_ExposeSinglePart_NarrowsToThatPart
          - InterconnectionView_BuildLayout_ExposeMultipleParts_UnionsBothSubtrees

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingRecursionDepthLimit
        title: >-
          For a resolved expose scope subject with no unlimited-depth recursion (MembershipExact
          or NamespaceDirectChildren), InterconnectionViewLayoutStrategy shall limit interior
          expansion of the branch matched by that subject to its own direct part children,
          rendering any deeper container part in that branch as an intrinsic-sized leaf box
          instead of recursing into its own interior.
        justification: |
          A non-recursive `expose` form (`expose X;` / `expose X::*;`) asks for only the named
          scope's own direct children — not its entire composition subtree. Before this
          depth-limiting existed, the resolved scope's filter was applied only at depth 0 and every
          included part's interior was then expanded unconditionally regardless of whether the
          `expose` statement itself was recursive, silently over-rendering one extra level of nested
          parts the user never asked for. This decision is made independently per composition
          branch (see the design documentation's "Per-Branch Depth-Limited Recursion" section, and
          the ExposeScopingPerBranchRecursionIndependence requirement below for the mixed-subject
          case): a feature matching only non-recursive subjects has its own branch depth-limited,
          regardless of whether some *other* subject in the same scope is recursive. A branch whose
          feature matches at least one recursive subject, or the whole diagram when there is no
          scope at all (including the `--auto` view), continues to recurse fully at every depth,
          unchanged.
        tests:
          - InterconnectionView_BuildLayout_ExposeNonRecursiveSubjects_DoesNotRecurseIntoNestedPartsInterior
          - InterconnectionView_BuildLayout_ExposeRootOnly_NestedSubsystemInDifferentNamespace_RendersItsOwnUnits
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_ContainerFeature_RendersAsLeaf
          - InterconnectionView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PerBranchRecursionIndependence
        title: >-
          When a resolved expose scope combines a subject with unlimited-depth recursion
          (MembershipRecursive or NamespaceRecursive) and a subject with no recursion
          (MembershipExact or NamespaceDirectChildren), InterconnectionViewLayoutStrategy shall
          decide interior-expansion depth independently for each top-level branch — fully
          recursing the branch matched by the recursive subject while depth-limiting the branch
          matched only by the non-recursive subject — rather than applying one diagram-wide
          decision to every branch.
        justification: |
          An earlier implementation of the ExposeScopingRecursionDepthLimit requirement computed a
          single diagram-wide `unlimitedRecursion` boolean from the resolved scope's `Subjects` as a
          whole, so a scope such as `expose SystemDef::**; expose OtherDef;` applied unlimited
          recursion to the *entire* diagram, including parts reached only via the non-recursive
          `OtherDef` subject — over-collapsing a branch the user explicitly asked to keep
          depth-limited. This requirement replaces that diagram-wide simplification with a
          per-branch decision (see `ExposeScopeResolver.MatchesUnlimitedSubject` and the design
          documentation's "Per-Branch Depth-Limited Recursion" section): each top-level feature's
          own matched subject (not the scope's `Subjects` collection as a whole) determines that
          feature's own branch recursion depth, and that decision is threaded unchanged to every
          descendant of the branch, never re-derived by qualified-name matching past depth 0 (since
          composition-path depth and namespace-declaration depth are independent axes in SysML v2).
        tests:
          - InterconnectionView_BuildLayout_ExposeMixedRecursion_OnlyRecursiveBranchRecurses

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — InterconnectionViewLayoutStrategy shall select its root by the pre-scoping heuristic
          and render every nested part, unchanged from its pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; the pre-scoping heuristic root selection and full
          interior rendering must remain the default in both cases.
        tests:
          - InterconnectionView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ParallelConnectorPreservation
        title: >-
          When two or more distinct connections exist between the same pair of nested parts,
          InterconnectionViewLayoutStrategy shall preserve every connection as its own
          independently-routed connector rather than collapsing them onto one shared route.
        justification: |
          A real-world wiring model may have several separate connections (for example a power
          connection and an encoder connection) between the same two physical parts; visually
          merging them into what looks like a single connector loses information the diagram exists
          to communicate. Every parallel connection must remain visually distinct.
        tests:
          - InterconnectionView_BuildLayout_TwoConnectionsSamePair_ProducesTwoConnectorsWithoutException
          - InterconnectionView_BuildLayout_ThreeParallelConnections_ProducesThreeDistinctConnectors

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortLabeling
        title: >-
          InterconnectionViewLayoutStrategy shall label a port that a connector endpoint names but no
          declaration provides with the port-name segment of the endpoint reference.
        justification: |
          A connection endpoint such as `StepperMotorX.encoder` names a specific port on the part,
          not just the part itself; omitting that name discards information the diagram exists to
          show. Labeling the port with the real port name lets a reader identify which physical
          connector a line represents when the model does not declare the port. A declared port
          carries the richer label of the declared-port requirement.
        tests:
          - InterconnectionView_BuildLayout_ConnectionEndpointWithPortSegment_PortLabelReflectsSysmlPortName
          - InterconnectionView_BuildLayout_ThreeParallelConnections_ProducesThreeDistinctConnectors

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-CrossBoundaryLabelResolution
        title: >-
          When a connection endpoint references a part nested inside a container part (a
          cross-boundary reference such as `board.cpu`), InterconnectionViewLayoutStrategy shall
          resolve the full dotted reference for the port's label, reflecting the true nested
          target name, even though the connector itself still terminates at the container's own
          boundary.
        justification: |
          Discarding everything after the first dotted segment (the pre-fix behavior) silently
          mislabeled or unlabeled a cross-boundary connector, hiding which inner part it actually
          targets. Resolving the full path for the label is achievable without the larger
          architectural change genuine cross-boundary connector routing would require, and honestly
          documents the remaining limitation (the connector still terminates at the container
          boundary, not the inner part) rather than silently under-delivering.
        tests:
          - InterconnectionView_BuildLayout_CrossBoundaryEndpoint_LabelReflectsNestedTarget

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PartLabel
        title: >-
          InterconnectionViewLayoutStrategy shall label each nested part box with the part's
          short name, name, typing, and multiplicity as declared in the model, omitting any piece
          the model does not declare, and shall size the box to fit that label.
        justification: |
          The SysML v2 notation shows a usage's short name, name, type, and multiplicity together
          in its name line. Showing the same pieces the model declares lets a reader identify
          each part, how many instances it stands for, and what type it is without consulting the
          source, and sizing the box from the full label keeps the text from being clipped.
        tests:
          - InterconnectionView_BuildLayout_PartWithShortNameAndMultiplicity_ShowsThemInLabel
          - InterconnectionView_BuildLayout_ContainerWithLongLabel_IsAtLeastLabelWide

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedSpecificityTieBreak
        title: >-
          When more than one candidate root is relevant to the resolved expose scope and they are
          not independent composition roots, InterconnectionViewLayoutStrategy shall select the
          most specific (deepest-qualified-name) relevant candidate, using its connections/parts
          heuristic only to break ties among
          equally specific candidates.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and a nested descendant
          definition can both be relevant to the same resolved `expose` scope. Without a
          specificity-first tie-break, the ancestor could win by raw connections/parts score even
          though the user's `expose` statement was scoped to the nested descendant, silently
          defeating the intended scoping.
        tests:
          - InterconnectionView_BuildLayout_ExposeInnerPartOfNestedDefinition_SelectsNestedDefinitionNotAncestor

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-MultipleRoots
        title: >-
          When the resolved expose scope makes more than one independent composition root relevant,
          InterconnectionViewLayoutStrategy shall draw every such root as its own container box, side
          by side in declaration order with aligned tops, each holding only its own parts.
        justification: |
          SysML v2.1 Beta 2 8.2.3.11 defines the interconnection view as a repeated list of
          interconnection elements, so a view exposing several systems (`expose A::**; expose B::**;`)
          must show all of them rather than silently drawing only the first. A root that is merely a
          namespace ancestor of another relevant root is not drawn separately, and a single root is
          laid out exactly as before.
        tests:
          - InterconnectionView_BuildLayout_ExposeTwoIndependentRoots_DrawsBothSideBySide
          - InterconnectionView_BuildLayout_ExposeInnerPartOfNestedDefinition_SelectsNestedDefinitionNotAncestor

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortTitleCollisionAvoidance
        title: >-
          InterconnectionViewLayoutStrategy shall ensure no part-box port anchor or label lands
          within that box's own title area, even under a high incident-connection count.
        justification: |
          Each part box renders a two-line "«keyword» / name : type" title in its header row; a
          port placed across that band visually collides with the title text, making both
          unreadable. Flagging every part node as carrying a title when handed to the layered
          algorithm (see LayeredPlacement's TitleAwarePorts requirement) activates the engine's
          automatic title-vs-side-port reservation, so no port ever lands in the header row a
          titled box renders — this holds regardless of how many connections are incident to a
          part.
        tests:
          - InterconnectionView_BuildLayout_PartWithPorts_PortsNeverOverlapBoxTitleArea

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallback
        title: >-
          When no candidate root definition is scope-relevant but the resolved expose scope
          directly includes one or more top-level part feature usages, InterconnectionViewLayoutStrategy
          shall render those features as boxless nodes side by side instead of an empty canvas,
          applying the same depth-limited interior expansion (see the
          ExposeScopingRecursionDepthLimit requirement) as the normal container-rooted path.
        justification: |
          Per SysML v2 spec §8.3.26.11 and §9.2.20.2.6, an InterconnectionView's exposed content
          need not be a single definition — a scope such as `expose PublishingSubsystem::*;` where
          `PublishingSubsystem` is itself only a namespace-like `part def` with a single nested
          `part` feature usage names something concrete to draw even though no single `part def`
          qualifies as "the" root. Before this fallback, `FindRoot` returning no root always
          produced a totally empty canvas in this shape, silently discarding a valid diagram. Boxless
          side-by-side placement (reusing the same `LayeredPlacement.PlaceWithPorts` containment
          packing every other case already uses) and reusing the same container-vs-leaf recursion
          `CollectParts` uses for every other nested part (via the shared `BuildPartItem` helper)
          avoids duplicating any layout or recursion logic for this fallback — including whether
          that recursion is depth-limited: a top-level feature exposed by a purely non-recursive
          scope renders as a leaf with no nested interior drawn, exactly like a depth-limited nested
          container part would.
        tests:
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_NoRootDef_RendersTopLevelFeatureWithoutFrame
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_TwoTopLevelParts_ArrangesSideBySideNoFrame
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_ContainerFeature_RendersAsLeaf
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_NestedTopLevelFeatureExcluded_NotDuplicated

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallbackConnections
        title: >-
          When two or more boxless top-level parts are connected by a connection whose own
          qualified name is itself within the resolved expose scope, InterconnectionViewLayoutStrategy
          shall draw a connector between them; otherwise no edges are drawn for the fallback.
        justification: |
          A connector between two top-level exposed features is a rare but valid shape a resolved
          `expose` scope can name; if it is itself resolvable and in scope, it must be drawn so the
          diagram does not silently omit a relationship the model actually declares. This reuses the
          same endpoint-resolution logic (`ResolveEndpoint`) as every other connection in this
          strategy.
        tests:
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_ConnectionBetweenTopLevelFeatures_DrawsEdge

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedTopLevelFeatureFallbackEmptyCanvas
        title: >-
          When no candidate root definition is scope-relevant and the resolved expose scope
          matches no part feature usage, InterconnectionViewLayoutStrategy shall return the
          existing minimal empty canvas, unchanged.
        justification: |
          The no-single-root scoped fallback must never regress the pre-existing empty-canvas
          behavior for a scope (or absence of scope) that genuinely names nothing concrete to
          draw — for example a scope whose only member is a non-part feature. Preserving the exact
          `new LayoutTree(200.0, 100.0, [])` result in that case keeps every other unit that
          consumes an Interconnection View's `LayoutTree` unaffected.
        tests:
          - InterconnectionView_BuildLayout_ExposeNamespaceDirectChildren_NoMatchingFeature_ReturnsMinimalCanvas
          - InterconnectionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-TopLevelOwnerScopedConnections
        title: >-
          When the no-single-root scoped fallback collects top-level parts from two or more
          different containing definitions that happen to share a simple part name,
          InterconnectionViewLayoutStrategy shall resolve each definition's own connections only
          against that definition's own top-level parts, never against a same-named top-level part
          collected from a different containing definition.
        justification: |
          A connection's endpoints are only meaningful relative to its own containing definition's
          direct children. Before this fix, `ResolveTopLevelConnections` built one flat
          `Dictionary<string, int>` simple-name index from every top-level part collected across
          the entire workspace scan; when two different containing definitions each declared a
          same-named part (e.g. both `part logger : Logger;`), `TryAdd` silently kept only the
          first occurrence, so a connection declared inside the *other* definition resolved against
          the wrong definition's part — producing a bogus edge, or silently dropping the intended
          one. Grouping collected top-level parts by their own `OwnerQualifiedName` (tracked by
          `CollectTopLevelScopedParts` from each matched feature's own containing definition, not
          re-derived by simple-name matching) and resolving each definition's own connections only
          against its own owner-restricted index eliminates this cross-owner name collision, without
          changing the unrelated single-root `BuildPartIndex`/`ResolveConnections` path at all.
        tests:
          - InterconnectionView_BuildLayout_TopLevelNameCollisionAcrossOwners_ResolvesOwnConnection

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-DeclaredPorts
        title: >-
          InterconnectionViewLayoutStrategy shall resolve the ports a part declares in its own body,
          through its type, and through the supertypes of that type, and shall draw each one as a port
          labeled outside the part with its name and type (name : Type, or name : ~Type when the
          port is typed by a conjugated port definition).
        justification: |
          SysML v2.0 clause 8.2.3.12 draws a port as a small square on the part boundary with the
          label `name : Type` beside it, and a conjugated type with a leading tilde. A part's
          ports are declared on its definition or an inherited one far more often than in the
          usage body, so a view that only knew the ports named by connectors could not show
          the type, direction, or a port that nothing is wired to.
        tests:
          - InterconnectionView_BuildLayout_DeclaredPorts_DirectionAppearanceMatchesInOutInout
          - InterconnectionView_BuildLayout_ConjugatedPort_LabelShowsTildeType
          - InterconnectionView_BuildLayout_PortLabel_IsNameColonTypeWithMultiplicity
          - InterconnectionView_BuildLayout_InheritedTypeAndInlinePorts_AreResolved
          - InterconnectionView_BuildLayout_UndeclaredEndpointSegment_KeepsBareNameLabelWithOutlinedGlyph

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortGlyphs
        title: >-
          InterconnectionViewLayoutStrategy shall draw a declared port as an outlined rounded square
          whose direction arrow follows the declared direction (in, out, or inout, none when
          undirected) and whose outline is dashed for a reference port.
        justification: |
          The direction of a port and whether it is a reference are part of its notation in SysML
          v2.0 clause 8.2.3.12 and Table 9; the filled square the layout engine draws by default
          carries neither. The tests assert the appearance handed to the renderers.
        tests:
          - InterconnectionView_BuildLayout_DeclaredPorts_DirectionAppearanceMatchesInOutInout
          - InterconnectionView_BuildLayout_ReferencePort_HasDashedOutline
          - InterconnectionView_BuildLayout_MotorRigGalleryModel_ShowsPortNotation

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortLabelOutside
        title: >-
          InterconnectionViewLayoutStrategy shall draw a port label outside its part and shall keep
          every port glyph and label inside the canvas, clear of the other ports, labels, and boxes.
        justification: |
          A label inside the box collides with the title and the compartments, and a label that
          leaves the canvas is clipped. SysML v2.0 draws the label outside, beside the port.
        tests:
          - InterconnectionView_BuildLayout_OutwardLabels_StayInsideCanvas
          - InterconnectionView_BuildLayout_UnconnectedDeclaredPort_IsDrawnOnBoxBorderWithoutOverlap

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-SharedPort
        title: >-
          When several connectors name the same declared port, InterconnectionViewLayoutStrategy shall
          show the port's label once.
        justification: |
          A SysML port with several connectors is one port; the layout engine emits a glyph per
          connector end, and repeating the label at each would read as several ports.
        tests:
          - InterconnectionView_BuildLayout_PortWithTwoConnections_LabelAppearsOnce

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-UnconnectedPorts
        title: >-
          InterconnectionViewLayoutStrategy shall draw a declared port that no drawn connector names
          on the left face of its part (the right face for an out port), below the title area, clear
          of every other port, label, box, and connector, and shall reserve room for it in the part
          height.
        justification: |
          A port is part of the part's interface whether or not anything is connected to it; the
          layout engine emits only connected ports, so the strategy places the others itself after
          the layout, where the positions of the boxes, ports, and lines are final.
        tests:
          - InterconnectionView_BuildLayout_UnconnectedDeclaredPort_IsDrawnOnBoxBorderWithoutOverlap
          - InterconnectionView_BuildLayout_SharedPortAndUnconnectedPort_LaysOutClear
          - InterconnectionView_BuildLayout_MotorRigGalleryModel_ShowsPortNotation

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-RootFramePorts
        title: >-
          InterconnectionViewLayoutStrategy shall draw the declared ports of the root element on the
          border of its frame, with their labels outside it, and shall make room for those labels on
          the canvas.
        justification: |
          The ports of the element whose interior is shown are its interface to the outside, drawn on
          the frame boundary in SysML v2.0 Table 9. Connectors to a frame port are not routed; that
          limitation is documented in the design.
        tests:
          - InterconnectionView_BuildLayout_RootFramePorts_DrawnOnFrameBorder
          - InterconnectionView_BuildLayout_ComputerGalleryModel_ShowsFrameAndNestedPorts

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ReferencePartOutline
        title: >-
          InterconnectionViewLayoutStrategy shall draw a reference usage with a dashed outline and the
          keyword ref followed by its kind (ref part), and every other usage with a solid outline.
        justification: |
          SysML v2.0 clause 8.2.3.6 draws a reference usage as a dashed rounded rectangle.
        tests:
          - InterconnectionView_BuildLayout_ReferencePart_HasDashedOutlineAndRefKeyword
          - InterconnectionView_BuildLayout_WorkstationGalleryModel_ShowsUsageNotation

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-UsageKinds
        title: >-
          InterconnectionViewLayoutStrategy shall draw part, item, action, state, and occurrence
          usages as nodes, each headed by its own keyword.
        justification: |
          SysML v2.0 clause 8.2.3.11 allows every occurrence usage as an interconnection element; a
          view limited to parts would drop the items and behaviors a part is connected to.
        tests:
          - InterconnectionView_BuildLayout_ItemActionStateOccurrenceUsages_AreNodes

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-UsageRoot
        title: >-
          InterconnectionViewLayoutStrategy shall draw the interior of a part usage declared in a
          package whose body declares nested parts and connectors when there is no part definition
          to show, and shall draw a part usage with an inline body that declares nested parts as a
          container.
        justification: |
          A model can describe a system as a usage without defining a type for it; the view then
          has nothing else to show, and an inline body is as much a structure as a typed one.
        tests:
          - InterconnectionView_BuildLayout_UsageRoot_RendersBodyWithoutDefinition
          - InterconnectionView_BuildLayout_InlineBodyPart_RecursesAsContainer

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-FrameInterconnectionTitle
        title: >-
          InterconnectionViewLayoutStrategy shall head the root frame with its keyword and name and a
          centered italic compartment title interconnection, and shall place the interior below it.
        justification: |
          SysML v2.0 clause 8.2.3.11 labels the graphical interconnection compartment of an element.
        tests:
          - InterconnectionView_BuildLayout_RootFrame_HasInterconnectionTitleCompartment

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PartCompartments
        title: >-
          InterconnectionViewLayoutStrategy shall show the documentation and attribute usages of a
          part in doc and attributes compartments of its box and size the box to fit them.
        justification: |
          A part node is a name compartment and a compartment stack (SysML v2.0 clause 8.2.3.5);
          ports are glyphs and nested parts are boxes, so the documentation and attributes are what
          remains for the stack.
        tests:
          - InterconnectionView_BuildLayout_PartWithAttributesAndDoc_ShowsCompartments

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ConnectorKinds
        title: >-
          InterconnectionViewLayoutStrategy shall draw a binding as a plain line labeled =, an
          interface as a plain line labeled «interface» followed by its name, and a flow as a line
          with a filled arrowhead at its target end labeled «flow» followed by its name and payload,
          and shall not draw message or allocation usages.
        justification: |
          SysML v2.0 clauses 8.2.3.13 to 8.2.3.16 give each connector kind its own notation, and a
          message or an allocation is drawn in other views. Distinguishing the kinds lets a reader
          tell a flow of items from a plain link.
        tests:
          - InterconnectionView_BuildLayout_BindingConnector_HasEqualsLabel
          - InterconnectionView_BuildLayout_FlowConnector_HasFilledArrowAndFlowLabel
          - InterconnectionView_BuildLayout_InterfaceConnector_HasInterfaceLabel
          - InterconnectionView_BuildLayout_MessageAndAllocation_AreNotDrawn

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ConnectionEndLabels
        title: >-
          InterconnectionViewLayoutStrategy shall label each connector end with the role name above
          and the multiplicity below when the model declares them, and shall add no end label when it
          declares neither.
        justification: |
          SysML v2.0 clause 8.2.3.13 shows the role name and multiplicity at each end of a
          connection; they say what each end plays and how many instances take part.
        tests:
          - InterconnectionView_BuildLayout_ConnectionEnds_RoleNameAndMultiplicityBecomeEndLabels
          - InterconnectionView_BuildLayout_ConnectionWithoutEnds_HasNoEndLabels

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-MidpointLabelClearance
        title: >-
          InterconnectionViewLayoutStrategy shall keep a connector's midpoint label clear of port
          glyphs, port labels, and boxes by opening the space between the boxes when the label would
          otherwise cover them.
        justification: |
          The layout engine reserves room between boxes for port and end labels but not for a midpoint
          label such as «flow» torque of Torque, which then lands on the port labels.
        tests:
          - InterconnectionView_BuildLayout_MotorRigGalleryModel_MidpointLabelsClearOfPortLabels
          - LayeredPlacement_WidenForMidpointLabels_LabelOverlappingPortLabels_IsSeparated

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExcludedMembers
        title: >-
          InterconnectionViewLayoutStrategy shall ignore members flagged IsExcludedFromDiagrams:
          they are neither parts, ports or connectors of the drawn view nor a reason to choose their
          owner as the root.
        justification: |
          Members modeled only for name resolution have no notation yet; counting or drawing them
          would change existing diagrams.
        tests:
          - InterconnectionView_BuildLayout_ExcludedPartUsage_RenderIdenticallyToWorkspaceWithout

---
# InterconnectionViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the InterconnectionViewLayoutStrategy unit
# - InterconnectionViewLayoutStrategy lays out the internals of one part definition
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: InterconnectionViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Internals
        title: >-
          InterconnectionViewLayoutStrategy shall render the selected part definition as a
          container box enclosing one box per nested part usage.
        justification: |
          An Interconnection View exists to show the internal structure of a part definition — its
          nested parts inside a container. The container box and one box per nested part are the
          observable content the view must provide.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Ports
        title: >-
          InterconnectionViewLayoutStrategy shall place a port on a part box for every connection
          incident to that part.
        justification: |
          Connections attach to parts at ports. Providing one port per incident connection is the
          observable anchor the connector lines are drawn between.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-Connectors
        title: >-
          InterconnectionViewLayoutStrategy shall draw one connector line for each connection between
          nested parts.
        justification: |
          The connections between nested parts are the relationships an Interconnection View
          communicates; drawing one connector line per connection is the observable evidence of them.
        tests:
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NonOverlapping
        title: >-
          InterconnectionViewLayoutStrategy shall position the nested part boxes so that they do
          not overlap one another.
        justification: |
          Overlapping part boxes produce an unreadable internal-structure diagram. Non-overlap is
          an observable property of the produced geometry the strategy must guarantee.
        tests:
          - InterconnectionView_BuildLayout_PartBoxes_DoNotOverlap

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no part definition with renderable internals,
          InterconnectionViewLayoutStrategy shall return a minimal empty canvas with no nodes.
        justification: |
          With no eligible part definition there is nothing to draw; a well-formed empty canvas
          lets the renderer produce a valid blank diagram rather than failing.
        tests:
          - InterconnectionView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NestedContainer
        title: >-
          When a nested part is typed by a non-standard-library part definition that has its own
          nested part usages, InterconnectionViewLayoutStrategy shall lay out that inner structure
          recursively and nest it as the children of the part's container box.
        justification: |
          A part whose type has internal structure is a container; showing that structure nested
          inside the container box is the whole purpose of a hierarchical Interconnection View.
          Reusing the same flat placement at every level (recursive bottom-up, ELK
          SEPARATE_CHILDREN) yields genuine two-level nested block diagrams.
        tests:
          - InterconnectionView_BuildLayout_NestedContainer_PlacesChildrenInsideContainerBox

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ContainerSizing
        title: >-
          InterconnectionViewLayoutStrategy shall size each container box so that it bounds its
          nested children together with its title area and edge insets.
        justification: |
          A container box must fully enclose the interior it was laid out from; if it were smaller
          than its children plus its title and insets, the nested content would overflow the border
          and produce an unreadable diagram.
        tests:
          - InterconnectionView_BuildLayout_ContainerSize_BoundsChildrenAndTitle

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ChildPositioning
        title: >-
          InterconnectionViewLayoutStrategy shall position a container's nested children at absolute
          coordinates offset from the container box's top-left origin.
        justification: |
          The renderer draws nested children using absolute coordinates, so the interior content —
          laid out relative to its own origin — must be translated to the container's absolute
          position for the nested boxes, ports, and connectors to appear inside the container.
        tests:
          - InterconnectionView_BuildLayout_NestedChildren_RenderedAtAbsoluteCoordinates

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-SingleLevelNoOp
        title: >-
          When no nested part is typed by a definition with its own nested parts,
          InterconnectionViewLayoutStrategy shall produce only leaf part boxes with no nested
          children, leaving single-level output unchanged.
        justification: |
          The recursive capability must be a strict no-op for flat models so that existing
          single-level Interconnection Views are unaffected; a leaf-only model must yield exactly
          the non-recursive layout.
        tests:
          - InterconnectionView_BuildLayout_NoNesting_ProducesFlatLeafBoxes

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-CycleGuard
        title: >-
          When a nested part is typed by a definition that is already on the recursion path,
          InterconnectionViewLayoutStrategy shall treat that part as a leaf rather than recursing
          into it.
        justification: |
          A self-referential or mutually-referential part definition would otherwise recurse
          without bound; treating an already-visited type as a leaf guarantees termination while
          still drawing the part.
        tests:
          - InterconnectionView_BuildLayout_SelfReferentialType_TreatedAsLeaf

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingRootSelection
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          InterconnectionViewLayoutStrategy shall restrict its heuristic root selection to a
          candidate relevant to the resolved scope.
        justification: |
          The Interconnection View renders exactly one selected root's interior, so `expose`
          scoping cannot narrow a workspace-wide collection directly; instead it restricts which
          root is selected — accepting the current heuristic root itself, an inner part of it, a
          definition containing the heuristic default, or the resolved type of an exposed usage —
          and selecting no root at all when nothing in the workspace is relevant to the scope.
        tests:
          - InterconnectionView_BuildLayout_ExposeNonHeuristicRoot_SelectsExposedRoot
          - InterconnectionView_BuildLayout_ExposeInnerChildOfNonHeuristicRoot_SelectsItsRoot
          - InterconnectionView_BuildLayout_ExposeUnrelatedDefinition_NoRootSelected_ReturnsMinimalCanvas
          - InterconnectionView_BuildLayout_ExposedUsage_ResolvesThroughTypingToRoot

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingPartFiltering
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          InterconnectionViewLayoutStrategy shall narrow the selected root's nested parts to those
          within the resolved scope.
        justification: |
          Once a root is selected, `expose` scoping must also narrow what is drawn inside it —
          otherwise every nested part of the selected root would still be rendered regardless of
          which parts the view actually exposed, defeating the purpose of scoping the interior
          content.
        tests:
          - InterconnectionView_BuildLayout_ExposeSinglePart_NarrowsToThatPart
          - InterconnectionView_BuildLayout_ExposeMultipleParts_UnionsBothSubtrees

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ExposeScopingConnectionRetention
        title: >-
          InterconnectionViewLayoutStrategy shall drop any connection whose endpoint was excluded
          by part filtering, while keeping a connection whose endpoints are both still in scope.
        justification: |
          A connector line referencing a part that scoping has removed would point at nothing;
          dropping such dangling connections keeps the diagram consistent, while a connection
          between two parts that both remain in scope must still be drawn.
        tests:
          - InterconnectionView_BuildLayout_ExposeSinglePart_NarrowsToThatPart
          - InterconnectionView_BuildLayout_ExposeMultipleParts_UnionsBothSubtrees

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — InterconnectionViewLayoutStrategy shall select its root by the pre-scoping heuristic
          and render every nested part, unchanged from its pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; the pre-scoping heuristic root selection and full
          interior rendering must remain the default in both cases.
        tests:
          - InterconnectionView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ParallelConnectorPreservation
        title: >-
          When two or more distinct connections exist between the same pair of nested parts,
          InterconnectionViewLayoutStrategy shall preserve every connection as its own
          independently-routed connector rather than collapsing them onto one shared route.
        justification: |
          A real-world wiring model may have several separate connections (for example a power
          connection and an encoder connection) between the same two physical parts; visually
          merging them into what looks like a single connector loses information the diagram exists
          to communicate. Every parallel connection must remain visually distinct.
        tests:
          - InterconnectionView_BuildLayout_TwoConnectionsSamePair_ProducesTwoConnectorsWithoutException
          - InterconnectionView_BuildLayout_ThreeParallelConnections_ProducesThreeDistinctConnectors

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-PortLabeling
        title: >-
          InterconnectionViewLayoutStrategy shall label each connector's ports with the SysML
          port-name segment of the connection's endpoint reference, when present.
        justification: |
          A connection endpoint such as `StepperMotorX.encoder` names a specific port on the part,
          not just the part itself; omitting that name (as the pre-fix rendering did) discards
          information the diagram exists to show. Labeling the port with the real port name lets a
          reader identify which physical connector a line represents.
        tests:
          - InterconnectionView_BuildLayout_ConnectionEndpointWithPortSegment_PortLabelReflectsSysmlPortName
          - InterconnectionView_BuildLayout_ThreeParallelConnections_ProducesThreeDistinctConnectors

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-CrossBoundaryLabelResolution
        title: >-
          When a connection endpoint references a part nested inside a container part (a
          cross-boundary reference such as `board.cpu`), InterconnectionViewLayoutStrategy shall
          resolve the full dotted reference for the port's label, reflecting the true nested
          target name, even though the connector itself still terminates at the container's own
          boundary.
        justification: |
          Discarding everything after the first dotted segment (the pre-fix behavior) silently
          mislabeled or unlabeled a cross-boundary connector, hiding which inner part it actually
          targets. Resolving the full path for the label is achievable without the larger
          architectural change genuine cross-boundary connector routing would require, and honestly
          documents the remaining limitation (the connector still terminates at the container
          boundary, not the inner part) rather than silently under-delivering.
        tests:
          - InterconnectionView_BuildLayout_CrossBoundaryEndpoint_LabelReflectsNestedTarget

      - id: SysML2Tools-Core-Layout-Internal-InterconnectionViewLayoutStrategy-ScopedSpecificityTieBreak
        title: >-
          When more than one candidate root is relevant to the resolved expose scope,
          InterconnectionViewLayoutStrategy shall select the most specific (deepest-qualified-name)
          relevant candidate, using its connections/parts heuristic only to break ties among
          equally specific candidates.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and a nested descendant
          definition can both be relevant to the same resolved `expose` scope. Without a
          specificity-first tie-break, the ancestor could win by raw connections/parts score even
          though the user's `expose` statement was scoped to the nested descendant, silently
          defeating the intended scoping.
        tests:
          - InterconnectionView_BuildLayout_ExposeInnerPartOfNestedDefinition_SelectsNestedDefinitionNotAncestor
          - InterconnectionView_BuildLayout_ExposeBothSameDepthSiblings_ScoreBreaksTieNotLength

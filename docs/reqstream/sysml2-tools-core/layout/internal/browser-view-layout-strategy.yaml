---
# BrowserViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the BrowserViewLayoutStrategy unit
# - BrowserViewLayoutStrategy lays out a Browser View as an indented membership tree
# - Requirements describe the observable tree, not the arithmetic used

sections:
  - title: BrowserViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-BrowserViewLayoutStrategy-IndentedTree
        title: >-
          BrowserViewLayoutStrategy shall render the membership hierarchy as an indented tree of
          rows in which a nested element is indented further than its containing element, with a
          connector from each parent to its children.
        justification: |
          A browser view communicates containment. Indenting children beyond their parents and
          drawing parent-to-child connectors makes the membership hierarchy immediately readable,
          matching the tree presentation users expect from a model browser.
        tests:
          - BrowserView_BuildLayout_NestedElements_AreIndentedByDepth

      - id: SysML2Tools-Core-Layout-Internal-BrowserViewLayoutStrategy-EmptyInput
        title: >-
          When the workspace contains no user-defined elements, BrowserViewLayoutStrategy shall
          produce an empty diagram.
        justification: |
          With no elements to show, an empty diagram avoids rendering an empty tree frame that
          could be mistaken for missing content.
        tests:
          - BrowserAndGrid_BuildLayout_EmptyWorkspace_ReturnMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-BrowserViewLayoutStrategy-ExposeScoping
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          BrowserViewLayoutStrategy shall scope the tree to the union of each edge's target
          containment subtree, resolved through the target's own type reference when the target
          is a usage rather than a definition, promoting an exposed target whose own parent was
          filtered out to a forest root.
        justification: |
          The Browser View has no single-root heuristic to restrict, so it applies the shared
          `expose` scope directly as a workspace-wide element filter, giving it the same
          observable scoping behavior as every other view kind, while still producing a
          well-formed forest when an exposed target's parent falls outside the scope.
        tests:
          - BrowserView_BuildLayout_ExposedName_UnionsAdditionalSubtree
          - BrowserView_BuildLayout_ExposeMultipleTargets_UnionsBothSubtrees
          - BrowserView_BuildLayout_ExposedUsage_ResolvesThroughTypingToDefinitionSubtree

      - id: SysML2Tools-Core-Layout-Internal-BrowserViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — BrowserViewLayoutStrategy shall render the full membership forest, unchanged from its
          pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; rendering the full membership forest must remain
          the default in both cases.
        tests:
          - BrowserView_BuildLayout_NullViewNode_RendersFullWorkspaceUnchanged

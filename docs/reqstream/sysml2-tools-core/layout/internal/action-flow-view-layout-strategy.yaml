---
# ActionFlowViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the ActionFlowViewLayoutStrategy unit
# - ActionFlowViewLayoutStrategy lays out an Action Flow View diagram
# - Requirements describe observable diagram content, not the placement algorithm

sections:
  - title: ActionFlowViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-Actions
        title: >-
          ActionFlowViewLayoutStrategy shall render a box for each action, a start marker entering
          the initial actions, a done marker leaving the final actions, and a flow arrow for each
          succession.
        justification: |
          An Action Flow View exists to show the actions of a behavior, where the flow starts and
          ends, and how control passes between actions. The action boxes, start and done markers,
          and flow arrows are the observable content the view must provide.
        tests:
          - ActionFlowView_BuildLayout_ActionsAndSuccessions_ProducesBoxesMarkersAndFlows

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-TopToBottom
        title: >-
          ActionFlowViewLayoutStrategy shall place the target action of a succession below its
          source action.
        justification: |
          Reading an action flow top-to-bottom is the diagram convention; placing each successor
          below its predecessor makes the direction of control flow immediately apparent.
        tests:
          - ActionFlowView_BuildLayout_Successions_FlowTopToBottom

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-EmptyCanvas
        title: >-
          When the workspace contains no action definition, ActionFlowViewLayoutStrategy shall
          return a minimal empty canvas with no nodes.
        justification: |
          With no action definition there is nothing to draw; a well-formed empty canvas lets the
          renderer produce a valid blank diagram rather than failing.
        tests:
          - ActionFlowView_BuildLayout_EmptyWorkspace_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-SuccessionLineStyle
        title: >-
          ActionFlowViewLayoutStrategy shall draw each succession flow edge as a dashed line with
          an open end marker at the target action.
        justification: |
          SysML v2 succession notation uses a dashed line with an open end marker. Applying these
          properties makes the rendered succession edges conform to the standard notation so that
          diagram readers can identify control flow at a glance.
        tests:
          - ActionFlowView_BuildLayout_SuccessionEdge_IsDashedWithOpenArrowhead

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-StartDoneConnectorStyle
        title: >-
          ActionFlowViewLayoutStrategy shall draw the connector from the start marker to an action
          and from an action to the done marker in the same style as an action-to-action
          succession: a dashed line with an open end marker.
        justification: |
          In SysML v2 notation the start and done markers are joined to actions by successions,
          which are drawn dashed with an open arrowhead. Drawing these connectors differently
          from the other successions would misrepresent them as a different kind of relationship.
        tests:
          - ActionFlowView_BuildLayout_BranchAndJoin

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-OrthogonalFlow
        title: >-
          ActionFlowViewLayoutStrategy shall place actions top-to-bottom along the succession flow,
          without overlapping action boxes, and route each succession as an orthogonal (axis-aligned)
          polyline.
        justification: |
          A directed top-to-bottom reading with non-overlapping boxes and orthogonal connectors makes
          the control flow of a behavior clear and matches the block-diagram visual style used across
          the tool.
        tests:
          - ActionFlowView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
          - ActionFlowView_BuildLayout_NoOverlap

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-BranchAndJoin
        title: >-
          ActionFlowViewLayoutStrategy shall render every action of a branching-and-joining flow, with
          the start marker entering only the actions that have no predecessor, the done marker leaving
          only the actions that have no successor, and a dashed open-marker succession for each edge.
        justification: |
          Behaviors commonly fork into parallel branches and merge again. Rendering all actions, the
          correct start and done attachments, and every succession ensures the diagram faithfully
          conveys the branch-and-join structure of the flow.
        tests:
          - ActionFlowView_BuildLayout_BranchAndJoin
          - ActionFlowView_BuildLayout_Cycle_IsBroken

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ExposeScopingRootSelection
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          ActionFlowViewLayoutStrategy shall restrict its heuristic root selection to a candidate
          relevant to the resolved scope.
        justification: |
          The Action Flow View renders exactly one selected root's actions, so `expose` scoping
          cannot narrow a workspace-wide collection directly; instead it restricts which root is
          selected — accepting the current heuristic root itself, an inner action of it, a
          definition containing the heuristic default, or the resolved type of an exposed usage —
          and selecting no root at all when nothing in the workspace is relevant to the scope.
        tests:
          - ActionFlowView_BuildLayout_ExposeNonHeuristicRoot_SelectsExposedRoot
          - ActionFlowView_BuildLayout_ExposeInnerChildOfNonHeuristicRoot_SelectsItsRoot
          - ActionFlowView_BuildLayout_ExposeUnrelatedDefinition_NoRootSelected_ReturnsMinimalCanvas
          - ActionFlowView_BuildLayout_ExposedUsage_ResolvesThroughTypingToRoot

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ExposeScopingActionFiltering
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          ActionFlowViewLayoutStrategy shall narrow the selected root's declared actions to those
          within the resolved scope.
        justification: |
          Once a root is selected, `expose` scoping must also narrow what is drawn inside it —
          otherwise every declared action of the selected root would still be rendered regardless
          of which actions the view actually exposed, defeating the purpose of scoping the flow's
          content.
        tests:
          - ActionFlowView_BuildLayout_ExposeSingleAction_DropsOutOfScopeAction

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ExposeScopingSuccessionEndpointRetention
        title: >-
          ActionFlowViewLayoutStrategy shall conservatively re-include any action excluded by
          action filtering that is still referenced by an in-scope succession, so only genuinely
          isolated out-of-scope actions are dropped.
        justification: |
          A succession whose endpoint action was excluded by filtering would otherwise point at
          nothing; the existing succession-endpoint pass (which has no independent qualified name
          to filter against) reintroduces any action still referenced by an in-scope succession,
          keeping the flow's control edges readable while still dropping actions with no remaining
          reference.
        tests:
          - ActionFlowView_BuildLayout_ExposeSingleAction_DropsOutOfScopeAction

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — ActionFlowViewLayoutStrategy shall select its root by the pre-scoping heuristic and
          render every action, unchanged from its pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; the pre-scoping heuristic root selection and full
          action rendering must remain the default in both cases.
        tests:
          - ActionFlowView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ScopedSpecificityTieBreak
        title: >-
          When more than one candidate root is relevant to the resolved expose scope,
          ActionFlowViewLayoutStrategy shall select the most specific (deepest-qualified-name)
          relevant candidate, using its succession/action score only to break ties among equally
          specific candidates.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and a nested descendant
          definition can both be relevant to the same resolved `expose` scope. Without a
          specificity-first tie-break, the ancestor could win by raw succession/action score even
          though the user's `expose` statement was scoped to the nested descendant, silently
          defeating the intended scoping.
        tests:
          - ActionFlowView_BuildLayout_ExposeInnerActionOfNestedDefinition_SelectsNestedDefinitionNotAncestor

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ControlNodeShapes
        title: >-
          ActionFlowViewLayoutStrategy shall render "decide"/"merge" action nodes as a
          LayoutBadge with BadgeShape.Diamond, "fork"/"join" nodes as a thick bar, "terminate"
          nodes as a crossed circle, and "accept"/"send" action nodes as a LayoutBox with
          BoxShape.RoundedRectangle, while leaving ordinary "action" node rendering unchanged.
        justification: |
          Control nodes are semantically distinct from ordinary actions and the existing
          State Transition View precedent already separates pseudostate markers from real
          state boxes; Action Flow View needs the analogous visual separation so branch points,
          decision points, and flow ends are recognizable at a glance. Diamond nodes use a size
          derived from their connection count, and their rendered Label is blanked when the
          underlying name is an AstBuilder-synthesized internal identifier.
        tests:
          - ActionFlowView_BuildLayout_DecisionAndMerge_RenderDiamondBadges
          - ActionFlowView_BuildLayout_SyntheticControlNodeName_RendersBlankLabel
          - ActionFlowView_BuildLayout_CompactActionThenIdiom_ResolvesBothNodes
          - ActionFlowView_BuildLayout_Decision_ConnectorsTouchTheDiamondOutline

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ThickForkJoinBars
        title: >-
          ActionFlowViewLayoutStrategy shall render fork and join nodes as unlabeled thick bars
          (BadgeShape.ThickHorizontalBar) long enough for their connections to attach at least
          16 px apart, with every connector touching the drawn bar.
        justification: |
          The SysML v2 graphical notation draws a fork or join as a wide thick bar without a
          label. The layout engine spreads connections on a face at least 16 px apart, so a bar
          shorter than its fan-out allows would push connections onto its short sides. The engine
          also reserves a taller slot than the 4 px bar, so connectors are snapped to the drawn
          bar rather than left stopping short of it.
        tests:
          - ActionFlowView_BuildLayout_ForkAndJoin_RenderThickBarBadges_WithoutLabel
          - ActionFlowView_BuildLayout_ThickBar_LengthGrowsWithFanOut
          - ActionFlowView_BuildLayout_ThickBar_AnchorsAtLeast16pxApart
          - ActionFlowView_BuildLayout_ThickBar_ConnectorsTouchTheBar
          - ActionFlowView_BuildLayout_ThickBar_SingleConnection_RunsStraight

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-SuccessionGuards
        title: >-
          ActionFlowViewLayoutStrategy shall label a guarded succession with its bracketed guard
          and a succession declared with else with the word else, without brackets.
        justification: |
          The SysML v2 graphical notation labels the branches of a decision with their guard
          expressions and the default branch with else; without the labels a decision's
          branches are indistinguishable.
        tests:
          - ActionFlowView_BuildLayout_GuardedSuccession_LabelsEdge
          - ActionFlowView_BuildLayout_ElseSuccession_LabelsEdgeElse

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-GuardLabelRun
        title: >-
          ActionFlowViewLayoutStrategy shall carry the guard or else label of a decision branch on
          a vertical run of its connector that leaves the diamond end, the horizontal run, other
          connectors, and the arrowhead visible, keeping the engine's route when moving the
          horizontal run cannot make the final vertical drop the longest segment.
        justification: |
          The label placer centers a label on the longest segment of its connector and draws it on
          an opaque background. On a decision's branch the engine makes the sideways run the
          longest, so a wide guard would hide the run and the connector's start at the diamond and
          the branch would look detached from it.
        tests:
          - ActionFlowView_BuildLayout_DecisionBranchLabels_SitOnVerticalDrop_AndKeepRunsVisible
          - ActionFlowView_BuildLayout_WideBranchBoxes_LabeledJogIsLeftUnchanged
          - ActionFlowView_BuildLayout_DecisionWithManyBranches_KeepsDistinctJogLanes

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-LabelLeftExtent
        title: >-
          ActionFlowViewLayoutStrategy shall keep every succession label inside the canvas,
          shifting the content right when a label on a left-side run overhangs the left edge.
        justification: |
          A label is drawn centered on its connector's run, so a long guard on a branch that runs
          left of every action box extends past the leftmost box. Sizing only the right edge would
          leave that label clipped by the canvas edge.
        tests:
          - ActionFlowView_BuildLayout_LongLeftBranchGuard_LabelIsInsideCanvas

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-TerminateNode
        title: >-
          ActionFlowViewLayoutStrategy shall render a terminate node as a crossed circle that
          only receives successions, and shall not infer a done marker from a flow that ends in
          a terminate node.
        justification: |
          A terminate node ends the whole behavior, so it is drawn as the notation's crossed
          circle and is not an ordinary end that the done marker follows.
        tests:
          - ActionFlowView_BuildLayout_TerminateNode_RendersCrossedCircle_NoOutgoing
          - ActionFlowView_BuildLayout_TerminateNode_NotTreatedAsDoneSource
          - ActionFlowView_BuildLayout_OnlyTerminateEnds_DrawsNoDoneMarker

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-SendAcceptIcons
        title: >-
          ActionFlowViewLayoutStrategy shall render accept and send action nodes as rounded
          boxes carrying the accept or send corner icon and listing their payload text in the
          box body.
        justification: |
          The SysML v2 graphical notation marks an accept or send action with a pentagon icon in
          the corner of its box and shows what it receives or sends. The icon replaces the
          keyword line, and the box is sized so the icon never touches the name.
        tests:
          - ActionFlowView_BuildLayout_AcceptAndSend_RenderBoxesWithCornerIcons
          - ActionFlowView_BuildLayout_AcceptPayload_RendersTextRow

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ExplicitStartDone
        title: >-
          ActionFlowViewLayoutStrategy shall draw the start marker at the actions named by an
          explicit "first start" succession and the done marker at the actions that declare an
          explicit "then done" succession, without drawing start or done boxes, and shall infer
          each marker from the flow topology only when the model declares none.
        justification: |
          A model that declares where its flow starts and ends should be drawn that way. The
          topology heuristic remains for models that declare neither, so existing diagrams are
          unchanged.
        tests:
          - ActionFlowView_BuildLayout_ExplicitStart_NoStartBox_MarkerEntersTarget
          - ActionFlowView_BuildLayout_ExplicitDone_ConnectsOnlyDeclaredSources
          - ActionFlowView_BuildLayout_NoExplicitMarkers_HeuristicUnchanged

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-NodeLabel
        title: >-
          ActionFlowViewLayoutStrategy shall label a typed action name : Type, followed by its
          multiplicity when it has one.
        justification: |
          The SysML v2 graphical notation shows an action's typing and multiplicity in its name
          line, as it does for every other usage.
        tests:
          - ActionFlowView_BuildLayout_TypedAction_LabelShowsTypeAndMultiplicity
          - ActionFlowView_BuildLayout_PipelineGalleryModel_ShowsActionFlowNotation

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-BackEdgeApproach
        title: >-
          ActionFlowViewLayoutStrategy shall give every succession, including one that returns
          to an earlier action, a final straight approach at least as long as its open chevron
          end marker.
        justification: |
          An arrowhead entered through a rounded corner or a short stub is distorted. The
          strategy declares the end marker on the layout graph so the engine sizes the approach.
        tests:
          - ActionFlowView_BuildLayout_BackEdge_OpenChevronWithFlushApproach

      - id: SysML2Tools-Core-Layout-Internal-ActionFlowViewLayoutStrategy-ExcludedMembers
        title: >-
          ActionFlowViewLayoutStrategy shall ignore members flagged IsExcludedFromDiagrams: they are
          neither actions or successions of the drawn flow nor a reason to choose their owner as
          the root.
        justification: |
          The bodies of calculation, constraint and case definitions and usages are built for name
          resolution only; counting them would change which definition is drawn.
        tests:
          - ActionFlowView_BuildLayout_ExcludedBodies_RenderIdenticallyToWorkspaceWithout

---
# LayoutWarnings Unit Requirements
#
# PURPOSE:
# - Define requirements for the LayoutWarnings unit
# - LayoutWarnings builds the non-fatal layout-quality warning messages for a view
# - Requirements describe the observable warning output, not how it is formatted

sections:
  - title: LayoutWarnings Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-LayoutWarnings-NoCrossings
        title: >-
          When no connector had to cross a box, LayoutWarnings shall produce no warning.
        justification: |
          A clean diagram must not be flagged. Emitting no warning when there are no crossings
          keeps the user's attention on real layout-quality problems.
        tests:
          - ForCrossings_Zero_ReturnsEmpty

      - id: SysML2Tools-Core-Layout-Internal-LayoutWarnings-CrossingWarning
        title: >-
          When one or more connectors had to cross a box, LayoutWarnings shall produce a warning
          that names the view and reports the number of crossing connectors, with grammatical
          agreement for singular and plural counts.
        justification: |
          Crossing connectors make a diagram harder to read, so the condition must be surfaced.
          Naming the view and giving an accurate, grammatically correct count lets the user judge
          the severity and find the affected diagram.
        tests:
          - ForCrossings_One_ReturnsSingularWarning
          - ForCrossings_Many_ReturnsPluralWarning

      - id: SysML2Tools-Core-Layout-Internal-LayoutWarnings-UnevaluatedFilter
        title: >-
          When a view's filter expression text is non-null, LayoutWarnings shall produce a
          warning naming the view and stating that the filter expression could not be evaluated,
          optionally appending the caller-supplied reason; when null, LayoutWarnings shall produce
          no warning.
        justification: |
          A standalone `filter [<expr>];` expression now attempts real evaluation, so the warning
          path is reserved for parse failures and unsupported Phase 1 constructs. Surfacing the
          reason string helps the user understand whether the fallback came from malformed syntax
          or an intentionally unsupported construct.
        tests:
          - ForUnevaluatedFilter_NullText_ReturnsEmpty
          - ForUnevaluatedFilter_NonNullText_ReturnsNotYetEvaluatedWarning
          - ForUnevaluatedFilter_WithReason_IncludesReason

      - id: SysML2Tools-Core-Layout-Internal-LayoutWarnings-UnevaluatedExposeBracketFilter
        title: >-
          When a view declares one or more bracketed `expose <path>::**[<expr>]` filters that
          failed to parse or evaluate (Phase 2a), LayoutWarnings shall produce one warning per
          failed expression naming the view, the failed expression text, and (when supplied) a
          short reason, stating that the exposed path falls back to its whole containment
          subtree; when every bracket filter in the view (if any) parsed and evaluated
          successfully, LayoutWarnings shall produce no warning.
        justification: |
          Phase 2a makes bracket-filter evaluation real: a successfully-evaluated bracket filter
          has actual narrowing effect on the rendered scope and no longer needs a "not yet
          evaluated" disclaimer (unlike Phase 1's always-warn behavior). Reserving the warning for
          genuine parse/evaluation failures mirrors `ForUnevaluatedFilter`'s existing
          failure-only pattern, so a bracket filter degrades gracefully (whole-subtree fallback)
          with a visible, actionable reason rather than silently losing its narrowing effect.
        tests:
          - ForUnevaluatedExposeBracketFilter_Empty_ReturnsEmpty
          - ForUnevaluatedExposeBracketFilter_SingleFailure_ReturnsWarningWithReason
          - ForUnevaluatedExposeBracketFilter_MultipleFailures_ReturnsOneWarningPerFailure

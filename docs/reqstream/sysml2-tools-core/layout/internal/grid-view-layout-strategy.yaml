---
# GridViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the GridViewLayoutStrategy unit
# - GridViewLayoutStrategy lays out a Grid View as a specialization relationship matrix
# - Requirements describe the observable matrix, not the arithmetic used

sections:
  - title: GridViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-SpecializationMatrix
        title: >-
          GridViewLayoutStrategy shall present the user-defined definitions as a matrix with a
          header row and header column of definition names and a mark in each cell where the row
          definition specializes the column definition.
        justification: |
          A relationship matrix lets a reader see at a glance which definitions specialize which
          others. Header labels on both axes and a mark at each related intersection are the
          conventional way to render such a matrix.
        tests:
          - GridView_BuildLayout_Specialization_ProducesMarkedMatrix

      - id: SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-EmptyInput
        title: >-
          When the workspace contains no user-defined definitions, GridViewLayoutStrategy shall
          produce an empty diagram.
        justification: |
          With no definitions to relate, an empty diagram avoids presenting an empty matrix frame
          that could be mistaken for missing data.
        tests:
          - BrowserAndGrid_BuildLayout_EmptyWorkspace_ReturnMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-ExposeScoping
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          GridViewLayoutStrategy shall scope the matrix to the union of each edge's target
          containment subtree (resolved through the target's own type reference when the target is
          a usage rather than a definition), while keeping any definition that participates in a
          specialization relationship with an in-scope definition even when that definition is
          itself outside every exposed containment subtree.
        justification: |
          The Grid View has no single-root heuristic to restrict, so it applies the shared
          `expose` scope directly as a workspace-wide definition filter, giving it the same
          observable scoping behavior as every other view kind. Because the matrix exists to show
          specialization relationships, a definition is relevant to the exposed scope along either
          of two dimensions — direct containment, or participating in a specialization
          relationship with an in-scope definition — so at least one dimension being in scope is
          sufficient to keep a definition visible; otherwise exposing only one side of a
          specialization would silently render a relationship mark against a missing row or
          column.
        tests:
          - GridView_BuildLayout_ExposedName_UnionsAdditionalSubtree
          - GridView_BuildLayout_ExposeMultipleTargets_UnionsBothSubtrees
          - GridView_BuildLayout_ExposedUsage_ResolvesThroughTypingToDefinitionSubtree
          - GridView_BuildLayout_ExposeOneSideOfSpecialization_KeepsBothRowAndColumn

      - id: SysML2Tools-Core-Layout-Internal-GridViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — GridViewLayoutStrategy shall render every non-stdlib definition, unchanged from its
          pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; rendering the full workspace must remain the
          default in both cases.
        tests:
          - GridView_BuildLayout_NullViewNode_RendersFullWorkspaceUnchanged

---
# ExposeScopeResolver Unit Requirements
#
# PURPOSE:
# - Define requirements for the ExposeScopeResolver unit
# - ExposeScopeResolver resolves the expose-statement containment-subtree scope shared by every
#   layout strategy
# - Requirements describe observable scope-resolution behavior, not internal implementation detail

sections:
  - title: ExposeScopeResolver Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-ResolveExposedTargets
        title: >-
          ExposeScopeResolver.ResolveExposedScope shall return the qualified names of every
          resolved Expose-kind edge on a view as the resolved scope.
        justification: |
          `expose <name>;` is the only real content-scoping mechanism a view has in SysML v2.
          Collecting every resolved Expose edge's target qualified name is the first step every
          layout strategy needs to restrict its diagram to the exposed subject(s).
        tests:
          - ResolveExposedScope_ExposedDefinition_ReturnsThatQualifiedName

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-UsageToTypeFallback
        title: >-
          When a resolved Expose edge's target resolves to a feature usage rather than a
          definition, ExposeScopeResolver.ResolveExposedScope shall additionally include that
          usage's own resolved Typing-edge target qualified name in the returned scope.
        justification: |
          A usage's own containment subtree is typically empty — the real content lives under its
          type's subtree. Without this fallback, exposing a usage would silently scope the diagram
          to nothing; following the usage's own type reference fixes this containment gap. This
          fallback applies per-target, so a view with multiple `expose` edges gets the union of
          every target's own resolved scope, whether that target is a definition or a usage.
        tests:
          - ResolveExposedScope_ExposedUsage_AlsoIncludesResolvedTypeTarget
          - ResolveExposedScope_TwoExposeEdges_DefinitionAndUsageTarget_UnionsBothPlusResolvedType

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NoScopeFallback
        title: >-
          When a view has no resolved Expose-kind edge — including a null ViewNode, a view with
          no expose statement, or a view whose every expose entry failed to resolve —
          ExposeScopeResolver.ResolveExposedScope shall return null, meaning no scoping applies.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all. A null return lets every caller uniformly treat
          "no scope" as "render everything", the pre-scoping default.
        tests:
          - ResolveExposedScope_NullViewNode_ReturnsNull
          - ResolveExposedScope_NoResolvedExposeEdges_ReturnsNull

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-SubjectScopeMembership
        title: >-
          ExposeScopeResolver.IsInSubjectScope shall return true for a qualified name that
          matches a subject per that subject's own ExposeRecursionKind — an exact match for
          MembershipExact, a direct (one-level) child match for NamespaceDirectChildren, or an
          exact match or containment-subtree match (a "{subject}::" prefix match) for
          MembershipRecursive/NamespaceRecursive — and false otherwise.
        justification: |
          Every strategy needs a single, consistent rule for "is this element within the exposed
          scope" that honors each `expose` entry's own SysML v2 grammar form and recursion
          setting (`expose X;`/`expose X::**;`/`expose X::*;`/`expose X::*::**;`), rather than
          unconditionally treating an exposed target's entire containment subtree as included
          regardless of whether the entry actually requested recursion.
        tests:
          - IsInSubjectScope_ExactMatch_ReturnsTrue
          - IsInSubjectScope_SubtreeMatch_ReturnsTrue
          - IsInSubjectScope_PrefixWithoutSeparator_ReturnsFalse
          - IsInSubjectScope_UnrelatedName_ReturnsFalse

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-MembershipExactNarrowScope
        title: >-
          ExposeScopeResolver.ResolveExposedScope shall resolve a non-recursive MembershipExpose
          entry (expose X;) to a scope containing only X itself (and, for a usage target, its
          resolved type, itself only) — not X's containment subtree.
        justification: |
          Per formal-26-03-02.md §8.3.26.2-4, a bare `expose X;` (MembershipExpose with no
          trailing `::**`) is non-recursive: only X is exposed, not its nested members. Treating a
          bare `expose X;` as whole-subtree inclusion (the pre-fix behavior) silently over-scoped
          every non-recursive membership expose to its entire subtree, which is a correctness bug,
          not a rendering nicety.
        tests:
          - ResolveExposedScope_MembershipExact_ScopeIsExactOnly
          - ResolveExposedScope_MembershipExactUsage_TypeFallbackIsAlsoExactOnly

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NamespaceDirectChildrenNarrowScope
        title: >-
          ExposeScopeResolver.ResolveExposedScope shall resolve a non-recursive NamespaceExpose
          entry (expose X::*;) to a scope containing only X's direct (one-level) children — not X
          itself and not deeper descendants.
        justification: |
          Per formal-26-03-02.md §8.3.26.2-4, a non-recursive `expose X::*;` (NamespaceExpose with
          no trailing `::**`) exposes only X's direct members, not X itself and not their own
          nested members. Treating this form as whole-subtree inclusion (the pre-fix behavior) was
          incorrect on two counts: it wrongly included X itself, and it wrongly included
          grandchildren and deeper descendants.
        tests:
          - ResolveExposedScope_NamespaceDirectChildren_ScopeIsDirectChildrenOnly

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-RecursiveWholeSubtreeUnchanged
        title: >-
          ExposeScopeResolver.ResolveExposedScope shall continue to resolve a recursive
          MembershipExpose entry (expose X::**;) to a scope containing X and its entire
          containment subtree, and a bracket-filtered entry that fails to parse or evaluate shall
          continue to fall back to this same whole-subtree behavior regardless of the entry's own
          recursion kind.
        justification: |
          Recursive `expose` forms (`::**`) are the one case where the pre-fix whole-subtree
          behavior was already correct; this requirement is a regression guard confirming the fix
          for the non-recursive forms above did not also narrow the recursive forms or the
          bracket-filter-failure fallback, which must still degrade to the full subtree rather
          than the narrower Exact/DirectChildren behavior (never silently losing content on a
          bracket-filter failure).
        tests:
          - ResolveExposedScope_MembershipRecursive_ScopeIsWholeSubtree
          - ResolveExposedScope_BracketFilterFailure_AlwaysFallsBackToRecursive

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-NamespaceRecursiveExcludesSubject
        title: >-
          ExposeScopeResolver.ResolveExposedScope shall resolve a recursive NamespaceExpose entry
          (expose X::*::**;) to a scope containing X's entire containment subtree excluding X
          itself, mirroring the non-recursive NamespaceExpose (expose X::*;) exclusion of X but
          extending it to descendants at every depth rather than direct children only.
        justification: |
          Per the OMG SysML v2 specification, a NamespaceExpose never includes the namespace
          being exposed, regardless of whether the recursive (`::**`) or direct-children-only
          (`::*`) form is used — only MembershipExpose (`expose X;`/`expose X::**;`) includes the
          subject itself. A prior implementation incorrectly treated NamespaceRecursive
          identically to MembershipRecursive (including the subject); this requirement guards
          against that regression recurring.
        tests:
          - ResolveExposedScope_NamespaceRecursive_ScopeIsDescendantsOnlyExcludingSubject
          - ResolveExposedScope_NamespaceRecursiveOnDefinition_ExcludesDefinitionItselfIncludesDescendants

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-RootRelevance
        title: >-
          ExposeScopeResolver.IsRootRelevantToScope shall return true for a candidate root
          qualified name that equals a scope subject, lies within a subject's containment
          subtree, or contains a subject within its own containment subtree, and false otherwise.
        justification: |
          The four single-root layout strategies (Interconnection, State Transition, Action
          Flow, Sequence View) each pick one root definition by an internal heuristic before
          collecting its children. Restricting that heuristic to a root relevant to the resolved
          `expose` scope — in either containment direction — lets exposing an inner element of a
          root, or the root itself, correctly select that root, while an unrelated `expose` target
          correctly yields no root.
        tests:
          - IsRootRelevantToScope_CandidateEqualsSubject_ReturnsTrue
          - IsRootRelevantToScope_CandidateNestedInSubject_ReturnsTrue
          - IsRootRelevantToScope_SubjectNestedInCandidate_ReturnsTrue
          - IsRootRelevantToScope_UnrelatedCandidate_ReturnsFalse

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-SpecificityTieBreak
        title: >-
          ExposeScopeResolver.IsMoreSpecificCandidate shall prefer the more deeply nested
          candidate over a less deeply nested one regardless of score, and shall fall back to the
          caller-supplied score comparison only when two candidates are equally deeply nested.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and one of its nested
          descendant definitions can both pass IsRootRelevantToScope for the same resolved
          `expose` scope. Preferring the more deeply nested candidate lets the four single-root
          strategies correctly select the more specific (deeper) scope-relevant candidate the
          user's `expose` statement was meant to reach, instead of silently falling back to an
          ancestor with a higher raw heuristic score, while unrelated same-depth siblings (with no
          containment relationship) still fall back to the caller's own score comparison.
        tests:
          - IsMoreSpecificCandidate_NoCurrentBest_ReturnsTrue
          - IsMoreSpecificCandidate_LongerQualifiedName_ReturnsTrueRegardlessOfScore
          - IsMoreSpecificCandidate_ShorterQualifiedName_ReturnsFalseRegardlessOfScore
          - IsMoreSpecificCandidate_EqualLength_FallsBackToScore_True
          - IsMoreSpecificCandidate_EqualLength_FallsBackToScore_False
          - IsMoreSpecificCandidate_SameDepthSiblingsDifferentLength_ShorterWithBetterScoreWins
          - IsMoreSpecificCandidate_SameDepthSiblingsDifferentLength_ShorterWithWorseScoreLoses

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-BracketFilterUsageLevelCandidates
        title: >-
          When a bracket-filter expression's candidate set is computed (Phase 2a), it shall
          include named usage-level declarations (feature usages), not only definitions, so a
          metaclass-kind classification filter (e.g. `[@SysML::PartUsage]`) can match a usage-level
          candidate within an exposed path's containment subtree.
        justification: |
          `ResolveExposedScope`'s bracket-filter candidate set mirrors
          `GeneralViewLayoutStrategy.CollectDefinitions`'s own candidate set (Phase 2d), which was
          widened to admit usages for the same reason: a metaclass-kind filter is inherently about
          usages, not just definitions, and a definitions-only candidate set could never match one.
        tests:
          - ResolveExposedScope_BracketFilterMetaclassKind_MatchesUsageLevelCandidate

      - id: SysML2Tools-Core-Layout-Internal-ExposeScopeResolver-UnlimitedSubjectMatch
        title: >-
          ExposeScopeResolver.MatchesUnlimitedSubject shall return true for a qualified name that
          matches a scope subject (by IsInSubjectScope's own equals-or-subtree-prefix or
          direct-child rule per that subject's recursion kind) whose own ExposeRecursionKind is
          MembershipRecursive or NamespaceRecursive, and false for a match against any other
          recursion kind, a match found only via ExplicitMembers, or an unrelated qualified name.
        justification: |
          InterconnectionViewLayoutStrategy's per-branch depth-limited recursion (see that unit's
          ExposeScopingPerBranchRecursionIndependence requirement) needs to know, for a specific
          matched feature, not just whether it is in scope at all (IsInSubjectScope's combined
          answer across every subject) but specifically whether the subject that matched it is
          itself recursive — information IsInSubjectScope does not expose, since it deliberately
          answers only a single combined in/out-of-scope boolean. Without this narrower predicate,
          a per-branch recursion decision could only be approximated by re-deriving from
          IsInSubjectScope, which cannot distinguish "matched a recursive subject" from "matched a
          non-recursive subject", the exact distinction per-branch recursion depends on.
        tests:
          - MatchesUnlimitedSubject_MembershipRecursiveSelf_ReturnsTrue
          - MatchesUnlimitedSubject_MembershipRecursiveSubtree_ReturnsTrue
          - MatchesUnlimitedSubject_NamespaceRecursiveSubtree_ReturnsTrue
          - MatchesUnlimitedSubject_MembershipExact_ReturnsFalse
          - MatchesUnlimitedSubject_NamespaceDirectChildren_ReturnsFalse
          - MatchesUnlimitedSubject_ExplicitMembersOnly_ReturnsFalse
          - MatchesUnlimitedSubject_UnrelatedName_ReturnsFalse

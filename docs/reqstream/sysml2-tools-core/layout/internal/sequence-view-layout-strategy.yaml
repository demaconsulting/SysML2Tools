---
# SequenceViewLayoutStrategy Unit Requirements
#
# PURPOSE:
# - Define requirements for the SequenceViewLayoutStrategy unit
# - SequenceViewLayoutStrategy lays out a Sequence View as lifelines and messages
# - Requirements describe observable layout properties, not the arithmetic used

sections:
  - title: SequenceViewLayoutStrategy Unit Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-Lifelines
        title: >-
          SequenceViewLayoutStrategy shall render each participant referenced by the messages as a
          lifeline and each message as a line between lifelines, ordered top-to-bottom by
          declaration order.
        justification: |
          A sequence diagram communicates an interaction by showing who participates and in what
          order they exchange messages. Presenting one lifeline per participant and ordering the
          messages from top to bottom matches sequence-diagram reading conventions.
        tests:
          - SequenceView_BuildLayout_Messages_ProducesLifelinesAndOrderedLines

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-HorizontalMessages
        title: >-
          SequenceViewLayoutStrategy shall draw a message between two lifelines as a horizontal line
          from the sender to the receiver with a directional end marker at the receiver.
        justification: |
          A horizontal connector with an end marker pointing at the receiver shows the direction of
          a message at a glance, which is the established notation for sequence messages.
        tests:
          - SequenceView_BuildLayout_Message_IsHorizontalBetweenLifelines

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-EmptyInput
        title: >-
          When the workspace contains no messages, SequenceViewLayoutStrategy shall produce an empty
          diagram.
        justification: |
          With nothing to depict, the strategy must not invent content; an empty diagram avoids
          rendering a misleading frame with no participants or messages.
        tests:
          - SequenceView_BuildLayout_NoMessages_ReturnsMinimalCanvas

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-MessageArrowhead
        title: >-
          SequenceViewLayoutStrategy shall draw each message arrow with an open end marker at the
          receiver end.
        justification: |
          SysML v2 sequence message notation uses an open end marker at the receiver. Applying this
          property makes rendered message arrows conform to the standard notation.
        tests:
          - SequenceView_BuildLayout_MessageArrow_HasOpenArrowhead

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-LifelineQualifiedNameReconstruction
        title: >-
          SequenceViewLayoutStrategy shall filter lifelines by their own effective qualified name
          so that `expose`-scoped lifeline filtering matches the declared feature's actual
          qualified name.
        justification: |
          Filtering lifelines by expose scope requires each lifeline's own qualified name, which
          is never stored directly on the lightweight lifeline record; using the lifeline's own
          effective qualified name (rather than, for example, its bare local name) was confirmed
          reliable for realistic models — mirroring the real client-server-sequence.sysml fixture
          — before being relied upon for scope filtering, avoiding a silently incorrect filter.
        tests:
          - SequenceView_LifelineQualifiedNameReconstruction_MatchesDeclaredFeature

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-ExposeScopingRootSelection
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          SequenceViewLayoutStrategy shall restrict its heuristic root selection to a candidate
          relevant to the resolved scope.
        justification: |
          The Sequence View renders exactly one selected root's lifelines, so `expose` scoping
          cannot narrow a workspace-wide collection directly; instead it restricts which root is
          selected — accepting the current heuristic root itself, an inner lifeline of it, a
          definition containing the heuristic default, or the resolved type of an exposed usage —
          and selecting no root at all when nothing in the workspace is relevant to the scope.
        tests:
          - SequenceView_BuildLayout_ExposeNonHeuristicRoot_SelectsExposedRoot
          - SequenceView_BuildLayout_ExposeInnerChildOfNonHeuristicRoot_SelectsItsRoot
          - SequenceView_BuildLayout_ExposeUnrelatedDefinition_NoRootSelected_ReturnsMinimalCanvas
          - SequenceView_BuildLayout_ExposedUsage_ResolvesThroughTypingToRoot

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-ExposeScopingLifelineFiltering
        title: >-
          When a view's ViewContext carries one or more resolved Expose edges,
          SequenceViewLayoutStrategy shall narrow the selected root's lifelines to those within the
          resolved scope.
        justification: |
          Once a root is selected, `expose` scoping must also narrow what is drawn inside it —
          otherwise every lifeline of the selected root would still be rendered regardless of which
          lifelines the view actually exposed, defeating the purpose of scoping the interaction's
          content.
        tests:
          - SequenceView_BuildLayout_ExposeSingleLifeline_NarrowsLifelines
          - SequenceView_BuildLayout_ExposeBothLifelines_UnionsSubtreesKeepsMessages

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-ExposeScopingMessageDropping
        title: >-
          SequenceViewLayoutStrategy shall drop any message whose endpoint was excluded by
          lifeline filtering, while keeping a message whose endpoints are both still in scope.
        justification: |
          A message line referencing a lifeline that scoping has removed would point at nothing;
          dropping such dangling messages keeps the diagram consistent, while a message between two
          lifelines that both remain in scope must still be drawn.
        tests:
          - SequenceView_BuildLayout_ExposeSingleLifeline_NarrowsLifelines
          - SequenceView_BuildLayout_ExposeBothLifelines_UnionsSubtreesKeepsMessages

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-NoExposeFallback
        title: >-
          When a view's ViewContext carries no resolved Expose edge — including a null ViewNode
          — SequenceViewLayoutStrategy shall select its root by the pre-scoping heuristic and
          render every lifeline, unchanged from its pre-scoping behavior.
        justification: |
          Nearly every real-world view declares no `expose` statement, and the synthetic `--auto`
          view never carries a ViewNode at all; the pre-scoping heuristic root selection and full
          lifeline rendering must remain the default in both cases.
        tests:
          - SequenceView_BuildLayout_NullViewNode_PicksHeuristicRootUnchanged

      - id: SysML2Tools-Core-Layout-Internal-SequenceViewLayoutStrategy-ScopedSpecificityTieBreak
        title: >-
          When more than one candidate root is relevant to the resolved expose scope,
          SequenceViewLayoutStrategy shall select the most specific (deepest-qualified-name)
          relevant candidate, using its message-count heuristic only to break ties among equally
          specific candidates.
        justification: |
          Because SysML v2 definitions may nest, an ancestor definition and a nested descendant
          definition can both be relevant to the same resolved `expose` scope. Without a
          specificity-first tie-break, the ancestor could win by raw message-count score even
          though the user's `expose` statement was scoped to the nested descendant, silently
          defeating the intended scoping.
        tests:
          - SequenceView_BuildLayout_ExposeInnerLifelineOfNestedDefinition_SelectsNestedDefinitionNotAncestor

---
# Filtering Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the SysML2Tools Filtering subsystem
# - The Filtering subsystem parses and evaluates the Phase 1 subset of standalone view
#   `filter [<expr>];` expressions over semantic-model candidate elements, and (Phase 2a) the same
#   subset for bracket-form `expose <path>::**[<expr>];` expressions
# - Requirements describe observable filtering behavior, not parser internals

sections:
  - title: Filtering Subsystem Requirements
    requirements:
      - id: SysML2Tools-Core-Filtering-StandaloneViewFilterEvaluation
        title: >-
          The Filtering subsystem shall parse and evaluate a standalone view `filter [<expr>];`
          expression over a caller-supplied candidate set, matching candidates by metadata
          classification tests, boolean composition, and metadata-attribute reads for the Phase 1
          construct subset while surfacing explicit diagnostics for malformed or unsupported
          expressions without throwing.
        justification: |
          Standalone view filters are the user-visible mechanism for narrowing a rendered scope by
          metadata. The subsystem exists to turn the raw expression text captured by AstBuilder
          into a matched subset of candidate elements while degrading safely when the expression is
          outside the supported Phase 1 boundary.
        children:
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-ClassificationTests
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-BooleanConnectives
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-AttributeReads
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-UnsupportedConstructDiagnostics
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-RoundTripPrettyPrinting
        tests:
          - DiagramRenderer_RenderWorkspace_SafetyPartsView_FiltersToAnnotatedParts
          - DiagramRenderer_RenderWorkspace_MandatorySafetyPartsView_FiltersToMandatoryPart
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionMatchesNothing_RendersEmpty
          - GeneralViewLayoutStrategy_BuildLayout_FilterExpressionPresent_EmitsNotYetEvaluatedWarning

      - id: SysML2Tools-Core-Filtering-BracketFormExposeEvaluation
        title: >-
          The Filtering subsystem shall additionally support evaluating a bracket-form
          `expose <path>::**[<expr>];` filter expression against that path's own containment
          subtree of definitions, narrowing only that `expose` entry's contribution to a view's
          resolved scope, by reusing the same Phase 1 parser and evaluator unchanged.
        justification: |
          The bracket form is the dominant `expose` shape in the real OMG corpus (10/10 sampled
          instances use only Phase 1 constructs). `FilterExpressionParser`/`FilterExpressionEvaluator`
          are candidate-set-agnostic, so bracket-form evaluation is realized entirely by computing a
          per-entry candidate set (the exposed path's own definition subtree) in
          `ExposeScopeResolver`, rather than by any change to the Filtering subsystem's own parser or
          evaluator.
        children:
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-ClassificationTests
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-BooleanConnectives
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-AttributeReads
          - SysML2Tools-Core-Filtering-FilterExpressionEvaluator-UnsupportedConstructDiagnostics
        tests:
          - ResolveExposedScope_BracketFilterEvaluatesSuccessfully_NarrowsToMatchedDefinitionsOnly
          - ResolveExposedScope_MixedFilteredAndUnfilteredEntries_NarrowsIndependently
          - ResolveExposedScope_BracketFilterFailsToParse_FallsBackToWholeSubtreeAndRecordsFailure

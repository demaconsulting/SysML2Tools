---
# Layout Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the SysML2Tools Layout subsystem
# - The layout-tree intermediate representation (LayoutTree, LayoutBox, LayoutLine, ...) and
#   the geometric layered layout algorithm are provided off-the-shelf by the
#   DemaConsulting.Rendering and DemaConsulting.Rendering.Layout packages
# - This subsystem maps the SysML semantic model onto that IR, one diagram view at a time, and
#   delegates geometric node placement and connector routing to the off-the-shelf layered algorithm
# - Requirements describe observable layout structure, not the placement algorithms

sections:
  - title: Layout Subsystem Requirements
    requirements:
      - id: SysML2Tools-Core-Layout-LayoutTree
        title: >-
          The Layout subsystem shall map each diagram view of the semantic workspace onto a
          layout tree of absolutely positioned nodes and pre-routed connectors, reusing the
          layout-tree intermediate representation provided by the DemaConsulting.Rendering package.
        justification: |
          The renderers consume only the layout tree. Reusing the off-the-shelf layout-tree
          intermediate representation keeps SysML2Tools focused on mapping the SysML model to
          boxes, ports, lines, and markers rather than defining geometric primitives. A populated
          layout tree is the observable result that proves the mapping occurred.
        tests:
          - GeneralViewLayoutStrategy_BuildLayout_OneUserPartDef_ProducesLayoutBox
          - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines
          - SequenceView_BuildLayout_Messages_ProducesLifelinesAndOrderedLines

      - id: SysML2Tools-Core-Layout-DelegatedGeometry
        title: >-
          The Layout subsystem shall delegate geometric node placement and connector routing to
          the off-the-shelf DemaConsulting.Rendering.Layout layered algorithm, positioning the
          boxes of a diagram so that they do not overlap one another.
        justification: |
          Reusing the off-the-shelf layered algorithm avoids maintaining a bespoke geometric
          layout engine while still guaranteeing readable, non-overlapping geometry. Non-overlap
          is an observable property of the produced layout tree that every view must guarantee.
        tests:
          - InterconnectionView_BuildLayout_PartBoxes_DoNotOverlap
          - ActionFlowView_BuildLayout_NoOverlap

      - id: SysML2Tools-Core-Layout-PreRoutedLines
        title: >-
          All connector routing shall be resolved before the layout tree is passed to a renderer,
          so that LayoutLine waypoints contain the complete ordered sequence of absolute points
          that the renderer draws as straight segments.
        justification: |
          Delegating routing to the view layout strategies (through the layered algorithm) keeps
          renderers stateless and free of path-finding logic. A renderer only needs to draw
          segments between consecutive absolute waypoints.
        tests:
          - ActionFlowView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
          - StateTransitionView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally

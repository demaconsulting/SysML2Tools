---
# StdlibProvider Unit Requirements
#
# PURPOSE:
# - Define unit-level requirements for the StdlibProvider class, the single unit of the
#   DemaConsulting.SysML2Tools.Stdlib system
# - These requirements decompose the Stdlib system requirement into the specific,
#   observable behaviour of the StdlibProvider unit
# - Each requirement is verified by StdlibProvider unit tests

sections:
  - title: StdlibProvider Unit Requirements
    requirements:
      - id: SysML2Tools-Stdlib-StdlibProvider-GetSymbolTable
        title: >-
          StdlibProvider.GetSymbolTable shall return a non-empty SymbolTable containing the
          pre-compiled SysML v2 standard library declarations.
        justification: |
          Callers seed a workspace from this symbol table; it must contain the standard library
          base types user models reference.
        tests:
          - GetSymbolTable_ReturnsNonEmpty
          - GetSymbolTable_ContainsKnownStdlibTypes

      - id: SysML2Tools-Stdlib-StdlibProvider-Caching
        title: >-
          StdlibProvider.GetSymbolTable shall return the same SymbolTable instance on every call
          within the same application domain.
        justification: |
          Caching the deserialized standard library lets multiple callers share one instance rather
          than deserializing the embedded binary on each call.
        tests:
          - GetSymbolTable_IsCached
          - GetSymbolTable_RepeatedCalls_ReturnSameDiagnostics

      - id: SysML2Tools-Stdlib-StdlibProvider-Diagnostics
        title: >-
          StdlibProvider.GetSymbolTable shall return a non-null diagnostics list alongside the
          SymbolTable, reporting any issues from the pre-compilation step.
        justification: |
          Exposing pre-compilation diagnostics lets callers detect and report standard library
          parse warnings rather than hiding them from end users. The standard library's own
          unresolved references stay Warnings, so the pre-compiled library carries no errors.
        tests:
          - GetSymbolTable_DiagnosticsNotNull
          - GetSymbolTable_Diagnostics_UnresolvedReferences_RemainWarnings

      - id: SysML2Tools-Stdlib-StdlibProvider-ModifierData
        title: >-
          StdlibProvider.GetSymbolTable shall return standard library declarations that carry the
          modifier data of the standard library source (for example `Parts::Part`, declared
          `abstract part def Part`, is flagged abstract) and no error diagnostics.
        justification: |
          The pre-compiled binary is regenerated from the standard library source; verifying a
          known modifier proves the regeneration happened and that the additive members reach
          consumers of the standard library symbol table.
        tests:
          - GetSymbolTable_RegeneratedStdlib_CarriesModifiers
          - GetSymbolTable_Diagnostics_ContainNoErrors

      - id: SysML2Tools-Stdlib-StdlibProvider-KermlDeclarations
        title: >-
          StdlibProvider.GetSymbolTable shall return the named declarations of the KerML library
          files (abstract classifiers and metaclasses, package-level features, structs, and
          associations such as `Base::Anything`, `Metaobjects::SemanticMetadata`,
          `TrigFunctions::pi`, `Objects::Point`, and `Occurrences::HappensBefore`), so that SysML
          models can reference them.
        justification: |
          User models import and specialize these library elements; before they were indexed,
          every such reference was reported as unresolved. The shipped resource is regenerated
          from the library source, so this requirement also proves the regeneration happened.
        tests:
          - GetSymbolTable_KermlLibraryDeclarations_AreIndexed

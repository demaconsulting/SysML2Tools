---
# DemaConsulting.Rendering OTS Software Requirements
#
# Requirements for the DemaConsulting.Rendering package family (DemaConsulting.Rendering,
# DemaConsulting.Rendering.Abstractions, DemaConsulting.Rendering.Layout,
# DemaConsulting.Rendering.Svg, DemaConsulting.Rendering.CanvasNet) that SysML2Tools consumes for
# SysML-agnostic layout and rendering. Each requirement is verified indirectly through SysML2Tools
# tests that drive the package family end-to-end.

sections:
  - title: OTS Software Requirements
    sections:
      - title: DemaConsulting.Rendering Requirements
        requirements:
          - id: SysML2Tools-OTS-DemaRendering-LayoutGraph
            title: >-
              DemaConsulting.Rendering shall lay a graph of sized nodes and directed edges out
              into placed boxes and routed connectors.
            justification: |
              SysML2Tools no longer owns a geometric layout engine. The view layout strategies
              build a LayoutGraph of sized nodes and directed edges and rely on the package's
              LayeredLayoutAlgorithm to return a LayoutTree of placed LayoutBox nodes and routed
              LayoutLine connectors. Strategy layouts that emit placed boxes together with routed
              connector lines confirm the package performed the placement and routing.
            tags: [ots]
            tests:
              - ActionFlowView_BuildLayout_ActionsAndSuccessions_ProducesBoxesMarkersAndFlows
              - StateTransitionView_BuildLayout_StatesAndTransitions_ProducesBoxesBadgeAndLines
              - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

          - id: SysML2Tools-OTS-DemaRendering-Direction
            title: >-
              DemaConsulting.Rendering shall honor the requested layout direction, placing the
              target of a directed edge downstream of its source, including a top-to-bottom
              direction.
            justification: |
              The action-flow and state-transition strategies request a top-to-bottom (DOWN)
              direction so their diagrams read downward. The package must place each successor
              below its predecessor for that direction. A forward chain that flows top-to-bottom is
              the observable evidence the direction was honored.
            tags: [ots]
            tests:
              - ActionFlowView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
              - StateTransitionView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
              - ActionFlowView_BuildLayout_Successions_FlowTopToBottom

          - id: SysML2Tools-OTS-DemaRendering-Containers
            title: >-
              DemaConsulting.Rendering shall pack container regions so that child boxes are placed
              inside their container and containers do not overlap one another.
            justification: |
              The interconnection strategy renders nested parts as containers whose children must
              fall inside the container bounds, with sibling containers kept apart. The package's
              containment packing produces this geometry, evidenced by children rendered inside the
              container box and non-overlapping part boxes.
            tags: [ots]
            tests:
              - InterconnectionView_BuildLayout_NestedContainer_PlacesChildrenInsideContainerBox
              - InterconnectionView_BuildLayout_ContainerSize_BoundsChildrenAndTitle
              - InterconnectionView_BuildLayout_PartBoxes_DoNotOverlap

          - id: SysML2Tools-OTS-DemaRendering-Routing
            title: >-
              DemaConsulting.Rendering shall route connectors as orthogonal segments between the
              boxes it places.
            justification: |
              Readable diagrams require connectors that turn at right angles between their
              endpoints. The package's orthogonal router produces such polylines, evidenced by
              forward chains that route top-to-bottom orthogonally and by the routed connectors
              produced for an interconnection diagram whose boxes do not overlap.
            tags: [ots]
            tests:
              - ActionFlowView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
              - StateTransitionView_BuildLayout_ForwardChain_FlowsTopToBottomOrthogonally
              - InterconnectionView_BuildLayout_PartsAndConnections_ProducesBoxesPortsAndLines

          - id: SysML2Tools-OTS-DemaRendering-RenderSvg
            title: >-
              DemaConsulting.Rendering shall render a laid-out layout tree to a valid SVG document.
            justification: |
              SysML2Tools produces SVG output through the package's SvgRenderer. The renderer must
              turn a LayoutTree into a well-formed SVG document representing the diagram, evidenced
              by SVG produced from an empty tree and from full workspace renders.
            tags: [ots]
            tests:
              - SvgRenderer_Render_EmptyTree_WritesValidSvg
              - DiagramRenderer_RenderWorkspace_SoftwareStructureModel_ReturnsSvgOutput
              - DiagramRenderer_RenderWorkspace_GeneralViewModel_SvgContainsElementNames

          - id: SysML2Tools-OTS-DemaRendering-RenderPng
            title: >-
              DemaConsulting.Rendering shall render a laid-out layout tree to a valid PNG image.
            justification: |
              SysML2Tools produces raster output through the package's CanvasNet-based PngRenderer. The
              renderer must turn a LayoutTree into a valid PNG image, evidenced by PNG bytes
              produced from an empty tree and from full workspace renders.
            tags: [ots]
            tests:
              - PngRenderer_Render_EmptyTree_WritesPngBytes
              - DiagramRenderer_RenderWorkspace_SoftwareStructureModel_PngRenderer_ReturnsPngOutput
              - DiagramRenderer_RenderWorkspace_GeneralViewModel_PngProducesValidOutput

          - id: SysML2Tools-OTS-DemaRendering-CrossHierarchyEdges
            title: >-
              DemaConsulting.Rendering shall route an edge declared on a graph scope between two
              nodes that sit at any depth beneath that scope, connecting the endpoint nodes
              themselves rather than the containers that hold them.
            justification: |
              The General View declares each relationship in the lowest common ancestor scope of
              its two endpoints, which may be several packages above them. The relationship is
              only readable if the package connects the endpoint boxes themselves: connecting the
              enclosing package borders, or dropping the edge when its endpoints are in different
              containers, would hide relationships between definitions of different packages.
              Version 0.3.0-beta.2 of the package family introduced this behavior.
            tags: [ots]
            tests:
              - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_SiblingPackages_DeclaredAtRootAndRoutedToNestedBoxes
              - GeneralViewLayoutStrategy_BuildLayout_CrossPackageEdge_NestedVersusOuter_DeclaredInOuterScope

          - id: SysML2Tools-OTS-DemaRendering-ComponentOrderFollowsInsertion
            title: >-
              DemaConsulting.Rendering shall stack the unconnected groups of nodes inside a layered
              container in the order the nodes were added to it.
            justification: |
              The General View cannot make the engine place a package folder's contents with
              knowledge of where the folder's outgoing relationships lead, so it controls the
              stacking by the order in which it adds the folder's definitions. That is only a sound
              mechanism while the package keeps ordering such groups by insertion order; this
              requirement pins the behavior so that an upgrade that changes it fails here instead of
              silently reintroducing relationship crossings.
            tags: [ots]
            tests:
              - LayeredLayoutAlgorithm_Layout_ContainerContents_StackUnconnectedGroupsByInsertionOrder

          - id: SysML2Tools-OTS-DemaRendering-NotationBadges
            title: >-
              DemaConsulting.Rendering shall provide thick-bar and crossed-circle badge shapes
              that a layout can place and draw.
            justification: |
              The Action Flow View draws a fork or join as a thick bar and a terminate node as a
              crossed circle. Both are badge shapes of the package (BadgeShape.ThickHorizontalBar
              and BadgeShape.CrossedCircle, available since version 0.3.0-beta.3); the strategy
              tests confirm the shapes are produced and the renderers accept them.
            tags: [ots]
            tests:
              - ActionFlowView_BuildLayout_ForkAndJoin_RenderThickBarBadges_WithoutLabel
              - ActionFlowView_BuildLayout_TerminateNode_RendersCrossedCircle_NoOutgoing

          - id: SysML2Tools-OTS-DemaRendering-BoxCornerIcon
            title: >-
              DemaConsulting.Rendering shall draw a send or accept icon in the corner of a box
              that requests one.
            justification: |
              The notation marks accept and send actions with a pentagon icon in the box corner.
              The package provides it as BoxAppearance.CornerIcon (version 0.3.0-beta.3); a box
              laid out with the icon and rendered to SVG and PNG is the evidence.
            tags: [ots]
            tests:
              - ActionFlowView_BuildLayout_AcceptAndSend_RenderBoxesWithCornerIcons
              - ActionFlowView_BuildLayout_PipelineGalleryModel_ShowsActionFlowNotation

          - id: SysML2Tools-OTS-DemaRendering-LabelAvoidance
            title: >-
              DemaConsulting.Rendering shall place connector labels clear of the boxes handed to
              its label placer as obstacles.
            justification: |
              State transition labels must not sit on state-box corners. The package's
              ConnectorLabelPlacer accepts the boxes as obstacles (version 0.3.0-beta.3) and the
              renderers use it; the strategy sizes its frame with the same call, and the tests
              run the placer over the produced layout and find no label on a box.
            tags: [ots]
            tests:
              - StateTransitionView_BuildLayout_ElevatorGalleryModel_LabelsDoNotOverlapStateBoxes
              - StateTransitionView_BuildLayout_FrameWidth_AccountsForLongTransitionLabel

          - id: SysML2Tools-OTS-DemaRendering-BackEdgeApproach
            title: >-
              DemaConsulting.Rendering shall give an edge whose target end decoration is declared
              on the layout graph a final straight approach at least as long as the decoration.
            justification: |
              An arrowhead on a back edge is only drawn cleanly when the edge approaches its
              target on a straight run as long as the marker. The layered algorithm reads the
              declared LayoutGraphEdge.TargetEnd for this (version 0.3.0-beta.3); an upgrade that
              ignores it fails the approach-length checks.
            tags: [ots]
            tests:
              - LayeredPlacement_Place_EdgeTargetEnd_ForwardedToGraphEdges
              - StateTransitionView_BuildLayout_BackEdge_OpenChevronWithFlushApproach
              - ActionFlowView_BuildLayout_BackEdge_OpenChevronWithFlushApproach

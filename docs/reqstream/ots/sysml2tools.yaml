---
# SysML2Tools OTS Software Requirements
#
# Requirements for the published SysML2Tools architecture modeling tool functionality
# (lint and render of the model under docs/sysml2). The in-repository build of SysML2Tools
# emits self-validation tests with the same names; the source filter restricts the evidence
# to the results written by the published tool (artifacts/sysml2tools-self-validation.trx).

sections:
  - title: OTS Software Requirements
    sections:
      - title: SysML2Tools Requirements
        requirements:
          - id: SysML2Tools-OTS-SysML2Tools-Lint
            title: SysML2Tools shall lint the SysML2 model, reporting syntax errors, and with --strict-unresolved unresolved references, as errors.
            justification: |
              Linting the model in CI catches broken references and syntax errors in the
              architecture model before they reach the generated documentation. The pinned
              release supports --strict-unresolved, which turns unresolved references into
              errors; other warnings (for example duplicate root packages) do not change the
              exit code, so lint.ps1 also fails on any remaining warning line.
            tags: [ots]
            tests:
              - sysml2tools-self-validation@SysML2Tools_LintSelfTest

          - id: SysML2Tools-OTS-SysML2Tools-Render
            title: SysML2Tools shall render the declared views to SVG diagrams.
            justification: |
              The rendered diagrams are embedded in the design documentation, so a failure to
              render must fail the build rather than silently omit a diagram.
            tags: [ots]
            tests:
              - sysml2tools-self-validation@SysML2Tools_RenderSvgSelfTest
              - SysML2Tools_SoftwareStructureViewSvg

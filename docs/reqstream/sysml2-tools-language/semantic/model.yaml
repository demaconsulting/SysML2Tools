          - SysML2Tools-Language-Semantic-Model-AstBuilder-FeatureValueAndMultiplicityModifiers
          - SysML2Tools-Language-Semantic-Model-AstBuilder-ReferenceSubsettingConjugationRawCapture
          - SysML2Tools-Language-Semantic-Model-AstBuilder-TransitionTriggerEffect

          - SysML2Tools-Language-Semantic-Model-AstBuilder-ParallelState
          - SysML2Tools-Language-Semantic-Model-AstBuilder-ElseSuccession
          - SysML2Tools-Language-Semantic-Model-AstBuilder-TerminateNode

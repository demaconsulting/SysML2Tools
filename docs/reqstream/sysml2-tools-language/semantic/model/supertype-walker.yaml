---
# SupertypeWalker Requirements
#
# PURPOSE:
# - Define requirements for the SupertypeWalker unit (Semantic Model subsystem)

sections:
  - title: SupertypeWalker Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-SupertypeWalker-Walk
        title: >-
          SupertypeWalker.WalkAll shall traverse the specialization chains of all
          registered symbols and detect cyclic specialization.
        justification: |
          Cyclic specialization (e.g., A specializes B, B specializes A) is semantically
          invalid in SysML v2. The walker must detect and report these cycles without
          looping infinitely.
        tests:
          - WorkspaceLoader_LoadAsync_CyclicSpecialization_ProducesWarning

      - id: SysML2Tools-Language-Semantic-Model-SupertypeWalker-CyclePosition
        title: >-
          SupertypeWalker.WalkAll shall locate each cyclic-specialization Warning at the supertype
          reference that closes the cycle (its token position, or the declaration position when
          the reference text was not located) and name the file that declares it, rather than
          reporting an empty path and position (0,0).
        justification: |
          A diagnostic that carries no position cannot be used by CI annotations, editor
          navigation, or model-fix loops. The declaring node carries its file and the position of
          each reference it declares, so the walker can report where the cycle is written.
        tests:
          - WorkspaceLoader_LoadAsync_CyclicSpecialization_ReportsFileAndPosition

      - id: SysML2Tools-Language-Semantic-Model-SupertypeWalker-ImplicitSpecializations
        title: >-
          SupertypeWalker.WalkAll shall consider only the specializations a model declares: the
          implicit specializations NameResolver applies to every element (for example a part
          definition's Parts::Part) shall never be walked and shall never produce a
          cyclic-specialization Warning.
        justification: |
          Implicit specializations target library root types and can never close a cycle among
          relationships the author wrote, so walking them adds cost without any diagnostic value
          and a warning about them would be a false positive. A model made only of implicit
          specializations must load without cyclic-specialization diagnostics.
        tests:
          - WorkspaceLoader_LoadAsync_ImplicitSpecializationsOnly_NoCycleWarning

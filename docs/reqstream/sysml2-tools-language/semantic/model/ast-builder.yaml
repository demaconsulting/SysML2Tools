---
# AstBuilder Requirements
#
# PURPOSE:
# - Define requirements for the AstBuilder unit (Semantic Model subsystem)

sections:
  - title: AstBuilder Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-Build
        title: >-
          AstBuilder shall visit the ANTLR4 CST produced by SysMLv2Parser and return a
          SysmlPackageNode representing the root namespace.
        justification: |
          The CST produced by the ANTLR4 grammar contains all parse tree nodes. The AST
          builder distills these into a compact, traversable tree of named elements.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-QualifiedNames
        title: >-
          AstBuilder shall compute fully-qualified names by joining ancestor names with
          the "::" separator as it descends into nested namespaces.
        justification: |
          Fully-qualified names are required for symbol table lookup and reference resolution.
          The builder must track the current namespace context during traversal.
        tests:
          - WorkspaceLoader_LoadAsync_NestedPackages_RegistersQualifiedNames
          - WorkspaceLoader_LoadAsync_PartDef_RegistersDefinition

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-Supertypes
        title: >-
          AstBuilder shall extract supertype qualified names from a definition's
          subclassification and specialization parts and attach them to the corresponding
          AST node.
        justification: |
          Supertype names are required for reference resolution and supertype walking.
          They must be extracted during AST construction before symbol table operations.
        tests:
          - WorkspaceLoader_LoadAsync_SpecializesChain_Registered
          - WorkspaceLoader_LoadAsync_UnresolvedReference_ProducesWarning

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-UsageSubsetting
        title: >-
          AstBuilder shall extract a usage/feature's own `subsets`/`:>` clause (as distinct
          from its `redefines`/`:>>` clause) into the same SupertypeNames property used for
          definition-level supertypes.
        justification: |
          A usage-level `subsets`/`:>` clause (e.g. `part vehicle1_c1 :> vehicle1`) was
          previously never extracted at all, so it produced no Supertype edge and was silently
          invisible to reference resolution — this broke ReferenceResolver's bare-name
          redefinition ancestor-chain walk whenever the redefining feature's owner was itself a
          usage-level subsetting (not a `part def` specialization), the exact shape used by the
          OMG corpus fixture `1c-PartsTreeRedefinition.sysml`.
        tests:
          - WorkspaceLoader_LoadAsync_UsageLevelSubsetting_PopulatesSupertypeNames
          - WorkspaceLoader_LoadAsync_1cPartsTreeRedefinitionFixture_NoUnresolvedReferenceWarnings

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ViewRenderTarget
        title: >-
          AstBuilder shall capture a view's render target reference text (from its
          `render <target>;` member) as raw, unevaluated data on the corresponding
          SysmlViewNode's RenderTargetName property.
        justification: |
          `RenderTargetName` names a rendering style/format, not content, so it is captured
          verbatim only and never drives scoping or resolution.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ViewFilterExpression
        title: >-
          AstBuilder shall capture a view's filter expression source text (from its
          `filter [<expr>];` member) as raw, unevaluated data on the corresponding
          SysmlViewNode's FilterExpressionText property.
        justification: |
          Full filter expression evaluation is deferred future work; capturing the raw source
          text during AST construction preserves the information for a future capability
          without requiring premature expression-evaluation logic in this unit.
        tests:
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ViewExposedNames
        title: >-
          AstBuilder shall capture each `expose <name>[::**[<expr>]];` member (`view` usages
          only, in source order) as a paired `ExposeMember` — qualified-name reference text plus
          its own bracket-filter expression text (or null when absent) — on the corresponding
          SysmlViewNode's ExposeMembers property.
        justification: |
          Capturing this data during AST construction is the prerequisite for ReferenceResolver
          to resolve each entry's qualified name into edges that GeneralViewLayoutStrategy uses
          for scoping. `expose` is only valid grammar inside a `view` usage's body, not a
          `view def` definition's body. Pairing each entry's path with its own bracket-filter
          text (rather than the earlier Phase 1 flattened, unpaired `ExposedNames`/
          `ExposeBracketFilterTexts` lists) is the Phase 2a prerequisite for
          `ExposeScopeResolver` to evaluate a bracket filter against the specific path it was
          declared on, when a view declares more than one `expose` member.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithBracketedFilterExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithPlainWildcardExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty
          - AstBuilder_MultipleExposeMembers_OnlyOneBracketed_PairsFilterWithCorrectPath

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ViewUsageExpose
        title: >-
          AstBuilder shall build a SysmlViewNode from a named `view` usage (in addition to a
          `view def` definition), capturing the same render/filter members plus its `expose`
          members.
        justification: |
          `expose <name>;` is only valid grammar inside a `view` usage's body, not a `view def`
          definition's body; without a dedicated VisitViewUsage override, named view usages
          (including every `expose` statement) were never visited at all, so a view's exposed
          names could never be captured, resolved, or scoped. This is also an intentional
          capability addition beyond `expose` support alone: `VisitViewUsage` causes every named
          `view` usage — whether or not it declares `expose` — to become its own renderable
          top-level `SysmlViewNode` declaration, whereas previously only `view def` declarations
          were ever visible to the render subsystem. For example, the OMG corpus fixture
          `11b-SafetyAndSecurityFeatureViews.sysml` declares 2 `view def`s plus 3 named `view`
          usages, so rendering it with no `--view` filter now produces 5 output files instead
          of 2.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - RenderSubsystem_OmgSafetyFeatureViewsCorpus_RendersAllNamedViewUsages

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-RedefinedFeature
        title: >-
          AstBuilder shall extract a feature's redefined-feature reference text (from its
          `redefines <target>;`/`:>> <target>` clause) as raw, unresolved data on the
          corresponding SysmlFeatureNode's RedefinedFeatureName property, mirroring how
          FeatureTyping is extracted.
        justification: |
          Capturing the raw redefinition reference during AST construction is the
          prerequisite for ReferenceResolver to resolve it into a Redefinition edge, and for
          GeneralViewLayoutStrategy to render the hollow-triangle-crossbar marker. The
          extraction mirrors ExtractFeatureTyping's structure exactly (walking
          featureSpecialization()'s redefinitions() instead of typings()), supporting both the
          `redefines` keyword form and the `:>>` operator form, and both bare-name and
          qualified `Owner::feature` reference shapes.
        tests:
          - WorkspaceLoader_LoadAsync_RedefinesKeyword_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_ColonGtGtOperator_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_QualifiedRedefinition_CapturesRawText
          - WorkspaceLoader_LoadAsync_NoRedefinition_RedefinedFeatureNameIsNull

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ImplicitRedefinitionName
        title: >-
          AstBuilder shall assign an implicitly-named redefining usage (one with no explicit
          declared name but a non-null RedefinedFeatureName) an effective name derived from the
          redefined feature's simple (trailing `::`-segment) name, using it in place of the
          missing declared name for namespace registration, QualifiedName, and the node's Name
          property.
        justification: |
          SysML v2 allows a redefining usage to omit its own declared name, in which case it
          takes the redefined feature's name (e.g. `port redefines fuelTankPort { item redefines
          fuelSupply; }` is named `fuelTankPort`). Without this fallback, such usages were built
          as anonymous nodes never registered in the symbol table, so any subsequent reference
          to them (including `bind` connector ends) failed to resolve — reproduced by the OMG
          corpus fixture `BindingConnectorsExample-1.sysml`, whose `bind` statements reference an
          implicitly-named `port redefines fuelTankPort { ... }` usage. Because `ownedRedefinition`
          is grammatically `qualifiedName ( DOT qualifiedName )*`, the redefined reference can
          itself be a dot-chained feature path (e.g. `tank.fuelTankPort`); the derivation takes
          only the trailing simple-name segment, not the whole dotted or qualified reference text.
        tests:
          - WorkspaceLoader_LoadAsync_BindingViaImplicitlyNamedRedefinedUsage_RecordsBindingEdge
          - WorkspaceLoader_LoadAsync_ImplicitNameFromDottedRedefinitionChain_UsesTrailingSegment
          - Binding_OmgCorpusFixture_ResolvesBindingEdgesViaImplicitRedefinitionNames

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-MetadataAnnotations
        title: >-
          AstBuilder shall capture each applied metadata annotation nested in an element body as a
          SysmlMetadataNode child carrying the annotating type reference and any supported literal
          attribute assignments in source order.
        justification: |
          Phase 1 filter evaluation operates over metadata annotations attached to definitions and
          features. Capturing those annotations during AST construction is the prerequisite for
          later reference resolution and metadata-based filtering.
        tests:
          - AstBuilder_BareMetadataAnnotation_CapturesMetadataNode
          - AstBuilder_MetadataAnnotationWithBooleanAttribute_CapturesLiteralValue

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ExposeBracketFilterText
        title: >-
          AstBuilder shall capture the raw expression text of each bracketed
          `expose <path>::**[<expr>]` member alongside that entry's own qualified-name reference
          text, as a paired ExposeMember on the corresponding SysmlViewNode's ExposeMembers
          property, without evaluating the expression itself.
        justification: |
          AstBuilder's own responsibility ends at raw, paired text capture; real evaluation of
          the captured expression (Phase 2a) is `ExposeScopeResolver`'s responsibility, given the
          per-entry candidate set only that unit can compute (a target's containment subtree of
          definitions). Preserving the pairing at capture time — rather than the earlier flattened
          `ExposeBracketFilterTexts` list — is what makes correct per-entry evaluation possible
          when a view declares more than one `expose` member.
        tests:
          - AstBuilder_ExposeBracketFilter_CapturesRawText
          - AstBuilder_MultipleExposeMembers_OnlyOneBracketed_PairsFilterWithCorrectPath

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-Dependency
        title: >-
          AstBuilder shall build a SysmlDependencyNode from a standalone `dependency A, B to
          C, D;` declaration, splitting the grammar's single flat qualifiedName() list into
          FromNames and ToNames by comparing each name's start token index against the TO()
          terminal's token index.
        justification: |
          The `dependency` grammar rule exposes one flat list of qualified names with no
          separate "from"/"to" sub-rules, so AstBuilder must positionally split the list itself
          before ReferenceResolver can resolve each side independently. Position-based splitting
          (rather than looking for the optional FROM keyword) also correctly handles the grammar's
          optional FROM keyword being entirely omitted (e.g. "dependency z to x, y;").
        tests:
          - WorkspaceLoader_LoadAsync_DependencyBinaryEnds_RecordsDependencyEdge
          - WorkspaceLoader_LoadAsync_DependencyCommaLists_RecordsCrossProductEdges
          - WorkspaceLoader_LoadAsync_DependencyUnresolvedEnd_ProducesWarningNoEdge
          - Dependency_OmgCorpusFixtures_ResolveExpectedEdges

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-BindingConnector
        title: >-
          AstBuilder shall build a SysmlConnectionNode with ConnectionKeyword "binding" from
          the common `bind A = B;` (bindingConnectorAsUsage) grammar shape, reusing the shared
          connector-end-reference extraction helper used by `connectionUsage`.
        justification: |
          Reusing the existing connector-end extraction helper against bindingConnectorAsUsage's
          connectorEndMember() entries lets ReferenceResolver treat binding connector endpoints
          uniformly with connect/message endpoints (the same dotted-feature-chain walk), without
          duplicating endpoint-extraction logic. The longer bindingConnector/typeBody grammar form
          has zero corpus evidence and is an intentional, documented non-goal.
        tests:
          - WorkspaceLoader_LoadAsync_BindingDottedChain_RecordsBindingEdge
          - WorkspaceLoader_LoadAsync_BindingUnresolvedEnd_ProducesWarningNoEdge
          - Binding_OmgCorpusFixture_ResolvesBindingEdgesViaImplicitRedefinitionNames

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-AttachedTransitionStateBody
        title: >-
          AstBuilder shall synthesize a SysmlTransitionNode for each attached-transition
          state body shape — a `behaviorUsageMember` followed by zero or more
          `targetTransitionUsageMember`s, and an `entryActionMember` followed by zero or more
          `entryTransitionMember`s — sourced from the preceding usage's name, in addition to
          building the preceding usage itself.
        justification: |
          SysML v2's grammar attaches a `then`/`accept ... then`/guarded-succession
          transition directly onto the immediately preceding state or entry-action usage
          within the same `stateBodyItem` alternative, rather than as a standalone
          `transitionUsageMember`. Previously, AstBuilder only visited the leading usage and
          silently dropped every attached transition, so the OMG Annex A.7 idiom
          `state off; accept Signal then starting;` produced no transition edge at all. A new
          `MultiNodeCapture` sentinel (flattened by `CollectChildren`, mirroring the existing
          `AnnotationCapture` pattern) lets a single `stateBodyItem` visit yield both the usage
          node and one or more synthesized transition nodes.
        tests:
          - WorkspaceLoader_LoadAsync_AttachedTransitionAfterState_ResolvesSelfLoopEdge
          - WorkspaceLoader_LoadAsync_MultipleAttachedTransitionsAfterState_CapturesAll
          - WorkspaceLoader_LoadAsync_EntryActionWithAttachedTransition_CapturesEntryFeatureAndTransition
          - WorkspaceLoader_LoadAsync_NamedEntryAction_RegistersResolvableFeature
          - Transition_OmgCorpusFixture_ResolvesAllStatesAndTransitions

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-EntryDoExitActionFeatures
        title: >-
          AstBuilder shall build a minimal SysmlFeatureNode (with FeatureKeyword "entry",
          "do", or "exit" and no children) for each `entryActionMember`, `doActionMember`, and
          `exitActionMember`, naming it only when the grammar's named `ACTION usageDeclaration?`
          alternative supplies a declared name.
        justification: |
          Entry/do/exit action bodies are behavioral (statement sequences), which is out of
          scope for this unit's declarative AST; capturing a minimal, non-behavioral feature
          node (Children always empty) is sufficient to register a resolvable name in the
          symbol table for the named alternative, while the unnamed reference-subsetting
          alternative (e.g. `entry performSelfTest{...}`) intentionally yields a nameless
          feature node rather than attempting to derive or evaluate a name.
        tests:
          - WorkspaceLoader_LoadAsync_UnnamedEntryActionReferenceForm_NoNameNoCrash
          - WorkspaceLoader_LoadAsync_StateUsageWithExplicitTyping_RecordsTypingEdge
          - Transition_OmgCorpusFixture_ResolvesAllStatesAndTransitions

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ActionBodyAttachedSuccession
        title: >-
          AstBuilder shall synthesize a SysmlTransitionNode for each attached-succession
          `actionBodyItem` shape — an `initialNodeMember` followed by zero or more
          `actionTargetSuccessionMember`s, and an optional leading `sourceSuccessionMember`
          plus an `actionBehaviorMember` followed by zero or more
          `actionTargetSuccessionMember`s — in addition to building the preceding/following
          node itself. Trailing successions are sourced from the node's own name; the
          optional leading `sourceSuccessionMember` (a bare `then` immediately before an
          `actionBehaviorMember`, e.g. `action a; then fork f;`) synthesizes an implicit
          *incoming* succession whose `Source` is the name of the immediately preceding
          sibling `actionBodyItem` in the same enclosing action body, since the grammar's
          leading marker itself carries no name.
        justification: |
          SysML v2's grammar attaches a `then`/guarded/default succession directly onto the
          immediately preceding action node or `first` marker within the same
          `actionBodyItem` alternative, rather than as a standalone
          `successionAsUsage`/`transitionUsageMember`. Previously, AstBuilder only visited the
          leading node and silently dropped every attached succession, so the compact idiom
          `action a1; then a2;` produced both nodes but no succession edge between them. The
          existing `MultiNodeCapture` sentinel (introduced for the analogous State Transition
          View fix) is reused so a single `actionBodyItem` visit can yield both the node and
          one or more synthesized transition nodes. A bare `initialNodeMember` with no
          attached succession remains a no-op, unchanged from today, since
          `ActionFlowViewLayoutStrategy` infers start/done markers from succession topology
          rather than a declarative initial-marker concept. Additionally, the grammar's
          `(sourceSuccessionMember)? actionBehaviorMember` shape's optional leading marker —
          the dominant real-world idiom for wiring a control node into a flow, e.g.
          `action TurnOn; then fork; then monitorBrakePedal; ...` — previously went entirely
          unread, so the fork/decide/merge/join/accept/send node's *incoming* edge from the
          preceding sibling was silently dropped even though its outgoing successions worked.
          `CollectActionBodyChildren` now tracks the current flow position (the preceding
          sibling's name) in source order as it iterates an action body's items, so
          `VisitActionBodyItem` can resolve that implicit incoming `Source` when a leading
          marker is present.
        tests:
          - WorkspaceLoader_LoadAsync_CompactActionThenIdiom_ResolvesBothNodes
          - WorkspaceLoader_LoadAsync_MultipleActionTargetSuccessions_CapturesAll
          - WorkspaceLoader_LoadAsync_BareInitialNodeMember_ProducesNoSuccession
          - WorkspaceLoader_LoadAsync_InitialNodeMemberWithAttachedSuccession_SynthesizesTransition
          - WorkspaceLoader_LoadAsync_GuardedAndDefaultActionTargetSuccession_ExtractTargets
          - ControlNode_OmgCorpusFixture_ResolvesForkJoinDecisionMerge

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-ActionControlNodes
        title: >-
          AstBuilder shall build a minimal SysmlFeatureNode (with Children always empty and
          FeatureKeyword "merge", "decide", "join", "fork", "accept", or "send") for each
          mergeNode, decisionNode, joinNode, forkNode, acceptNode, and sendNode, synthesizing
          an internal `$<keyword><n>` name when the node is anonymous (no declared name), so
          it can still act as the implicit source of its attached successions.
        justification: |
          Anonymous control nodes (e.g. a bare `then fork;` immediately followed by several
          `then` successions) are the dominant idiom for fork/decide/send in the real OMG
          training corpus, not a rare edge case; leaving them nameless (as ordinary anonymous
          actions are) would make it impossible to wire their successions or render a distinct
          badge for them. The synthetic name is never added to the symbol table (QualifiedName
          stays null) and is blanked from rendered labels, so it is purely an internal wiring
          mechanism. `assignmentNode`, `terminateNode`, `ifNode`, `whileLoopNode`, and
          `forLoopNode` remain intentionally unhandled — a pre-existing gap, not introduced by
          this change.
        tests:
          - WorkspaceLoader_LoadAsync_AnonymousControlNodes_SynthesizeNames
          - WorkspaceLoader_LoadAsync_NamedControlNodes_KeepDeclaredName
          - ControlNode_OmgCorpusFixture_ResolvesForkJoinDecisionMerge

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-EnumerationValues
        title: >-
          AstBuilder shall build a SysmlFeatureNode (FeatureKeyword "enum value") for each
          `enumeratedValue` in an `enum def`'s body, in source order, regardless of whether the
          literal uses the bare form, the value-assignment form, or the redefinition-body form.
        justification: |
          `enumerationBody` uniquely alternates `annotatingMember | enumerationUsageMember`
          directly rather than wrapping them in a single rule (unlike `definitionBody`'s
          `definitionBodyItem` or `requirementBody`'s `requirementBodyItem`), so the generic
          `CollectChildren` helper cannot be applied to it directly. A dedicated
          `CollectEnumerationBodyChildren` helper walks the body's raw `context.children`,
          filtering to parser-rule children before delegating to `CollectChildren`, so `enum
          def` compartments render their literal values instead of always appearing empty.
        tests:
          - WorkspaceLoader_LoadAsync_EnumDefinition_BareLiterals_CapturesEnumValues
          - WorkspaceLoader_LoadAsync_EnumDefinition_ValueAssignmentForm_CapturesNames
          - Enumeration_OmgCorpusFixtures_CaptureAllLiteralForms

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-RequirementSubjectAndConstraints
        title: >-
          AstBuilder shall capture a requirement/concern definition's or usage's `subject`,
          `actor`, and `stakeholder` members as minimal SysmlFeatureNodes (FeatureKeyword
          "subject", "actor", "stakeholder"), and its `require constraint`/`assume constraint`
          members as SysmlFeatureNodes (FeatureKeyword "require constraint"/"assume
          constraint") whose ExpressionText captures the constraint's raw expression text.
        justification: |
          Requirement definitions previously delegated to the generic
          BuildDefinitionFromDeclaration helper, which never collected a requirementBody's
          Children at all — subject/actor/stakeholder/constraint members were always silently
          dropped, defeating the compartment-depth goal for the view's most detailed element
          kind. VisitRequirementDefinition and VisitConcernDefinition now push a namespace
          scope and call CollectChildren over requirementBody().requirementBodyItem(),
          mirroring VisitStateUsage's existing push-scope/body-collect/register pattern.
          Because the real OMG training corpus's dominant idiom nests `subject`/`assume
          constraint` inside a requirement *usage* that specializes a requirement def (not
          inside a `requirement def` body), VisitRequirementUsage and VisitConcernUsage are
          also extended to collect Children the same way — a deliberate extension beyond a
          literal *Definition-only reading of the ROADMAP item, without which the
          compartment-depth goal would not manifest for the corpus's actual idiomatic shape.
          BuildConstraintFeatureNode handles both requirementConstraintUsage grammar
          alternatives: the reference form (captures the referenced constraint's name into
          ExpressionText) and the inline `CONSTRAINT constraintUsageDeclaration
          calculationBody` form (captures the raw calculationBody().GetText()). A nested `doc`
          inside a constraint's own calculationBody (as seen in the corpus's `assume
          constraint { doc /* ... */ ... }` idiom) is intentionally NOT captured — constraint
          bodies are captured only as raw expression text, with no nested-member traversal.
        tests:
          - WorkspaceLoader_LoadAsync_RequirementDefinition_CapturesSubjectAndConstraints
          - WorkspaceLoader_LoadAsync_RequirementUsage_CapturesSubjectAndConstraint
          - WorkspaceLoader_LoadAsync_RequirementDefinition_CapturesActorAndStakeholder
          - Requirement_OmgCorpusFixtures_CaptureSubjectAndConstraints

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-StandaloneConstraintUsageAndDefinition
        title: >-
          AstBuilder shall build a SysmlFeatureNode (FeatureKeyword "constraint") for a
          top-level `constraint { expr }` usage, capturing its raw calculation-body expression
          text into ExpressionText, and shall synthesize the same shape as a single child
          feature of a `constraint def`'s own SysmlDefinitionNode.
        justification: |
          VisitConstraintUsage was previously entirely absent from AstBuilder — a standalone
          `constraint` usage (not nested inside a requirement) produced no AST node at all.
          VisitConstraintDefinition previously delegated to BuildDefinitionFromDeclaration,
          which builds name/qualifiedName/supertypes correctly for a `constraint def` but has
          no way to expose the definition's own calculationBody (constraintDefinition's body is
          a calculationBody, not a definitionBody), so it is now rewritten to synthesize a
          single "constraint"-keyword child feature node carrying that raw expression text.
        tests:
          - WorkspaceLoader_LoadAsync_ConstraintUsage_CapturesExpressionText
          - WorkspaceLoader_LoadAsync_ConstraintDefinition_SynthesizesExpressionChild

      - id: SysML2Tools-Language-Semantic-Model-AstBuilder-RequirementVerifyFrameNoHoist
        title: >-
          AstBuilder shall not hoist a requirementVerificationMember's or framedConcernMember's
          own nested body content onto the enclosing requirement/concern's Children.
        justification: |
          Once VisitRequirementDefinition/VisitConcernDefinition/VisitRequirementUsage/
          VisitConcernUsage began calling CollectChildren over requirementBodyItem (needed to
          capture subject/constraint members), ANTLR's default last-non-null-wins dispatch
          would, for the first time, recurse into a nested `verify`/`frame` member's own
          requirementBody and incorrectly bubble its content up as if it were a direct child of
          the *outer* enclosing requirement. VisitRequirementVerificationMember and
          VisitFramedConcernMember now explicitly return null, short-circuiting that recursive
          descent; the verify target itself remains captured separately via the existing
          FindVerificationMembers/VerifiedRequirementNames mechanism, unaffected by this
          change.
        tests:
          - WorkspaceLoader_LoadAsync_RequirementVerifyMember_DoesNotHoistNestedContent

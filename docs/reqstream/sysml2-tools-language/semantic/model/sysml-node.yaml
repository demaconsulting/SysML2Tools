---
# SysmlNode AST Node Hierarchy Requirements
#
# PURPOSE:
# - Define requirements for the SysmlNode AST node hierarchy

sections:
  - title: SysmlNode Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Hierarchy
        title: >-
          SysmlNode shall define an abstract base class with Name, QualifiedName, Children,
          SupertypeNames, and ImportedNames properties shared by all AST node types.
        justification: |
          A common base class enables uniform traversal and registration of all AST nodes
          regardless of their specific element type.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Types
        title: >-
          The SysmlNode hierarchy shall include SysmlPackageNode, SysmlDefinitionNode,
          SysmlFeatureNode, SysmlImportNode, SysmlMetadataNode, SysmlViewNode,
          SysmlViewpointNode, SysmlConnectionNode, and SysmlTransitionNode.
        justification: |
          Separate node types for packages, definitions, features, imports, views,
          viewpoints, connections, and transitions allow future analysis passes to dispatch
          on element type without string comparisons.
        tests:
          - WorkspaceLoader_LoadAsync_PartDef_RegistersDefinition

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewRenderTarget
        title: >-
          SysmlViewNode shall expose RenderTargetName: the raw reference text of its `render
          <target>;` member, or null when absent.
        justification: |
          RenderTargetName is exposed as raw metadata only: per the SysML v2 grammar it names a
          rendering style/format (e.g. `asTreeDiagram`, `asElementTable`), never content, so it
          is captured but never resolved into an edge and has no effect on scope.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewExposedNames
        title: >-
          SysmlViewNode shall expose ExposeMembers: each `expose <name>[::**[<expr>]];` member's
          qualified-name reference text, its own bracket-filter expression text (or null when the
          entry carries no bracket filter), and its `ExposeRecursionKind` classification, in
          source order; GetExposedNames() shall return the qualified name of each entry as a
          computed convenience projection.
        justification: |
          Making a view's `expose` statements user-observable data is the prerequisite for
          ReferenceResolver, which resolves GetExposedNames() into `Expose`-kind edges that
          GeneralViewLayoutStrategy uses for scoping. Phase 1 originally captured each entry's
          bracket-filter text on a separate, unpaired, flattened list
          (`ExposeBracketFilterTexts`), making it impossible to tell which exposed path a given
          bracket filter belonged to when a view declared more than one `expose` member; Phase 2a
          fixes this by pairing each entry's path and bracket-filter text together as a single
          `ExposeMember`, the prerequisite for `ExposeScopeResolver` to evaluate each entry's
          bracket filter against that entry's own containment subtree. This fix additionally adds
          the `ExposeRecursionKind` classification, the prerequisite for `ExposeScopeResolver` to
          correctly distinguish exact/direct-children/whole-subtree matching per entry instead of
          unconditionally treating every entry as whole-subtree.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty
          - AstBuilder_ExposeBracketFilter_CapturesRawText
          - AstBuilder_MultipleExposeMembers_OnlyOneBracketed_PairsFilterWithCorrectPath
          - AstBuilder_ExposeBareMembership_CapturesMembershipExact
          - AstBuilder_ExposeRecursiveMembership_CapturesMembershipRecursive
          - AstBuilder_ExposeNamespaceDirectChildren_CapturesNamespaceDirectChildren
          - AstBuilder_ExposeNamespaceRecursive_CapturesNamespaceRecursive

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewFilterExpression
        title: >-
          SysmlViewNode shall expose FilterExpressionText: the raw source text of its `filter
          [<expr>];` member, or null when absent.
        justification: |
          Making a view's declared filter expression user-observable data is required so
          callers can observe it as raw source text and pass it to the Core Filtering subsystem;
          this semantic-model field remains capture-only and does not itself perform evaluation.
        tests:
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-RedefinedFeatureName
        title: >-
          SysmlFeatureNode shall expose RedefinedFeatureName: the raw reference text of its
          `redefines <target>;`/`:>> <target>` clause, or null when the feature declares no
          redefinition.
        justification: |
          Making a feature's redefinition reference user-observable data, mirroring how
          FeatureTyping is exposed, is the prerequisite for ReferenceResolver to resolve it into
          a `Redefinition`-kind edge that GeneralViewLayoutStrategy renders as a
          hollow-triangle-crossbar marker.
        tests:
          - WorkspaceLoader_LoadAsync_RedefinesKeyword_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_ColonGtGtOperator_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_QualifiedRedefinition_CapturesRawText
          - WorkspaceLoader_LoadAsync_NoRedefinition_RedefinedFeatureNameIsNull

---
# SysmlNode AST Node Hierarchy Requirements
#
# PURPOSE:
# - Define requirements for the SysmlNode AST node hierarchy

sections:
  - title: SysmlNode Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Hierarchy
        title: >-
          SysmlNode shall define an abstract base class with Name, QualifiedName, Children,
          SupertypeNames, and ImportedNames properties shared by all AST node types.
        justification: |
          A common base class enables uniform traversal and registration of all AST nodes
          regardless of their specific element type.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Types
        title: >-
          The SysmlNode hierarchy shall include SysmlPackageNode, SysmlDefinitionNode,
          SysmlFeatureNode, SysmlImportNode, SysmlMetadataNode, SysmlViewNode,
          SysmlViewpointNode, SysmlConnectionNode, and SysmlTransitionNode.
        justification: |
          Separate node types for packages, definitions, features, imports, views,
          viewpoints, connections, and transitions allow future analysis passes to dispatch
          on element type without string comparisons.
        tests:
          - WorkspaceLoader_LoadAsync_PartDef_RegistersDefinition

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewRenderTarget
        title: >-
          SysmlViewNode shall expose RenderTargetName: the raw reference text of its `render
          <target>;` member, or null when absent.
        justification: |
          RenderTargetName is exposed as raw metadata only: per the SysML v2 grammar it names a
          rendering style/format (e.g. `asTreeDiagram`, `asElementTable`), never content, so it
          is captured but never resolved into an edge and has no effect on scope.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewExposedNames
        title: >-
          SysmlViewNode shall expose ExposeMembers: each `expose <name>[::**[<expr>]];` member's
          qualified-name reference text, its own bracket-filter expression text (or null when the
          entry carries no bracket filter), and its `ExposeRecursionKind` classification, in
          source order; GetExposedNames() shall return the qualified name of each entry as a
          computed convenience projection.
        justification: |
          Making a view's `expose` statements user-observable data is the prerequisite for
          ReferenceResolver, which resolves GetExposedNames() into `Expose`-kind edges that
          GeneralViewLayoutStrategy uses for scoping. Phase 1 originally captured each entry's
          bracket-filter text on a separate, unpaired, flattened list
          (`ExposeBracketFilterTexts`), making it impossible to tell which exposed path a given
          bracket filter belonged to when a view declared more than one `expose` member; Phase 2a
          fixes this by pairing each entry's path and bracket-filter text together as a single
          `ExposeMember`, the prerequisite for `ExposeScopeResolver` to evaluate each entry's
          bracket filter against that entry's own containment subtree. This fix additionally adds
          the `ExposeRecursionKind` classification, the prerequisite for `ExposeScopeResolver` to
          correctly distinguish exact/direct-children/whole-subtree matching per entry instead of
          unconditionally treating every entry as whole-subtree.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty
          - AstBuilder_ExposeBracketFilter_CapturesRawText
          - AstBuilder_MultipleExposeMembers_OnlyOneBracketed_PairsFilterWithCorrectPath
          - AstBuilder_ExposeBareMembership_CapturesMembershipExact
          - AstBuilder_ExposeRecursiveMembership_CapturesMembershipRecursive
          - AstBuilder_ExposeNamespaceDirectChildren_CapturesNamespaceDirectChildren
          - AstBuilder_ExposeNamespaceRecursive_CapturesNamespaceRecursive

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewFilterExpression
        title: >-
          SysmlViewNode shall expose FilterExpressionText: the raw source text of its `filter
          [<expr>];` member, or null when absent.
        justification: |
          Making a view's declared filter expression user-observable data is required so
          callers can observe it as raw source text and pass it to the Language Filtering subsystem;
          this semantic-model field remains capture-only and does not itself perform evaluation.
        tests:
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewSourceLocation
        title: >-
          SysmlViewNode shall expose SourceFilePath, SourceLine, and SourceColumn: the declaring
          file path (null when not built from a source file) and the one-based line and
          zero-based column of the view's declaration (0 when unknown).
        justification: |
          View-level diagnostics produced after loading (such as the empty-view render warning)
          must name the file and line of the offending view so users can find and fix it.
        tests:
          - WorkspaceLoader_LoadAsync_Views_CaptureSourceLocation

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewConditionsAndDefinition
        title: >-
          SysmlViewNode shall expose FilterExpressionTexts (every owned `filter` view condition's raw
          text, in source order) and ViewDefinitionName (a view usage's raw view definition
          reference, or null).
        justification: |
          Layout strategies need every owned view condition and the view definition whose
          conditions are inherited (SysML 7.26.2, 8.3.26.11).
        tests:
          - WorkspaceLoader_LoadAsync_ViewConditionsAndViewDefinition_Captured

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-RedefinedFeatureName
        title: >-
          SysmlFeatureNode shall expose RedefinedFeatureName: the raw reference text of its
          `redefines <target>;`/`:>> <target>` clause, or null when the feature declares no
          redefinition.
        justification: |
          Making a feature's redefinition reference user-observable data, mirroring how
          FeatureTyping is exposed, is the prerequisite for ReferenceResolver to resolve it into
          a `Redefinition`-kind edge that GeneralViewLayoutStrategy renders as a
          hollow-triangle-crossbar marker.
        tests:
          - WorkspaceLoader_LoadAsync_RedefinesKeyword_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_ColonGtGtOperator_CapturesRedefinedFeatureName
          - WorkspaceLoader_LoadAsync_QualifiedRedefinition_CapturesRawText
          - WorkspaceLoader_LoadAsync_NoRedefinition_RedefinedFeatureNameIsNull

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-MembershipVisibilityAndAliases
        title: >-
          SysmlNode shall expose each element's membership Visibility (public, protected, or
          private) and ShortName, SysmlImportNode shall expose IsImportAll, and SysmlAliasNode shall
          represent an alias membership's name, short name, and aliased qualified-name text.
        justification: |
          KerML 8.2.3.5.3 name resolution depends on member names, short names, alias memberships,
          and visibility (visible resolution admits only public memberships), so these must be
          observable in the semantic model.
        tests:
          - WorkspaceLoader_LoadAsync_VisibilityShortNameAndAlias_Captured

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ImportExposeReferenceText
        title: >-
          SysmlImportNode and ExposeMember shall expose an optional RawReferenceText: the import's
          or expose entry's reference as written, wildcard and recursive markers included but
          bracketed filter excluded, null when not captured.
        justification: |
          The qualified name used for resolution has its `::*`/`::**` markers stripped, so the
          written form (which distinguishes `import P;` from `import P::*;`) must be carried
          separately for the resolved edge's raw reference. It is optional so hand-built nodes and
          data serialized before the property existed remain valid.
        tests:
          - AstBuilder_ImportForms_CaptureWrittenReferenceText
          - AstBuilder_ExposeNamespaceDirectChildren_CapturesNamespaceDirectChildren
          - Serialize_ImportAndExposeRawReferenceText_RoundTripsAndNullIsOmitted

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-DefinitionModifiers
        title: >-
          SysmlDefinitionNode shall expose the IsAbstract, IsVariation, IsIndividual, and
          IsParallel flags, each false unless the definition declares the corresponding
          `abstract`, `variation`, `individual`, or (state definition) `parallel` modifier.
        justification: |
          The standard notation displays these modifiers, so they must be observable in the
          semantic model. They are optional additive members, so hand-built nodes and data
          serialized before they existed remain valid.
        tests:
          - WorkspaceLoader_LoadAsync_AbstractModifier_SetsIsAbstract
          - WorkspaceLoader_LoadAsync_VariationAndVariant_SetFlags
          - WorkspaceLoader_LoadAsync_IndividualPrefix_SetsIsIndividual
          - WorkspaceLoader_LoadAsync_ParallelState_SetsIsParallel
          - WorkspaceLoader_LoadAsync_PlainModel_AllNewMembersDefault

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-FeatureModifiers
        title: >-
          SysmlFeatureNode shall expose the IsAbstract, IsVariation, IsIndividual, IsVariant,
          IsReference, and IsParallel flags, each false unless the usage declares the
          corresponding `abstract`, `variation`, `individual`, `variant`, `ref`, or (state
          usage) `parallel` modifier.
        justification: |
          The standard notation displays these usage modifiers, so they must be observable in the
          semantic model; optional additive members keep older data valid.
        tests:
          - WorkspaceLoader_LoadAsync_AbstractModifier_SetsIsAbstract
          - WorkspaceLoader_LoadAsync_VariationAndVariant_SetFlags
          - WorkspaceLoader_LoadAsync_IndividualPrefix_SetsIsIndividual
          - WorkspaceLoader_LoadAsync_RefPrefix_SetsIsReference
          - WorkspaceLoader_LoadAsync_ParallelState_SetsIsParallel

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-FeatureDirection
        title: >-
          SysmlFeatureNode shall expose an optional Direction (In, Out, or InOut) for a usage
          declared with an `in`, `out`, or `inout` keyword, null otherwise; a bare
          direction-only parameter that produces no node carries no direction.
        justification: |
          Flow direction is part of how ports and parameters are drawn. Bare parameters are not
          AST nodes today and creating them would change layout inputs, so only usages with a
          direction keyword
          carry a direction.
        tests:
          - WorkspaceLoader_LoadAsync_FeatureDirection_Captured
          - WorkspaceLoader_LoadAsync_BareDirectionParameter_ProducesNoNode

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-MultiplicityModifiers
        title: >-
          SysmlFeatureNode shall expose IsOrdered and IsNonunique, true when the usage declares
          the `ordered` or `nonunique` multiplicity modifier, with or without a multiplicity
          range.
        justification: |
          The notation shows `ordered` and `nonunique` after the multiplicity, so they must be
          observable independently of the multiplicity text.
        tests:
          - WorkspaceLoader_LoadAsync_OrderedNonunique_Captured

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-FeatureValueText
        title: >-
          SysmlFeatureNode shall expose an optional ValueText: the usage's whole value clause
          verbatim, operator and original whitespace included, null when the usage declares no
          value; the text shall never be parsed or evaluated.
        justification: |
          The notation displays a usage's value; keeping the operator (`=`, `:=`, `default`)
          makes the text display-ready, and leaving it unevaluated matches the tool's
          no-expression-tree scope boundary.
        tests:
          - WorkspaceLoader_LoadAsync_FeatureValue_CapturedVerbatim

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ReferenceSubsettingAndConjugation
        title: >-
          SysmlFeatureNode shall expose an optional raw, unresolved ReferenceSubsettingName (the
          target of `::>`/`references`) and ConjugatedFeatureTyping (the name after `~`) with a
          computed IsConjugated; neither shall be part of SupertypeNames or FeatureTyping.
        justification: |
          The notation shows reference subsetting and conjugated typing, which the model
          previously dropped. Storing them in separate unresolved members preserves the data
          without adding supertype or typing edges, so resolution, diagnostics, and layout are
          unchanged.
        tests:
          - WorkspaceLoader_LoadAsync_ReferenceSubsetting_CapturedNotInSupertypeNames
          - WorkspaceLoader_LoadAsync_ConjugatedPortTyping_CapturesNameKeepsTypingNull

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-StateActionText
        title: >-
          SysmlFeatureNode shall expose an optional ActionText: the verbatim declaration text
          (body excluded) of an `entry`, `do`, or `exit` state sub-action, null for the empty
          form and for every other feature.
        justification: |
          The notation shows what each state sub-action performs; the existing node only carried
          its optional name, so the declaration text is captured raw.
        tests:
          - WorkspaceLoader_LoadAsync_StateEntryDoExitActions_CaptureActionText
          - WorkspaceLoader_LoadAsync_EmptyStateEntryAction_ActionTextNull

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-TransitionTriggerEffect
        title: >-
          SysmlTransitionNode shall expose an optional Trigger (the text after `accept`) and
          Effect (the text after `do`), verbatim with original whitespace, null when absent.
        justification: |
          The notation labels a transition with its trigger, guard, and effect; the guard was
          already captured, so trigger and effect complete the label data.
        tests:
          - WorkspaceLoader_LoadAsync_TransitionTriggerGuardEffect_Captured
          - WorkspaceLoader_LoadAsync_AttachedTransition_CapturesTriggerGuardEffect
          - WorkspaceLoader_LoadAsync_SynthesizedSuccessions_TriggerEffectNull

---
# SysmlNode AST Node Hierarchy Requirements
#
# PURPOSE:
# - Define requirements for the SysmlNode AST node hierarchy

sections:
  - title: SysmlNode Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Hierarchy
        title: >-
          SysmlNode shall define an abstract base class with Name, QualifiedName, Children,
          SupertypeNames, and ImportedNames properties shared by all AST node types.
        justification: |
          A common base class enables uniform traversal and registration of all AST nodes
          regardless of their specific element type.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-Types
        title: >-
          The SysmlNode hierarchy shall include SysmlPackageNode, SysmlDefinitionNode,
          SysmlFeatureNode, SysmlImportNode, SysmlViewNode, SysmlViewpointNode,
          SysmlConnectionNode, and SysmlTransitionNode.
        justification: |
          Separate node types for packages, definitions, features, imports, views,
          viewpoints, connections, and transitions allow future analysis passes to dispatch
          on element type without string comparisons.
        tests:
          - WorkspaceLoader_LoadAsync_PartDef_RegistersDefinition

      - id: SysML2Tools-Language-Semantic-Model-SysmlNode-ViewRenderExposeFilter
        title: >-
          SysmlViewNode shall expose RenderTargetName (the raw reference text of its `render
          <target>;` member, or null when absent), ExposedNames (the raw reference text of
          each `expose <name>;` member, empty when absent), and FilterExpressionText (the raw
          source text of its `filter [<expr>];` member, or null when absent).
        justification: |
          These three fields make a view's declared body statements user-observable data, not
          merely an internal implementation detail. RenderTargetName is exposed as raw metadata
          only: per the SysML v2 grammar it names a rendering style/format (e.g.
          `asTreeDiagram`, `asElementTable`), never content, so it is never resolved into an edge
          and has no effect on scope. ExposedNames is the field ReferenceResolver resolves into
          `Expose`-kind edges that GeneralViewLayoutStrategy uses for scoping.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewEmptyBody_AllNewFieldsNullOrEmpty

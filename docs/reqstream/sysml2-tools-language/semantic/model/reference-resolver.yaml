---
# ReferenceResolver Requirements
#
# PURPOSE:
# - Define requirements for the ReferenceResolver unit (Semantic Model subsystem)

sections:
  - title: ReferenceResolver Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-Resolve
        title: >-
          ReferenceResolver.ResolveAll shall check each supertype name referenced by
          AST nodes against the symbol table and produce a Warning for any unresolved name.
        justification: |
          Unresolved references indicate model incompleteness. Reporting as Warnings allows
          the caller to continue analysis and provide partial results.
        tests:
          - WorkspaceLoader_LoadAsync_UnresolvedReference_ProducesWarning

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-CircularImport
        title: >-
          ReferenceResolver.ResolveAll shall detect circular import chains in the import
          graph and produce a Warning diagnostic for each detected cycle.
        justification: |
          Circular imports must be detected to avoid infinite loops in reference resolution.
          The cycle detection uses depth-first search with a traversal stack.
        tests:
          - WorkspaceLoader_LoadAsync_CircularImport_ProducesWarningNoInfiniteLoop

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewRenderExpose
        title: >-
          ReferenceResolver.ResolveAll shall independently resolve a view's RenderTargetName
          into a Render-kind edge and each of its ExposedNames into an Expose-kind edge, and
          shall produce an unresolved-reference Warning diagnostic (with no corresponding edge)
          for either when it cannot resolve — mirroring the existing SubjectName/EndpointA
          unresolved-reference diagnostic pattern. FilterExpressionText is raw source text, not
          a reference, and is never inspected here.
        justification: |
          Before this change, an unresolved `render <target>;` (e.g. a typo) silently rendered
          the full workspace with no diagnostic at all, indistinguishable from a view with no
          `render` statement — the exact bug being fixed. Surfacing the same unresolved-reference
          diagnostic already used for satisfy/allocate gives the user a visible signal instead of
          silent full-workspace rendering.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTargetResolves_RecordsRenderEdge
          - WorkspaceLoader_LoadAsync_ViewRenderTargetUnresolved_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - RenderSubsystem_ViewsWithDistinctRenderTargets_ProduceDifferingOutputsAndDiagnostic

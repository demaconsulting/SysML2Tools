---
# ReferenceResolver Requirements
#
# PURPOSE:
# - Define requirements for the ReferenceResolver unit (Semantic Model subsystem)

sections:
  - title: ReferenceResolver Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-Resolve
        title: >-
          ReferenceResolver.ResolveAll shall resolve every reference (supertype, typing,
          redefinition, import, requirement-trace, and expose names) by KerML 8.2.3.5 name
          resolution from the referencing element's local namespace — including the memberships
          the owner inherits for a usage-level `subsets`/`:>` clause — and produce a Warning for
          any unresolved name.
        justification: |
          Unresolved references indicate model incompleteness. Reporting as Warnings allows
          the caller to continue analysis and provide partial results. A usage-level
          `subsets`/`:>` clause (e.g. `part frontWheel_1 subsets frontWheel = ...;`) is, per the
          SysML v2 spec, commonly a bare reference to a member the owner inherits rather than
          declares itself — the same dominant shape as a bare `redefines` reference — which
          local resolution in the owning namespace finds through the owner's inherited
          memberships, wherever the ancestor is declared.
        tests:
          - WorkspaceLoader_LoadAsync_UnresolvedReference_ProducesWarning
          - WorkspaceLoader_LoadAsync_1cPartsTreeRedefinitionFixture_NoUnresolvedReferenceWarnings

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-MemberVisibility
        title: >-
          ReferenceResolver.ResolveAll shall honor member visibility: a private (or, outside a
          specialization, protected) member shall not be reachable through a qualified name, a
          short name, or an alias from another namespace, and the reference shall produce an
          unresolved-reference Warning and no edge; `import all` and unqualified references from
          within the owning namespace (and, for protected members, its specializations) shall
          still resolve them.
        justification: |
          KerML 8.2.3.5 visible resolution. Without it a reference to `P::Hidden` (private) from
          another package would still receive a Typing edge and be drawn, exposing members their
          owner deliberately hid.
        tests:
          - WorkspaceLoader_LoadAsync_PrivateMemberQualifiedFromOtherPackage_NoEdgeAndWarning
          - WorkspaceLoader_LoadAsync_PrivateShortNameAndAlias_NotResolvableFromOtherPackage
          - WorkspaceLoader_LoadAsync_ProtectedMember_VisibleToSpecializationOnly
          - WorkspaceLoader_LoadAsync_ImportAllAndOwnPackage_ResolvePrivateMember
          - WorkspaceLoader_LoadAsync_ExposePrivateMember_NoExposeEdgeAndWarning

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-FilteredImports
        title: >-
          ReferenceResolver.ResolveAll shall honor the bracket filter of a filtered import
          (`import P::*[@X];`): a candidate the filter rejects shall not resolve through the
          import (an unresolved-reference Warning and no edge), a recursive filtered import shall
          skip a rejected candidate and find a deeper match, and the metadata a filter tests shall
          be resolved first so a candidate's declaration order or file does not matter.
        justification: |
          SysML 7.5.4: a filtered import imports a membership only if it satisfies the filter
          conditions. Ignoring the filter let a rejected candidate be resolved and drawn in the
          general, grid, and interconnection views.
        tests:
          - WorkspaceLoader_LoadAsync_FilteredImport_RejectsUnannotatedCandidate
          - WorkspaceLoader_LoadAsync_FilteredRecursiveImport_SkipsRejectedFindsDeeperMatch
          - WorkspaceLoader_LoadAsync_FilteredImportWithMetadataInLaterFile_MatchesQualifiedAnnotation
          - WorkspaceLoader_LoadAsync_FilteredImportWithMetaclassKind_AdmitsMatchingKindOnly

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ImportScoping
        title: >-
          ReferenceResolver.ResolveAll shall scope an import to the namespace that declares it and
          the namespaces nested in it, so a sibling namespace does not resolve a name through it,
          shall apply the imports written at the root of a file to that file only (including when
          a top-level definition's own inherited members are looked up through a supertype that
          only that import reaches), and shall not re-export a private import.
        justification: |
          KerML 8.2.3.5.3 and 8.3.2.4: an import contributes memberships to the importing
          namespace only, and only public imports are visible to its importers. Collecting imports
          file-wide let `PkgB`'s `part q : X` resolve through `PkgA`'s `import A::*`.
        tests:
          - WorkspaceLoader_LoadAsync_ImportInSiblingPackage_DoesNotApplyToOtherPackage
          - WorkspaceLoader_LoadAsync_ImportInOuterPackage_AppliesToNestedPackage
          - WorkspaceLoader_LoadAsync_FileRootImport_AppliesToItsOwnFileOnly
          - WorkspaceLoader_LoadAsync_TopLevelSupertypeViaRootImport_ResolvesMembers
          - WorkspaceLoader_LoadAsync_SameTopLevelNameInTwoFiles_EachUsesItsOwnRootImports
          - WorkspaceLoader_LoadAsync_SameTopLevelNameInTwoFiles_GeneralTypesUseOwnRootImports
          - WorkspaceLoader_LoadAsync_PrivateImport_IsNotReExported

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-OwningNamespaceFirst
        title: >-
          ReferenceResolver.ResolveAll shall resolve a simple name to the element visible from the
          referencing element's own owning namespaces (innermost first, matching member names,
          member short names, and alias members) and its imports before any
          same-named element declared in an unrelated namespace or at the top level of another root
          namespace (including the standard library).
        justification: |
          SysML v2 name resolution looks in the owning namespace (and its imports) before outer
          scopes. Separate packages commonly reuse a simple name (e.g. one
          `DocumentationCoverageChecker` per subsystem package); resolving to the first
          same-named definition in the workspace would silently cross-wire those packages.
        tests:
          - WorkspaceLoader_LoadAsync_SameNamedDefsInSiblingPackages_ResolveToOwningPackage
          - WorkspaceLoader_LoadAsync_LocalNameShadowsGlobalLibraryName_ResolvesLocal
          - WorkspaceLoader_LoadAsync_LocalShortNameAndAlias_WinOverGlobalNames

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewDefinitionTyping
        title: >-
          ReferenceResolver.ResolveAll shall resolve a view usage's view definition reference into a
          Typing-kind SysmlEdge, or produce a Warning naming it when it does not resolve.
        justification: |
          The view usage inherits the view conditions and rendering of its view definition
          (SysML 7.26.2), which callers find through this edge.
        tests:
          - WorkspaceLoader_LoadAsync_ViewConditionsAndViewDefinition_Captured

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-CircularImport
        title: >-
          ReferenceResolver.ResolveAll shall detect circular import chains in the import
          graph and produce a Warning diagnostic for each detected cycle.
        justification: |
          Circular imports must be detected to avoid infinite loops in reference resolution.
          The cycle detection uses depth-first search with a traversal stack.
        tests:
          - WorkspaceLoader_LoadAsync_CircularImport_ProducesWarningNoInfiniteLoop

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewExposeResolution
        title: >-
          ReferenceResolver.ResolveAll shall resolve each of a view's ExposeMembers entries'
          QualifiedName (via GetExposedNames()) into an Expose-kind edge.
        justification: |
          `expose <name>;` is the only reference a view's body statements resolve into model
          content; resolving each entry's qualified name into an Expose-kind edge is the
          prerequisite for GeneralViewLayoutStrategy (via ExposeScopeResolver) to scope a
          rendered diagram to that content, and — Phase 2a — for ExposeScopeResolver to re-pair
          the resolved edge back to its originating ExposeMember for bracket-filter evaluation.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithBracketedFilterExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithPlainWildcardExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_OmgSafetyFeatureViewsFixture_ResolvesBracketedExpose
          - RenderSubsystem_ViewsWithDistinctExposeTargets_ProduceDifferingOutputsAndDiagnostic

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewExposeUnresolvedWarning
        title: >-
          ReferenceResolver.ResolveAll shall produce an unresolved-reference Warning diagnostic
          (with no corresponding edge) when a view's ExposeMembers entry cannot resolve —
          mirroring the existing SubjectName/EndpointA unresolved-reference diagnostic pattern.
        justification: |
          A bogus `expose <name>;` entry must be surfaced to the caller as model incompleteness,
          the same way an unresolved supertype or import name is surfaced, so the diagnostic
          signal for the render subsystem is genuinely useful.
        tests:
          - RenderSubsystem_ViewsWithDistinctExposeTargets_ProduceDifferingOutputsAndDiagnostic

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewRenderFilterNeverResolved
        title: >-
          ReferenceResolver.ResolveAll shall never inspect or resolve a view's RenderTargetName
          or FilterExpressionText: no edge is produced and no diagnostic is emitted for either,
          regardless of content.
        justification: |
          RenderTargetName names a rendering style/format per the SysML v2 grammar (e.g.
          `asTreeDiagram`, `asElementTable`), never model content — attempting to resolve it as a
          reference could only ever produce a false "Unresolved reference" diagnostic or
          coincidentally match an unrelated stdlib symbol of the same name (confirmed against the
          OMG test corpus, where every `render` member names a rendering-style identifier).
          FilterExpressionText is likewise raw source text, not a reference, and full filter
          expression evaluation is deferred future work. Excluding both from resolution removes
          that false-diagnostic risk while preserving the genuine unresolved-reference signal for
          a bogus `expose` entry.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - RenderSubsystem_OmgSafetyFeatureViewsCorpus_RendersAllNamedViewUsages

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-RedefinitionResolution
        title: >-
          ReferenceResolver.ResolveAll shall resolve a feature's RedefinedFeatureName into a
          Redefinition-kind edge by KerML 8.2.3.5.1 — the basic resolution repeated with each
          general type of the redefining feature's owning type as the local namespace, in turn,
          wherever those general types are declared — falling back, leniently, to ordinary
          resolution from the owning type (so a qualified target still resolves), never resolving
          to the redefining feature itself or to a private member of a general type (declared on
          it or inherited through another; a protected member can still be redefined), and
          producing an
          unresolved-reference Warning diagnostic (with no corresponding edge) when nothing
          resolves.
        justification: |
          Resolving RedefinedFeatureName into a Redefinition edge is the prerequisite for
          GeneralViewLayoutStrategy to render the hollow-triangle-crossbar marker, and the
          unresolved-reference diagnostic surfaces a bogus `redefines`/`:>>` target the same way
          an unresolved supertype or typing reference is surfaced. Per the SysML v2 spec, a
          `redefines`/`:>>` target's entire purpose is referencing a member the redefining
          feature *inherits* (typically declared on a supertype, or reachable only via the
          owner's own redefinition), not one declared or imported into the same lexical scope —
          the dominant shape across the OMG corpus (e.g. `RedefinitionExample.sysml`'s `smallEng
          redefines eng`, `1c-PartsTreeRedefinition.sysml`'s nested `frontAxle_c1 redefines
          frontAxle`). The bare shape `:>> mass;` creates a feature named `mass` in the owner, so
          ordinary resolution would otherwise find the redefining feature itself.
        tests:
          - WorkspaceLoader_LoadAsync_ResolvedRedefinition_RecordsRedefinitionEdge
          - WorkspaceLoader_LoadAsync_UnresolvedRedefinition_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_BareRedefinitionOfInheritedFeature_RecordsRedefinitionEdgeNoWarning
          - WorkspaceLoader_LoadAsync_RedefinitionExampleFixture_NoUnresolvedReferenceWarnings
          - WorkspaceLoader_LoadAsync_1cPartsTreeRedefinitionFixture_NoUnresolvedReferenceWarnings
          - WorkspaceLoader_LoadAsync_BareRedefinitionOfInheritedFeatureInLaterFile_Resolves
          - WorkspaceLoader_LoadAsync_RedefinitionQualifiedTargetOrOnlySelf_ResolvesLenientlyNeverToSelf
          - WorkspaceLoader_LoadAsync_RedefinitionOfPrivateInheritedMember_NoEdgeAndWarning
          - WorkspaceLoader_LoadAsync_RedefinitionOfPrivateDirectSupertypeMember_NoEdgeAndWarning
          - NameResolver_ResolveRedefinedFeature_PrivateMemberOfDirectGeneral_DoesNotResolve

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-DependencyCrossProduct
        title: >-
          ReferenceResolver.ResolveAll shall independently resolve every entry in a
          SysmlDependencyNode's FromNames and ToNames against the symbol table, emitting one
          Dependency-kind edge per resolved (from, to) pair (a cross product), and an
          unresolved-reference Warning for each name on either side that fails to resolve.
        justification: |
          The `dependency` grammar allows comma-separated client and supplier lists (e.g.
          `dependency a, b to c, d;`), each of which independently participates in the
          dependency relationship; per-pair resolution (rather than an all-or-nothing
          both-sides contract) ensures a single unresolvable name does not suppress edges for
          every other resolvable name, and per-name diagnostics correctly surface exactly which
          reference is bogus.
        tests:
          - WorkspaceLoader_LoadAsync_DependencyBinaryEnds_RecordsDependencyEdge
          - WorkspaceLoader_LoadAsync_DependencyCommaLists_RecordsCrossProductEdges
          - WorkspaceLoader_LoadAsync_DependencyUnresolvedEnd_ProducesWarningNoEdge
          - Dependency_OmgCorpusFixtures_ResolveExpectedEdges

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-BindingFeatureChain
        title: >-
          ReferenceResolver.ResolveAll shall resolve a "binding"-keyword SysmlConnectionNode's
          EndpointA/EndpointB via the same dotted-feature-chain walk used for
          "connection"/"message" endpoints, emitting a Binding-kind edge only when both
          endpoints resolve.
        justification: |
          A binding connector's endpoints (`bind A.x = B.y;`) are frequently dotted feature
          chains, identical in shape to a connect/message endpoint; reusing the existing
          feature-chain walk (rather than a separate resolution path) keeps the two-sided
          must-both-resolve contract consistent across every dotted-endpoint edge kind.
        tests:
          - WorkspaceLoader_LoadAsync_BindingDottedChain_RecordsBindingEdge
          - WorkspaceLoader_LoadAsync_BindingUnresolvedEnd_ProducesWarningNoEdge
          - Binding_OmgCorpusFixture_ResolvesBindingEdgesViaImplicitRedefinitionNames

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-InheritedTransitionSource
        title: >-
          ReferenceResolver.ResolveFeatureChains shall, when resolving a SysmlTransitionNode's
          Source, fall back to a narrowly-scoped inherited-action-member lookup
          (TryResolveInheritedActionMember, reusing FindMemberInAncestorChain and
          FindMemberInTypeHierarchy) after the standard feature-chain resolution fails, only for
          the Source side — never the Target side.
        justification: |
          A transition's implicit source (e.g. `first start then off;`, or the bare `start`
          feature an attached transition's synthesized Source implicitly names) commonly
          references a pseudostate feature the enclosing state/action inherits from its
          supertype rather than declares itself; the standard namespace/import-scoped lookup
          cannot see inherited members, so without this fallback every such transition produced
          a false "Unresolved reference" diagnostic and no Transition edge, even though the
          model is semantically valid per the SysML v2 spec. As a narrow, deliberately
          hardcoded last resort — only for the literal names "start"/"done", and only when the
          enclosing node is a state- or action-keyword feature/definition — the fallback also
          resolves against the standard library's `Actions::Action` direct children when no
          user-declared supertype supplies the member, covering the common case of a `state def`
          with no explicit `:>` clause (whose implicit ultimate supertype is `Actions::Action`).
          This is intentionally not a general implicit-generalization/default-supertype resolver:
          it is scoped to Transition Source resolution only, and to the two well-known
          pseudostate-derived names, consistent with how the ROADMAP itself scopes this gap.
        tests:
          - WorkspaceLoader_LoadAsync_TransitionSourceStartFeature_ResolvesToStdlibActionMember
          - Transition_OmgCorpusFixture_ResolvesAllStatesAndTransitions

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-EdgeRawReference
        title: >-
          ReferenceResolver.ResolveAll shall record on each resolved single-reference edge
          (supertype, typing, redefinition, import, verify, expose, and metadata-type, including a
          view usage's view definition) the reference text exactly as written in
          `SysmlEdge.RawReference`, and shall leave it null on the two-ended edge kinds (satisfy,
          allocate, dependency, connect, binding, transition), so a reference that did not resolve
          is never confused with another reference of the same declaration that resolved to the
          same target.
        justification: |
          Supertype edges omit unresolved references, so the edge list is not positionally
          aligned with the declaration's reference list. Without an identity on the edge a
          consumer can only guess the pairing (for example by name suffix), which wrongly drew an
          edge for an unresolved `X` listed beside an alias that resolved to `P::X`. The reference
          text is an exact key because the same text in the same scope always resolves to the same
          target. A two-ended edge has no single reference text, so it carries none.
        tests:
          - WorkspaceLoader_LoadAsync_SupertypeUnresolvedBeforeAlias_OnlyAliasEdgeCarriesRawReference
          - WorkspaceLoader_LoadAsync_ResolvedEdges_RecordRawReferenceText
          - WorkspaceLoader_LoadAsync_TwoEndedEdges_HaveNoRawReference

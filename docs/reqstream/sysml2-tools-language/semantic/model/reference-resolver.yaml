---
# ReferenceResolver Requirements
#
# PURPOSE:
# - Define requirements for the ReferenceResolver unit (Semantic Model subsystem)

sections:
  - title: ReferenceResolver Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-Resolve
        title: >-
          ReferenceResolver.ResolveAll shall check each supertype name referenced by
          AST nodes against the symbol table and produce a Warning for any unresolved name —
          for a usage/feature node, falling back to the same bare-name supertype/redefinition
          ancestor-chain walk used for RedefinedFeatureName when the standard lookup fails,
          since a usage-level `subsets`/`:>` clause commonly names an inherited member.
        justification: |
          Unresolved references indicate model incompleteness. Reporting as Warnings allows
          the caller to continue analysis and provide partial results. A usage-level
          `subsets`/`:>` clause (e.g. `part frontWheel_1 subsets frontWheel = ...;`) is, per the
          SysML v2 spec, commonly a bare reference to a member the owner inherits rather than
          declares itself — the same dominant shape as a bare `redefines` reference — so
          omitting the ancestor-chain fallback here would reintroduce the same false-warning
          defect this fix addresses for RedefinedFeatureName. The fallback is skipped for
          definition-level SupertypeNames (`part def X :> Y`), which name the supertype directly.
        tests:
          - WorkspaceLoader_LoadAsync_UnresolvedReference_ProducesWarning
          - WorkspaceLoader_LoadAsync_1cPartsTreeRedefinitionFixture_NoUnresolvedReferenceWarnings

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-CircularImport
        title: >-
          ReferenceResolver.ResolveAll shall detect circular import chains in the import
          graph and produce a Warning diagnostic for each detected cycle.
        justification: |
          Circular imports must be detected to avoid infinite loops in reference resolution.
          The cycle detection uses depth-first search with a traversal stack.
        tests:
          - WorkspaceLoader_LoadAsync_CircularImport_ProducesWarningNoInfiniteLoop

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewExposeResolution
        title: >-
          ReferenceResolver.ResolveAll shall resolve each of a view's ExposedNames entries into
          an Expose-kind edge.
        justification: |
          `expose <name>;` is the only reference a view's body statements resolve into model
          content; resolving each ExposedNames entry into an Expose-kind edge is the
          prerequisite for GeneralViewLayoutStrategy to scope a rendered diagram to that content.
        tests:
          - WorkspaceLoader_LoadAsync_ViewUsageWithExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithBracketedFilterExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_ViewUsageWithPlainWildcardExpose_RecordsExposeEdge
          - WorkspaceLoader_LoadAsync_OmgSafetyFeatureViewsFixture_ResolvesBracketedExpose
          - RenderSubsystem_ViewsWithDistinctExposeTargets_ProduceDifferingOutputsAndDiagnostic

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewExposeUnresolvedWarning
        title: >-
          ReferenceResolver.ResolveAll shall produce an unresolved-reference Warning diagnostic
          (with no corresponding edge) when a view's ExposedNames entry cannot resolve —
          mirroring the existing SubjectName/EndpointA unresolved-reference diagnostic pattern.
        justification: |
          A bogus `expose <name>;` entry must be surfaced to the caller as model incompleteness,
          the same way an unresolved supertype or import name is surfaced, so the diagnostic
          signal for the render subsystem is genuinely useful.
        tests:
          - RenderSubsystem_ViewsWithDistinctExposeTargets_ProduceDifferingOutputsAndDiagnostic

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-ViewRenderFilterNeverResolved
        title: >-
          ReferenceResolver.ResolveAll shall never inspect or resolve a view's RenderTargetName
          or FilterExpressionText: no edge is produced and no diagnostic is emitted for either,
          regardless of content.
        justification: |
          RenderTargetName names a rendering style/format per the SysML v2 grammar (e.g.
          `asTreeDiagram`, `asElementTable`), never model content — attempting to resolve it as a
          reference could only ever produce a false "Unresolved reference" diagnostic or
          coincidentally match an unrelated stdlib symbol of the same name (confirmed against the
          OMG test corpus, where every `render` member names a rendering-style identifier).
          FilterExpressionText is likewise raw source text, not a reference, and full filter
          expression evaluation is deferred future work. Excluding both from resolution removes
          that false-diagnostic risk while preserving the genuine unresolved-reference signal for
          a bogus `expose` entry.
        tests:
          - WorkspaceLoader_LoadAsync_ViewRenderTarget_CapturedRawNeverResolvedNoDiagnostic
          - WorkspaceLoader_LoadAsync_ViewFilterExpression_CapturesTextVerbatimNoEdge
          - RenderSubsystem_OmgSafetyFeatureViewsCorpus_RendersAllNamedViewUsages

      - id: SysML2Tools-Language-Semantic-Model-ReferenceResolver-RedefinitionResolution
        title: >-
          ReferenceResolver.ResolveAll shall resolve a feature's RedefinedFeatureName against
          the symbol table into a Redefinition-kind edge — trying the standard
          namespace/import-scoped lookup first, then falling back to a supertype/redefinition
          ancestor-chain walk for the dominant bare-name-referencing-an-inherited-member case —
          and produce an unresolved-reference Warning diagnostic (with no corresponding edge)
          only when neither strategy resolves it.
        justification: |
          Resolving RedefinedFeatureName into a Redefinition edge is the prerequisite for
          GeneralViewLayoutStrategy to render the hollow-triangle-crossbar marker, and the
          unresolved-reference diagnostic surfaces a bogus `redefines`/`:>>` target the same way
          an unresolved supertype or typing reference is surfaced. The plain namespace/import
          lookup used for FeatureTyping is not sufficient here: per the SysML v2 spec, a
          `redefines`/`:>>` target's entire purpose is referencing a member the redefining
          feature *inherits* (typically declared on a supertype, or reachable only via the
          owner's own already-resolved Redefinition edge), not one declared or imported into the
          same lexical scope — the dominant shape across the OMG corpus (e.g.
          `RedefinitionExample.sysml`'s `smallEng redefines eng`,
          `1c-PartsTreeRedefinition.sysml`'s nested `frontAxle_c1 redefines frontAxle`). The
          ancestor-chain fallback (`TryResolveBareRedefinition`/`FindMemberInAncestorChain`) is
          additive and only activates once the standard lookup fails, so previously-successful
          qualified/scoped resolutions are unaffected.
        tests:
          - WorkspaceLoader_LoadAsync_ResolvedRedefinition_RecordsRedefinitionEdge
          - WorkspaceLoader_LoadAsync_UnresolvedRedefinition_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_BareRedefinitionOfInheritedFeature_RecordsRedefinitionEdgeNoWarning
          - WorkspaceLoader_LoadAsync_RedefinitionExampleFixture_NoUnresolvedReferenceWarnings
          - WorkspaceLoader_LoadAsync_1cPartsTreeRedefinitionFixture_NoUnresolvedReferenceWarnings

---
# NameResolver Unit Requirements
#
# PURPOSE:
# - Define requirements for the NameResolver unit (Semantic Model subsystem)
# - NameResolver resolves qualified names per KerML 8.2.3.5 for ReferenceResolver (internal
#   resolving mode) and for callers (e.g. layout strategies) that hold raw reference text the
#   semantic model did not already resolve

sections:
  - title: NameResolver Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-Model-NameResolver-FullResolution
        title: >-
          NameResolver shall resolve a simple name by local resolution in the given namespace, then
          in each owning namespace outward, then in the global namespace (the top-level elements of
          every loaded root namespace), so a name declared in the owning package wins over a
          same-named element in an unrelated package.
        justification: |
          KerML 8.2.3.5.4 (Full Resolution). Packages commonly reuse a simple name for distinct
          elements; resolving to the first global match would cross-wire them.
        tests:
          - NameResolver_Resolve_SameNameInSiblingPackages_ResolvesOwningPackageFirst

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-Candidates
        title: >-
          NameResolver shall offer a qualified-name resolution that reports every distinct element
          the name can denote (none, one, or several), without changing how references resolve.
        justification: |
          Local resolution returns the first match among imported memberships, so a facade that
          publicly imports two namespaces exposing the same name resolves by import order. A
          caller that must not guess (the Query element lookup) needs the ambiguity visible.
        tests:
          - NameResolver_ResolveCandidates_NameFromTwoImports_ReportsEveryDistinctElement

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-LocalResolution
        title: >-
          NameResolver's local resolution in a namespace shall consider its owned memberships,
          its imported memberships (membership and namespace imports, recursive or not, and
          filtered imports through an optional filter predicate), and — for a type — the
          non-private memberships inherited from its general types (declared and implicit, see
          the ImplicitSpecialization and InheritedLookup requirements), matching each
          membership's name, short name, or alias name.
        justification: |
          KerML 8.2.3.5.3 (Local and Visible Resolution): the local resolution of a name
          includes owned, imported, and (for a Type) inherited memberships, by member name and
          member short name. Aliases are memberships with their own names (KerML 7.2.5.3).
        tests:
          - NameResolver_Resolve_InheritedMember_ResolvesThroughSupertype
          - NameResolver_Resolve_AliasAndShortName_ResolveToTheirElement
          - NameResolver_Resolve_ImportedMember_HonorsImportVisibility
          - NameResolver_Resolve_FilteredRecursiveImport_SkipsRejectedCandidate
          - NameResolver_GeneralTypes_PartiallyResolvedSupertypes_IncludesEveryGeneralType
          - NameResolver_Resolve_MembershipImportedAlias_ResolvesItsShortName

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-VisibleResolution
        title: >-
          NameResolver shall resolve the first segment of a qualified name by full resolution and
          each later segment by visible resolution — public owned memberships, memberships
          imported by public imports, and public inherited memberships only — so a private member
          or a privately imported member does not resolve through a qualified name from outside.
        justification: |
          KerML 8.2.3.5.1 step 3 and 8.2.3.5.3 (visible resolution). Honoring visibility keeps
          the tool's results consistent with the language's encapsulation rules.
        tests:
          - NameResolver_Resolve_PrivateMemberViaQualifiedName_DoesNotResolve
          - NameResolver_Resolve_ImportedMember_HonorsImportVisibility
          - NameResolver_Resolve_InheritedMember_ResolvesThroughSupertype
          - NameResolver_Resolve_SpecializedBodyMembers_HonorVisibilityAndShortName

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-RedefinedFeature
        title: >-
          NameResolver shall resolve a redefined-feature reference with each general type of the
          redefining feature's owning type (declared and implicit) as the local namespace, in
          turn, until one resolves, without excluding members the general types' own features
          redefine, and shall resolve an unnamed redefinition of a member of an enclosing or
          sibling feature from the owning type's own owner when ordinary resolution finds only the
          redefining feature itself.
        justification: |
          KerML 8.2.3.5.1: the basic resolution process is repeated against the owning type's
          general types for a Redefinition's redefinedFeature. A redefinition that takes its
          redefined feature's name is owned under that name, so ordinary resolution finds only
          itself; the member it redefines belongs to an enclosing feature or type. Library
          associations routinely redefine a name that a general type's own feature already
          redefined, so redefinition targets are resolved without the redefined-member exclusion.
        tests:
          - NameResolver_ResolveRedefinedFeature_ResolvesAgainstGeneralTypes
          - NameResolver_ResolveRedefinition_UnnamedRedefinitionOfEnclosingMember_Resolves
          - NameResolver_ResolveRedefinition_OnlySelf_StaysUnresolved
          - NameResolver_InheritedLookup_EnclosingTypedUsage_TypeMembersResolveForNestedRedefinition

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-ResolvingMode
        title: >-
          NameResolver's resolving mode (used by ReferenceResolver while edges are still being
          attached) shall derive every type's general types only from its raw references
          (supertype names, typing, view definition, and redefined feature), independent of
          resolved edges and of lookup order, shall terminate on specialization cycles, shall
          apply the imports written at the root of a file to that file's top-level declarations,
          and shall never resolve a redefinition to the redefining feature itself.
        justification: |
          A name resolver that reads resolved edges answers differently depending on which nodes
          the semantic pass has already visited, and caches those answers. Deriving general types
          from raw references makes the answers order-independent, so an inherited member
          resolves in a single pass wherever its ancestor is declared, and the lookup cache stays
          valid as edges appear.
        tests:
          - NameResolver_ResolvingMode_GeneralTypes_IgnoresResolvedEdges
          - NameResolver_ResolvingMode_Resolve_SupertypeDeclaredLater_IsOrderIndependent
          - NameResolver_ResolvingMode_GeneralTypes_SpecializationCycle_Terminates
          - NameResolver_ResolvingMode_Resolve_FileRootImport_AppliesToRegisteredDeclarations
          - NameResolver_ResolvingMode_Resolve_SuppliedFileRootImports_OverrideRegisteredByName
          - NameResolver_ResolveRedefinition_ExcludesRedefiningFeatureAndFallsBack

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-ImplicitSpecialization
        title: >-
          NameResolver shall treat every definition kind and usage kind as implicitly specializing
          (or subsetting) the standard library type its kind names — for example a part definition
          as Parts::Part, a part usage as Parts::parts, a state definition as States::StateAction,
          a variant as its owning variation, and a usage typed by a conjugated port definition as
          that port definition (including succession flows as Transfers::flowTransfersBefore and
          connection-like usages as their Connections/Interfaces/Allocations/Flows library
          features) — consulting these general types after the declared ones, skipping
          any that is the element itself, already declared, or absent from the loaded declarations,
          and shall never materialize them as edges or expose them through the public
          GeneralTypes.
        justification: |
          KerML and SysML give every element default general types (KerML 7.3.4, SysML 7.x/8.x),
          so library members such as self, start, shape or result are visible in an element that
          writes no supertype. Keeping them out of SysmlEdge and GeneralTypes means renderers,
          queries and exports continue to show exactly the relationships the model declares.
          Every table target is guarded against standard library drift.
        tests:
          - NameResolver_ImplicitSpecialization_PerKind_AddsLibraryGeneralType
          - NameResolver_ImplicitSpecialization_PerKind_MemberResolves
          - NameResolver_ImplicitSpecialization_TargetsExistInVendoredStdlib
          - NameResolver_ImplicitSpecialization_NoStdlibSeed_NoEffect
          - NameResolver_ImplicitSpecialization_LibraryTypeDoesNotSpecializeItself
          - NameResolver_ImplicitSpecialization_ExplicitSupertypeWinsOverImplicit
          - NameResolver_ImplicitSpecialization_CyclesTerminate
          - NameResolver_ImplicitSpecialization_NotMaterialized_AsEdges
          - NameResolver_InheritedLookup_VariantSeesVariationMembers
          - NameResolver_InheritedLookup_ConjugatedPortTypeMembersVisible
          - NameResolver_ResolvingMode_ImplicitSpecialization_IsOrderIndependent
          - GeneralViewLayoutStrategy_BuildLayout_ImplicitSpecializations_DrawNoLibraryTypesOrSpecializationLines
          - Hierarchy_ImplicitSpecializations_AreNotReported
          - SemanticGalleryModels_Edges_MatchBaselineGolden

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-InheritedLookup
        title: >-
          NameResolver's inherited lookup shall be transitive through explicit and implicit general
          types, shall admit protected and public members (not private) to a specialization and
          public members only to a qualified name, and shall not inherit a member that a named
          feature owned by the specializing type redefines (the name then falls through to the
          enclosing namespace).
        justification: |
          KerML 8.2.3.5.3 defines a type's inherited memberships over all its general types with
          visibility restrictions, and Type::removeRedefinedFeatures removes redefined features
          from them. Without transitivity and the exclusion, a name would resolve to a member the
          type has redefined away, or fail to resolve through a library ancestor.
        tests:
          - NameResolver_InheritedLookup_Transitive_ThroughExplicitAndImplicitGenerals
          - NameResolver_InheritedLookup_ProtectedMemberVisibleToSpecialization_PrivateNot
          - NameResolver_InheritedLookup_RedefinitionHidesRedefinedMember
          - NameResolver_InheritedLookup_RedefinitionWithSameName_ResolvesOwned

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-FeatureChain
        title: >-
          NameResolver shall resolve a dotted feature chain (a.b.c) by resolving its first segment
          by full resolution from the local namespace and each later segment by visible resolution
          in the previous segment's feature — through the feature's own inline members first and
          then everything it inherits (explicit and implicit general types, transitively, including
          a usage's subsetting and redefinition, the members of a conjugated port type, and aliases
          followed to their targets) — admitting public members only after the first segment,
          splitting only on dots outside single quotes, resolving a redefinition target written as a
          chain the same way, reporting the chain's instance path (the first segment's element then
          the simple name of each later segment's element) for callers that key relationships by
          feature instance, resolving no part of a chain when any segment fails, and terminating on
          specialization cycles that run through a chain.
        justification: |
          KerML 8.2.3.5.1 (Feature Chain resolution): a feature chain is resolved segment by
          segment, each later segment by visible resolution in the feature of the previous one,
          which inherits through its types. The OMG corpus connects, binds, allocates, satisfies and
          subsets through such chains. The instance path keeps general-view connectors and the
          connections query keyed by the feature as written, not by the type that declares it.
        tests:
          - NameResolver_FeatureChain_ThroughSubsettingUsage_ResolvesInheritedMember
          - NameResolver_FeatureChain_ThroughAlias_ResolvesAliasTarget
          - NameResolver_FeatureChain_ThroughConjugatedPortType_ResolvesPortMembers
          - NameResolver_FeatureChain_QuotedSegments_SplitOnDotsOutsideQuotes
          - NameResolver_FeatureChain_PrefersOwnedInlineMemberOverTypeMember
          - NameResolver_FeatureChain_PrivateAndProtectedThroughSubsettingUsage_NotVisible
          - NameResolver_FeatureChain_ThreeLevels_MixedDirectTypeAndSpecialization
          - NameResolver_FeatureChain_UnresolvedSegment_DoesNotResolve
          - NameResolver_FeatureChain_SpecializationCycle_Terminates
          - NameResolver_FeatureChain_QualifiedFirstSegment_Resolves
          - NameResolver_ResolveRedefinedFeature_Chain_ResolvesThroughFirstSegment

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-QuoteEquivalence
        title: >-
          NameResolver shall treat a name written with its enclosing single quotes and the same
          name written without them as the same name when matching owned and imported memberships,
          alias short names, and top-level declarations.
        justification: |
          KerML 8.2.2.2.1: a quoted name denotes the same name as its unquoted form. A model that
          declares package PowerTrain and imports 'PowerTrain' is valid.
        tests:
          - NameResolver_Resolve_QuotedAndUnquotedSimpleName_AreEquivalent

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-ReferenceSubsettingLookup
        title: >-
          NameResolver shall treat the target of a usage's reference subsetting (`::>`/`references`,
          or the referenced feature of `perform`, `include` and `assert`) as a general type for
          member lookup, without adding an edge or a diagnostic, and shall not let a general-type
          reference resolve to the usage itself: a usage named like the feature it references finds
          that feature from its owner's own owner.
        justification: |
          Members of a performed or referenced feature (`perform vehicleMassTest.collectData { in
          part :>> testVehicle; }`) are visible through the reference; a `perform`/`assert` usage
          lives in the namespace of the feature it names, so it would otherwise find itself.
        tests:
          - NameResolver_ReferenceSubsetting_IsLookupGeneralType
          - AstBuilder_PerformAndAssertSameNameAsReferenced_DoNotCollide

      - id: SysML2Tools-Language-Semantic-Model-NameResolver-BehaviorImplicitSpecialization
        title: >-
          NameResolver shall add to the implicit general types of a transition usage the library's
          transition action, of `perform`, `exhibit`, `include` and `assert constraint` usages the
          library's actions, state actions, use cases and constraint checks, and of `timeslice` and
          `snapshot` usages the library's time slices and snapshots, and shall resolve a redefinition
          against every redefinition target of a feature.
        justification: |
          Members such as a transition's `accepter` and `effect` or a portion's `start` are
          declared by library types the elements implicitly specialize; a feature redefining two
          features inherits members from both.
        tests:
          - NameResolver_Transition_ImplicitlySpecializesTransitionActions
          - NameResolver_ImplicitSpecialization_NewUsageKinds_AddLibraryGeneralType
          - NameResolver_PortionUsage_ImplicitSpecialization_MemberResolves
          - AstBuilder_MultipleRedefinitions_ResolvesEveryTargetAndInheritsFromSecond
          - NameResolver_ImplicitSpecialization_PerKind_MemberResolves

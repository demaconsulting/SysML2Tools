---
# WorkspaceLoader Unit Requirements
#
# PURPOSE:
# - Define requirements for the WorkspaceLoader unit
# - WorkspaceLoader is the public entry point for semantic loading

sections:
  - title: WorkspaceLoader Unit Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-Load
        title: >-
          WorkspaceLoader.LoadAsync shall parse each user file asynchronously on the thread pool.
        justification: |
          Parallel parsing reduces wall-clock time for multi-file workspaces: WorkspaceLoader
          parses each user file asynchronously on the thread pool and merges the results. The
          pre-compiled standard library is supplied to LoadAsync as a ready seed symbol table by
          StdlibProvider; WorkspaceLoader does not parse or cache the stdlib itself.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration
          - WorkspaceLoader_LoadAsync_NestedPackages_RegistersQualifiedNames

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-FileError
        title: >-
          WorkspaceLoader.LoadAsync shall produce an Error diagnostic when a user file
          cannot be read from disk.
        justification: |
          A file-read failure prevents the workspace from being built for that file.
          Reporting it as an Error diagnostic allows callers to surface the problem to users.
        tests:
          - WorkspaceLoader_LoadAsync_UnreadableFile_ProducesErrorDiagnostic

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-StrictUnresolved
        title: >-
          WorkspaceLoader.LoadAsync shall accept a strictUnresolved argument, equivalent to false
          when the overload without it is called, that makes the unresolved-reference diagnostics
          of the user files Errors instead of Warnings, without changing their message or position,
          without affecting circular-import or cyclic-specialization diagnostics, and without
          producing diagnostics from the standard library seed; the default severity shall be a
          single internal constant so that it can be changed in one place.
        justification: |
          Callers that gate on model validity need an unresolved reference to fail the load,
          while the default keeps incomplete or work-in-progress models usable and reports the
          reference as a Warning. The standard library seed is pre-resolved, so user models do
          not inherit its known unresolved references. A single constant for the default
          severity lets the default move to Error later without touching the callers.
        tests:
          - WorkspaceLoader_LoadAsync_StrictUnresolved_UnresolvedReferenceKinds_ProduceErrors
          - WorkspaceLoader_LoadAsync_CircularImportAndCyclicSpecialization_RemainWarnings
          - WorkspaceLoader_LoadAsync_StdlibReferences_ProduceNoDiagnostics
          - WorkspaceLoader_DefaultUnresolvedSeverity_IsWarning

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-BinaryCompatibleLoadAsync
        title: >-
          WorkspaceLoader.LoadAsync shall continue to expose the public two-parameter overload
          (IEnumerable of string, optional SymbolTable, defaulting to null) alongside the
          strictUnresolved overload, with the two-parameter overload reporting unresolved
          references as Warnings, so that consumers compiled against earlier releases keep working.
        justification: |
          WorkspaceLoader is part of the published library surface. Adding an optional parameter
          to an existing public method changes its metadata signature, so a consumer compiled
          against an earlier release would fail with a MissingMethodException. Keeping the original
          signature as a forwarding overload preserves binary compatibility while the new overload
          carries the strict opt-in.
        tests:
          - WorkspaceLoader_LoadAsync_OriginalTwoParameterOverload_ReportsUnresolvedAsWarning

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-DeterministicOrder
        title: >-
          WorkspaceLoader.LoadAsync shall process the user files in a canonical order, the ordinal
          order of their full paths with directory separators normalized to '/' (and the source
          order within a file), whatever order the caller supplies them in, so that when several
          declarations share a root-level name the first one in that order is used and the later
          ones are ignored, and the declarations, file list and diagnostics are identical on every
          platform.
        justification: |
          KerML leaves unspecified which of several same-named root-level declarations is meant.
          Without a stable rule the result would depend on the caller's file order (for example a
          platform's directory enumeration order), so identical inputs would give different
          diagnostics on Windows and Linux. A canonical processing order makes the declaration
          that is used, and therefore every diagnostic, deterministic.
        tests:
          - WorkspaceLoader_LoadAsync_DuplicateTopLevelName_IsIndependentOfFileOrder
          - WorkspaceLoader_LoadAsync_SameRootPackageInTwoFiles_IsIndependentOfFileOrder
          - SemanticOmgModels_StrictUnresolved_IndependentOfFileOrder

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-DuplicateRootDeclaration
        title: >-
          WorkspaceLoader.LoadAsync shall report a Warning at the name of every named
          root-level declaration (a package, a definition, a usage, or an alias; a `namespace` or
          a named `comment` is not detected) in any user file (including a second declaration in
          the same file), whose name, quotes ignored, an earlier root-level declaration in canonical order
          already uses, naming the file and position of the declaration that is used; shall exclude
          the later declaration entirely from the workspace, so that none of its members is merged
          into the earlier declaration and no diagnostic originates from inside it; shall not
          report a path supplied more than once; and shall not treat a user declaration named like a
          standard-library package as a duplicate.
        justification: |
          The members of a namespace must have distinct names (KerML 8.3.2.4), the global
          namespace holds every root-level member, and a SysML package cannot be reopened in another
          file (SysML 8.2.2.5.1), so a second root-level declaration of a name is an error in the
          model; the OMG Pilot Implementation reports it as "Duplicate of other owned member name".
          Merging the declarations instead made a package's imports and aliases depend on which
          file declared it first (issue #144), silently dropped a definition that shared its
          name with a package (issues #139 and #146), and gave the same model different results
          under different file layouts. Ignoring the later declaration as a whole is deterministic
          and keeps the workspace consistent, and a Warning, also in strict mode, tells the author
          exactly which declaration is ignored without turning unresolved-reference strictness
          into a naming check. The standard library is not part of the comparison, because a user
          package of that name is an established extension of it.
        tests:
          - WorkspaceLoader_LoadAsync_SameRootPackageInTwoFiles_WarnsAtLaterDeclarationNamingFirstFile
          - WorkspaceLoader_LoadAsync_SameRootPackageInTwoFiles_DoesNotMergeMembers
          - WorkspaceLoader_LoadAsync_SplitPackageWithWildcardImport_ReportsOnlyTheDuplicate
          - WorkspaceLoader_LoadAsync_SplitPackageWithNamedImports_ReportsOnlyTheDuplicate
          - WorkspaceLoader_LoadAsync_PackageAndPartDefWithSameName_WarnsAndFirstFileWins
          - WorkspaceLoader_LoadAsync_SameNameTwiceInOneFile_WarnsAtSecondDeclaration
          - WorkspaceLoader_LoadAsync_QuotedAndUnquotedSameName_AreDuplicates
          - WorkspaceLoader_LoadAsync_RootAliasAndPackageWithSameName_WarnsAndFirstFileWins
          - WorkspaceLoader_LoadAsync_TwoRootAliasesWithSameName_WarnsAtSecondAlias
          - WorkspaceLoader_LoadAsync_ShortNameEqualToDeclaredName_WarnsAtDeclaredName
          - WorkspaceLoader_LoadAsync_DuplicateQuotedNameWithSpace_MessageShowsNameOnce
          - WorkspaceLoader_LoadAsync_SamePathSuppliedTwice_ReportsNoDuplicate
          - WorkspaceLoader_LoadAsync_DistinctRootNames_ReportNoDuplicate
          - WorkspaceLoader_LoadAsync_UserPackageNamedLikeStdlibPackage_MembersAreNotStdlibOrigin

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-StdlibOrigin
        title: >-
          WorkspaceLoader.LoadAsync shall record the standard-library origin of an element by its
          membership in the seed symbol table, never by its name, so that a user element in a
          package named like a standard-library package is not reported as standard library.
        justification: |
          Renderers, the query command and the export command hide standard-library elements by
          consulting SysmlWorkspace.StdlibNames. Deciding origin from the seed (and not from a list
          of standard-library root-package names) keeps a user package such as Parts visible while the
          real standard-library members of Parts stay hidden.
        tests:
          - WorkspaceLoader_LoadAsync_UserPackageNamedLikeStdlibPackage_MembersAreNotStdlibOrigin

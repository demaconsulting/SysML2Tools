---
# WorkspaceLoader Unit Requirements
#
# PURPOSE:
# - Define requirements for the WorkspaceLoader unit
# - WorkspaceLoader is the public entry point for semantic loading

sections:
  - title: WorkspaceLoader Unit Requirements
    requirements:
      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-Load
        title: >-
          WorkspaceLoader.LoadAsync shall parse each user file asynchronously on the thread pool.
        justification: |
          Parallel parsing reduces wall-clock time for multi-file workspaces: WorkspaceLoader
          parses each user file asynchronously on the thread pool and merges the results. The
          pre-compiled standard library is supplied to LoadAsync as a ready seed symbol table by
          StdlibProvider; WorkspaceLoader does not parse or cache the stdlib itself.
        tests:
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration
          - WorkspaceLoader_LoadAsync_NestedPackages_RegistersQualifiedNames

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-FileError
        title: >-
          WorkspaceLoader.LoadAsync shall produce an Error diagnostic when a user file
          cannot be read from disk.
        justification: |
          A file-read failure prevents the workspace from being built for that file.
          Reporting it as an Error diagnostic allows callers to surface the problem to users.
        tests:
          - WorkspaceLoader_LoadAsync_UnreadableFile_ProducesErrorDiagnostic

      - id: SysML2Tools-Language-Semantic-WorkspaceLoader-StdlibOrigin
        title: >-
          WorkspaceLoader.LoadAsync shall record the standard-library origin of an element by its
          membership in the seed symbol table, never by its name, so that a user element in a
          package named like a standard-library package is not reported as standard library.
        justification: |
          Renderers, the query command and the export command hide standard-library elements by
          consulting SysmlWorkspace.StdlibNames. Deciding origin from the seed (and not from a list
          of standard-library root-package names) keeps a user package such as Parts visible while the
          real standard-library members of Parts stay hidden.
        tests:
          - WorkspaceLoader_LoadAsync_UserPackageNamedLikeStdlibPackage_MembersAreNotStdlibOrigin

---
# SysML2Tools Language Library System-Level Requirements (Phase 5 Stub)
#
# PURPOSE:
# - Define system-level requirements for the DemaConsulting.SysML2Tools.Language library
# - Language library provides: ANTLR parser, SysmlNode AST types, AstBuilder, WorkspaceParser,
#   SymbolTable, ReferenceResolver, SupertypeWalker, SysmlEdge, SemanticIndex, SysmlAnnotation,
#   WorkspaceLoader, AstSerializer/AstDeserializer

sections:
  - title: SysML2Tools Language Requirements
    requirements:
      - id: SysML2Tools-Language-Parsing
        title: >-
          The Language library shall parse SysML v2 source strings and return syntax
          diagnostics with file path, line number, and column offset.
        justification: |
          Providing a stdlib-agnostic SysML v2 parser as a reusable library allows tools,
          tests, and build-time generators to parse SysML syntax without depending on any
          particular standard library version.
        tests:
          - ParseSource_EmptyFile_NoErrors
          - ParseSource_InvalidSyntax_ReportsError

      - id: SysML2Tools-Language-SemanticLoading
        title: >-
          The Language library shall build a semantic workspace from provided SysML v2
          files, optionally seeded with a pre-populated symbol table.
        justification: |
          A seeded loading API decouples the Language library from any specific standard
          library, enabling callers to supply a pre-compiled stdlib symbol table (or none
          at all) without recompiling the Language library.
        tests:
          - WorkspaceLoader_LoadAsync_NoFiles_ReturnsNonNullWorkspace
          - WorkspaceLoader_LoadAsync_SinglePackage_RegistersDeclaration

      - id: SysML2Tools-Language-AstSerialization
        title: >-
          The Language library shall serialize a SymbolTable and diagnostics to a binary
          representation and faithfully deserialize them, preserving all node types,
          qualified names, supertype lists, and import names.
        justification: |
          Round-trip serialization enables the build-time StdlibGen tool to write a
          pre-compiled stdlib.bin and the runtime StdlibProvider to deserialize it,
          eliminating the 25-second cold-start parse at application launch.
        tests:
          - Serialize_EmptyTable_RoundTrips
          - Serialize_AllNodeTypes_RoundTrip
          - Serialize_Diagnostics_RoundTrip
          - Serialize_SupertypeAndImportedNames_Preserved

      - id: SysML2Tools-Language-ReverseIndex
        title: >-
          The Language library shall persist resolved supertype, feature-typing, and import
          references as edges on each AST node and expose a reverse-lookup index over all
          resolved edges via the loaded workspace.
        justification: |
          A persisted, queryable reverse index over resolved qualified-name references is the
          foundational data structure required by the `query` command's uses/used-by/impact/
          hierarchy verbs, avoiding a re-resolution pass for every query invocation.
        tests:
          - WorkspaceLoader_LoadAsync_ResolvedSupertype_RecordsSupertypeEdge
          - WorkspaceLoader_LoadAsync_ResolvedFeatureTyping_RecordsTypingEdge
          - WorkspaceLoader_LoadAsync_UnresolvedFeatureTyping_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_WildcardImport_RecordsImportEdge
          - WorkspaceLoader_LoadAsync_NamedImport_RecordsImportEdge
          - WorkspaceLoader_LoadAsync_SupertypeAcrossEnclosingNamespace_RecordsResolvedTargetName
          - WorkspaceLoader_LoadAsync_UnresolvedImport_ProducesWarningNoCrash
          - WorkspaceLoader_LoadAsync_MultiKindFixtureModel_IndexAnswersIncomingAndOutgoingQueries

      - id: SysML2Tools-Language-AnnotationCapture
        title: >-
          The Language library shall capture comment (`comment`) and documentation (`doc`)
          annotating-element free text onto the AST node it lexically annotates, preserving
          the text verbatim and in source order.
        justification: |
          SysML v2 comment/documentation text is fully parsed by the ANTLR grammar today but
          silently dropped by the AST builder. Capturing it onto each node is the foundational
          data required by the forthcoming `query` command's `describe` verb, and is purely
          additive to the in-memory semantic model.
        tests:
          - WorkspaceLoader_LoadAsync_CommentOnly_CapturesCommentAnnotation
          - WorkspaceLoader_LoadAsync_DocumentationOnly_CapturesDocumentationAnnotation
          - WorkspaceLoader_LoadAsync_CommentAndDocumentation_CapturesBothInSourceOrder
          - WorkspaceLoader_LoadAsync_NoAnnotations_AnnotationsIsEmptyNotNull
          - WorkspaceLoader_LoadAsync_MultiLineAnnotation_PreservesTextVerbatim
          - WorkspaceLoader_LoadAsync_DocumentationExampleFixture_CapturesExpectedDocText
          - AstSerializerTests.Serialize_Annotations_Preserved
          - AstSerializerTests.Serialize_NoAnnotations_RoundTripsEmptyNotNull

      - id: SysML2Tools-Language-RequirementTraceEdges
        title: >-
          The Language library shall resolve requirement satisfaction (`satisfy X by Y`),
          requirement verification (`verify`), and allocation (`allocate A to B`) references
          into Satisfy/Verify/Allocate-kind edges recorded on the semantic index, gracefully
          degrading to a Warning diagnostic with no edge when any side is unresolvable.
        justification: |
          Satisfy/Verify/Allocate edges are the requirement-traceability data the forthcoming
          `query` command's trace/impact verbs need to answer "what satisfies/verifies this
          requirement" and "what is this part allocated to" without a separate resolution pass.
        tests:
          - WorkspaceLoader_LoadAsync_SatisfyByName_RecordsSatisfyEdge
          - WorkspaceLoader_LoadAsync_SatisfyUnresolvedSubject_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_SatisfyUnresolvedRequirement_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_SatisfyFeatureChainSubject_GracefullyUnresolved
          - WorkspaceLoader_LoadAsync_VerifyOwnedReferenceSubsetting_RecordsVerifyEdge
          - WorkspaceLoader_LoadAsync_VerifyTypedRequirementPlaceholder_RecordsVerifyEdge
          - WorkspaceLoader_LoadAsync_VerifyNestedInObjectiveMember_RecordsVerifyEdge
          - WorkspaceLoader_LoadAsync_VerifyUnresolvedReference_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_AllocateBinaryEnds_RecordsAllocateEdge
          - WorkspaceLoader_LoadAsync_AllocateUnresolvedEnd_ProducesWarningNoEdge
          - WorkspaceLoader_LoadAsync_TraceEdges_ReverseIndexAnswersIncomingOutgoing
          - WorkspaceLoader_LoadAsync_RequirementSatisfactionFixture_RecordsSatisfyEdge
          - WorkspaceLoader_LoadAsync_8RequirementsFixture_RecordsSatisfyEdge
          - WorkspaceLoader_LoadAsync_12bAllocationFixture_RecordsAllocateEdge
          - WorkspaceLoader_LoadAsync_9VerificationSimplifiedFixture_RecordsVerifyEdge
          - AstSerializerTests.Serialize_SatisfyAndAllocationNodes_RoundTrip

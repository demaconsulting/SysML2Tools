---
# Software Unit Requirements for the Context Class
#
# The Context class handles command-line argument parsing and program output.
# It is the primary interface between the user's command-line invocation and
# the tool's internal logic.

sections:
  - title: Context Unit Requirements
    requirements:
      - id: Template-Context-ArgumentParsing
        title: The Context class shall parse command-line arguments into structured properties.
        justification: |
          Provides a standardized approach to command-line argument parsing and output
          handling across all DEMA Consulting DotNet Tools.
        tests:
          - Context_Create_NoArguments_ReturnsDefaultContext
          - Context_Create_VersionFlag_SetsVersionTrue
          - Context_Create_ShortVersionFlag_SetsVersionTrue
          - Context_Create_HelpFlag_SetsHelpTrue
          - Context_Create_ShortHelpFlag_H_SetsHelpTrue
          - Context_Create_ShortHelpFlag_Question_SetsHelpTrue
          - Context_Create_SilentFlag_SetsSilentTrue
          - Context_Create_ValidateFlag_SetsValidateTrue
          - Context_Create_ResultsFlag_SetsResultsFile
          - Context_Create_LogFlag_OpensLogFile
          - Context_Create_ResultAliasFlag_SetsResultsFile
          - Context_Create_DepthFlag_SetsHeadingDepth
          - Context_Create_NoDepthFlag_ReturnsDefaultHeadingDepth

      - id: Template-Context-InvalidArgs
        title: The Context class shall reject unknown or malformed command-line arguments with a descriptive error.
        justification: |
          Providing clear feedback for invalid arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        tests:
          - Context_Create_UnknownArgument_ThrowsArgumentException
          - Context_Create_LogFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_ResultsFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_ResultAliasFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_DepthFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_DepthFlag_NonIntegerValue_ThrowsArgumentException
          - Context_Create_DepthFlag_ZeroValue_ThrowsArgumentException

      - id: SysML2Tools-Tool-Context-MaxRenderDepth
        title: >-
          The Context class shall expose the raw --depth value as MaxRenderDepth (int?)
          without clamping, so that render commands can apply an unlimited depth limit.
        justification: |
          HeadingDepth is clamped to the valid markdown heading range (1–6), but diagram
          render depth is unbounded. Separating the two allows callers to apply each
          independently.
        tests:
          - Context_Create_DepthFlag_SetsMaxRenderDepth
          - Context_Create_DepthFlag_ExceedsMaxValue_SetsMaxRenderDepth

      - id: SysML2Tools-Tool-Context-ViewName
        title: >-
          The Context class shall parse the --view flag into the ViewName property and
          expose it for use by the render command.
        justification: |
          View selection is a render-command concern but must be parsed centrally by
          Context so that all argument handling remains in one place.
        tests:
          - Context_Create_ViewFlag_SetsViewName

      - id: Template-Context-ConsoleOutput
        title: The Context class shall write output to the console unless the silent flag is set.
        justification: |
          Provides visible output to users running the tool interactively, while allowing
          automated environments to suppress console output via the silent flag.
        tests:
          - Context_WriteLine_NotSilent_WritesToConsole
          - Context_WriteError_NotSilent_WritesToConsole

      - id: Template-Context-LogOutput
        title: The Context class shall additionally write output to a log file when the log flag is set.
        justification: |
          Provides persistent logging for debugging and audit trails, enabling post-run
          inspection of tool output without requiring console capture.
        tests:
          - Context_Create_LogFlag_OpensLogFile
          - Context_WriteError_WritesToLogFile

      - id: Template-Context-Silent
        title: The Context class shall suppress console output when the silent flag is set.
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs.
        tests:
          - Context_Create_SilentFlag_SetsSilentTrue
          - Context_WriteLine_Silent_DoesNotWriteToConsole
          - Context_WriteError_Silent_DoesNotWriteToConsole

      - id: Template-Context-ErrorOutput
        title: The Context class shall write error messages to stderr.
        justification: |
          Error messages must be written to stderr so they remain visible to the user
          without polluting stdout, which consumers may pipe or redirect for data capture.
        tests:
          - Context_WriteError_NotSilent_WritesToConsole

      - id: Template-Context-ExitCode
        title: The Context class shall track errors and expose a non-zero exit code when errors have occurred.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        tests:
          - Context_WriteError_SetsErrorExitCode

      - id: Template-Context-LogFailure
        title: The Context class shall report an error when the specified log file cannot be opened.
        justification: |
          Failure to open a log file must be surfaced immediately so that users know their
          log output will not be captured, preventing silent data loss in audit or
          compliance workflows.
        tests:
          - Context_Create_LogFlag_InvalidPath_ThrowsInvalidOperationException

      - id: Template-Context-RenderArgs
        title: >-
          The Context class shall parse the render command's --format and --output arguments
          into the Render.Format and Render.OutputDirectory properties.
        justification: |
          The render command relies on Context to supply the renderer format and output
          directory without needing to re-parse command-line arguments. The render command
          token must also set Command to SysmlCommand.Render and collect subsequent
          positional arguments into Render.Files.
        tests:
          - Context_Create_RenderCommand_SetsCommandRender
          - Context_Create_RenderCommand_WithFormat_SetsSvgFormat
          - Context_Create_RenderCommand_WithPngFormat_SetsPngFormat
          - Context_Create_RenderCommand_WithOutput_SetsOutputDirectory
          - Context_Create_RenderCommand_WithFiles_SetsFiles
          - Context_Create_RenderCommand_FormatWithoutValue_ThrowsArgumentException
          - Context_Create_RenderCommand_OutputWithoutValue_ThrowsArgumentException
          - Context_Create_RenderCommand_WithUnsupportedFormatValue_DoesNotThrowAtParseTime

      - id: SysML2Tools-Tool-Context-QueryDispatch
        title: >-
          The Context class shall parse the query command and its verb token into a
          QueryOptions value without altering parsing behavior for lint/render.
        justification: |
          Centralizing query's argument parsing in Context (mirroring how lint/render are
          already parsed) keeps a single, consistent argument-parsing entry point for all
          commands while confining query-specific option fields to a dedicated QueryOptions
          record so the existing lint/render properties are unaffected.
        tests:
          - Context_Create_QueryCommand_WithVerbToken_SetsQueryVerb
          - Context_Create_QueryCommand_UnknownVerb_ThrowsArgumentException
          - Context_Create_QueryCommand_NoVerbWithHelp_LeavesQueryNull
          - Context_Create_QueryCommand_WithElementFlag_SetsElement
          - Context_Create_QueryCommand_WithShortElementFlag_SetsElement
          - Context_Create_QueryCommand_WithDirectionFlag_SetsDirection
          - Context_Create_QueryCommand_WithKindFlag_SetsKind
          - Context_Create_QueryCommand_WithNameFlag_SetsNameFilter
          - Context_Create_QueryCommand_WithIncludeStdlibFlag_SetsIncludeStdlibTrue
          - Context_Create_QueryCommand_WithFormatMarkdown_SetsQueryFormat
          - Context_Create_QueryCommand_WithFormatJson_SetsQueryFormat
          - Context_Create_QueryCommand_WithDepthFlag_SetsQueryDepth
          - Context_Create_QueryCommand_WithFiles_SetsQueryFilesNotTopLevelFiles

      - id: SysML2Tools-Tool-Context-CommandScoping
        title: >-
          The Context class shall dispatch argument parsing to a dedicated per-command parser
          (lint, render, or query) that rejects any flag outside that command's own grammar,
          naming both the unrecognized flag and the active command in the resulting
          ArgumentException.
        justification: |
          A single shared argument-parsing switch across lint/render/query previously allowed
          out-of-scope flags (e.g., render's --kind, or query's --auto) to be silently accepted
          or misinterpreted. Scoping each command's flags to a dedicated parser (LintArgumentParser,
          RenderArgumentParser, QueryArgumentParser) makes invalid combinations fail fast with a
          clear, actionable error instead of being silently ignored.
        tests:
          - Context_Create_LintCommand_OutOfScopeAutoFlag_ThrowsArgumentException
          - Context_Create_LintCommand_OutOfScopeKindFlag_ThrowsArgumentException
          - Context_Create_RenderCommand_OutOfScopeKindFlag_ThrowsArgumentException
          - Context_Create_RenderCommand_OutOfScopeElementFlag_ThrowsArgumentException
          - Context_Create_QueryCommand_OutOfScopeAutoFlag_ThrowsArgumentException

      - id: SysML2Tools-Tool-Context-QueryVerbRequired
        title: >-
          The Context class shall require a verb as the first token following the query
          command, failing with a clear ArgumentException when the verb is absent unless
          --help was requested.
        justification: |
          Previously, a missing query verb silently left Query null with no error, deferring
          the failure to whatever downstream code happened to dereference Query. Requiring the
          verb as a structural, eagerly-validated part of the query grammar (rather than a
          lazily-inferred default case) surfaces the mistake immediately and clearly, except
          when --help is requested, which intentionally shows general help instead.
        tests:
          - Context_Create_QueryCommand_NoVerbNoHelp_ThrowsArgumentException
          - Context_Create_QueryCommand_NoVerbWithHelp_LeavesQueryNull

---
# Lint Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the SysML2Tools Lint subsystem
# - LintCommand resolves glob patterns, invokes WorkspaceParser, and reports diagnostics
# - Subsystem requirements describe the externally visible linting behavior

sections:
  - title: Lint Subsystem Requirements
    requirements:
      - id: SysML2Tools-Tool-Lint-Patterns
        title: >-
          The LintCommand shall accept one or more file glob patterns as positional
          arguments, report an error when no patterns are supplied, and delegate their
          resolution to the shared GlobFileCollector.
        justification: |
          Users specify which SysML files to lint using file glob patterns (e.g.,
          src/**/*.sysml). Accepting multiple patterns in a single invocation allows
          flexible targeting of file sets without requiring shell expansion. Delegating
          resolution to the shared GlobFileCollector (see the Core Io subsystem's own
          requirements for pattern-resolution semantics) ensures lint supports the same
          recursive/exclusion behavior as render and query.
        tests:
          - LintSubsystem_Patterns_AcceptsGlobPatterns_ResolvesFiles
          - LintSubsystem_Patterns_RecursiveGlob_ResolvesNestedFiles
          - LintSubsystem_Patterns_ExclusionPattern_ExcludesMatchedFile

      - id: SysML2Tools-Tool-Lint-NoFilesMatched
        title: >-
          The LintCommand shall report a clear error when one or more file patterns are
          supplied but none of them match any file on disk, distinguishing this case from
          "no patterns supplied at all".
        justification: |
          A pattern that matches nothing (e.g., a typo in a directory name) previously
          proceeded silently to workspace loading with an empty file list, indistinguishable
          from "no patterns supplied at all". Reporting a dedicated "no files matched" error
          mirrors render/query's equivalent behavior and gives the user an actionable message.
        tests:
          - LintSubsystem_PatternMatchesNoFiles_ReportsError

      - id: SysML2Tools-Tool-Lint-Parse
        title: >-
          The LintCommand shall invoke WorkspaceLoader.LoadAsync with the resolved
          file paths derived from the provided patterns.
        justification: |
          Delegating loading to WorkspaceLoader ensures that all SysML files are
          validated against the embedded stdlib, that semantic analysis is performed,
          and that all diagnostics are collected consistently for all user-supplied files.
        tests:
          - LintSubsystem_Parse_ValidFile_ParsesWithoutErrors

      - id: SysML2Tools-Tool-Lint-Report
        title: >-
          The LintCommand shall write each diagnostic to the context output in the
          format: path(line,col): severity: message.
        justification: |
          A standard diagnostic format is recognized by IDEs, CI tools, and problem
          matchers, enabling automated parsing of lint results without custom tooling.
        tests:
          - LintSubsystem_Report_InvalidFile_WritesDiagnosticInExpectedFormat

      - id: SysML2Tools-Tool-Lint-ExitCode
        title: >-
          The LintCommand shall cause the tool to return exit code 1 if any
          error-severity diagnostics are present.
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and surface lint
          failures automatically, preventing silent acceptance of invalid SysML models.
        tests:
          - LintSubsystem_ExitCode_InvalidFile_ReturnsOne

      - id: SysML2Tools-Tool-Lint-LocalizableHelpText
        title: >-
          The lint command's help text (LintCommand.PrintHelp) shall be sourced from
          culture-aware .resx resources via ResourceManager, falling back to invariant
          English, so a future locale-specific .resx requires no code change.
        justification: |
          Mirrors the Program subsystem's resx-based localization approach so lint's help
          text is not left as an inconsistent set of hardcoded string literals.
        tests:
          - ResxResource_EveryKey_ResolvesToNonEmptyText
          - ResxResource_KeysAndAccessorProperties_AreInBidirectionalParity

---
# Lint Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the SysML2Tools Lint subsystem
# - LintCommand resolves glob patterns, invokes WorkspaceParser, and reports diagnostics
# - Subsystem requirements describe the externally visible linting behavior

sections:
  - title: Lint Subsystem Requirements
    requirements:
      - id: SysML2Tools-Tool-Lint-Patterns
        title: >-
          The LintCommand shall accept one or more file glob patterns as positional
          arguments, report an error when no patterns are supplied, and delegate their
          resolution to the shared GlobFileCollector.
        justification: |
          Users specify which SysML files to lint using file glob patterns (e.g.,
          src/**/*.sysml). Accepting multiple patterns in a single invocation allows
          flexible targeting of file sets without requiring shell expansion. Delegating
          resolution to the shared GlobFileCollector (see the Core Io subsystem's own
          requirements for pattern-resolution semantics) ensures lint supports the same
          recursive/exclusion behavior as render and query.
        children:
          - SysML2Tools-Tool-Lint-NoFilesMatched
          - SysML2Tools-Tool-Lint-Parse
          - SysML2Tools-Tool-Lint-Report
          - SysML2Tools-Tool-Lint-ExitCode
          - SysML2Tools-Tool-Lint-StrictUnresolved
          - SysML2Tools-Tool-Lint-PortabilityWarning
          - SysML2Tools-Tool-Lint-DuplicateDeclarationWarning
          - SysML2Tools-Tool-Lint-LocalizableHelpText
        tests:
          - LintSubsystem_Patterns_AcceptsGlobPatterns_ResolvesFiles
          - LintSubsystem_Patterns_RecursiveGlob_ResolvesNestedFiles
          - LintSubsystem_Patterns_ExclusionPattern_ExcludesMatchedFile

      - id: SysML2Tools-Tool-Lint-NoFilesMatched
        title: >-
          The LintCommand shall report a clear error when one or more file patterns are
          supplied but none of them match any file on disk, distinguishing this case from
          "no patterns supplied at all".
        justification: |
          A pattern that matches nothing (e.g., a typo in a directory name) previously
          proceeded silently to workspace loading with an empty file list, indistinguishable
          from "no patterns supplied at all". Reporting a dedicated "no files matched" error
          mirrors render/query's equivalent behavior and gives the user an actionable message.
        tests:
          - LintSubsystem_PatternMatchesNoFiles_ReportsError

      - id: SysML2Tools-Tool-Lint-Parse
        title: >-
          The LintCommand shall invoke WorkspaceLoader.LoadAsync with the resolved
          file paths derived from the provided patterns.
        justification: |
          Delegating loading to WorkspaceLoader ensures that all SysML files are
          validated against the embedded stdlib, that semantic analysis is performed,
          and that all diagnostics are collected consistently for all user-supplied files.
        tests:
          - LintSubsystem_Parse_ValidFile_ParsesWithoutErrors

      - id: SysML2Tools-Tool-Lint-Report
        title: >-
          The LintCommand shall write each diagnostic to the context output in the
          format: path(line,col): severity: message.
        justification: |
          A standard diagnostic format is recognized by IDEs, CI tools, and problem
          matchers, enabling automated parsing of lint results without custom tooling.
          The line is produced by the shared DiagnosticFormatter so that render and query
          print identical diagnostics.
        children:
          - SysML2Tools-Tool-Utilities-DiagnosticFormat
        tests:
          - LintSubsystem_Report_InvalidFile_WritesDiagnosticInExpectedFormat
          - LintSubsystem_Report_UnresolvedReference_ReportsReferencePosition
          - LintSubsystem_Report_UnresolvedExpressionReferences_ReportsTokenPositionsAsWarnings

      - id: SysML2Tools-Tool-Lint-ExitCode
        title: >-
          The LintCommand shall cause the tool to return exit code 1 if any
          error-severity diagnostics are present.
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and surface lint
          failures automatically, preventing silent acceptance of invalid SysML models.
          Unresolved references are warnings by default and do not change the exit code
          unless strict mode promotes them to errors.
        tests:
          - LintSubsystem_ExitCode_InvalidFile_ReturnsOne
          - LintSubsystem_UnresolvedReference_ReportsWarningAndExitsZero
          - LintSubsystem_Gallery_AllModels_NoDiagnosticsExitZero

      - id: SysML2Tools-Tool-Lint-StrictUnresolved
        title: >-
          The LintCommand shall report each unresolved reference as a warning by default (exit
          code 0 when nothing else is wrong), shall accept a `--strict-unresolved` option that
          reports them as errors (exit code 1), shall leave other warnings such as circular
          imports unchanged in strict mode, and its help text shall describe both behaviors.
        justification: |
          An unresolved reference means the model does not fully validate against the SysML v2
          standard, but incomplete or work-in-progress models are common, so lint keeps them
          visible without failing the build by default. Teams that use lint as a model-validity
          gate opt in to failing on them explicitly, and only unresolved references are promoted.
        tests:
          - LintSubsystem_Report_UnresolvedReference_ReportsReferencePosition
          - LintSubsystem_UnresolvedReference_ReportsWarningAndExitsZero
          - LintSubsystem_StrictUnresolved_UnresolvedReference_ReportsErrorAndExitsOne
          - LintSubsystem_StrictUnresolved_CircularImport_RemainsWarning
          - LintSubsystem_StrictUnresolved_StandardLibraryReference_NoDiagnostics
          - LintSubsystem_Gallery_StrictUnresolved_AllModels_NoDiagnosticsExitZero
          - LintSubsystem_Help_PrintsLintSpecificUsage

      - id: SysML2Tools-Tool-Lint-PortabilityWarning
        title: >-
          The LintCommand shall report a warning, not an error, at the token of each SysML2Tools
          extension render selector (such as `asGeneralDiagram`) that a view uses without
          declaring it, saying the model will not validate in other tools, and shall report
          nothing for the standard selectors.
        justification: |
          The extension selectors render in SysML2Tools but are not standard SysML v2, so authors
          need to know the model is not portable; a warning leaves the lint exit code unchanged,
          even in strict mode.
        tests:
          - LintSubsystem_Report_ToolRenderSelector_WritesPortabilityWarningAtToken
          - LintSubsystem_StrictUnresolved_ToolRenderSelector_RemainsWarning
          - LintSubsystem_Report_StandardRenderSelectors_NoDiagnostics

      - id: SysML2Tools-Tool-Lint-DuplicateDeclarationWarning
        title: >-
          The LintCommand shall report, as a warning at the declaration's name in the format
          path(line,col): warning: message, each root-level declaration that is ignored because
          an earlier declaration already uses its name (naming the file and position of the
          declaration that is used), shall leave the exit code unchanged, shall keep the diagnostic
          a warning in strict mode, and shall report no unresolved reference for the parts of a
          package that is declared in more than one file.
        justification: |
          A root-level name can be declared once per workspace, and a later declaration of the same
          name is left out of the model. Authors need to see which declaration is ignored and where
          the one in use is, without the diagnostic failing a build that gates only on unresolved
          references; and a package split across files must not additionally produce confusing
          unresolved references that depend on the order of the files.
        tests:
          - LintSubsystem_Report_DuplicateRootPackage_WritesWarningAtNameNamingOtherFile
          - LintSubsystem_StrictUnresolved_DuplicateRootPackage_RemainsWarning
          - LintSubsystem_StrictUnresolved_RootAliasDuplicatingPackage_WarnsAtAliasName
          - LintSubsystem_Report_SplitPackageWithImport_NoUnresolvedReference
          - LintSubsystem_SelfModel_AllFiles_NoDiagnosticsExitZero
          - LintSubsystem_Gallery_AllModelsTogether_NoDiagnosticsExitZero

      - id: SysML2Tools-Tool-Lint-LocalizableHelpText
        title: >-
          The lint command's help text (LintCommand.PrintHelp) shall be sourced from
          culture-aware .resx resources via ResourceManager, falling back to invariant
          English, so a future locale-specific .resx requires no code change.
        justification: |
          Mirrors the Program subsystem's resx-based localization approach so lint's help
          text is not left as an inconsistent set of hardcoded string literals.
        tests:
          - ResxResource_EveryKey_ResolvesToNonEmptyText
          - ResxResource_KeysAndAccessorProperties_AreInBidirectionalParity

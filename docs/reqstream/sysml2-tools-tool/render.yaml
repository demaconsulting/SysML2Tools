---
# Render Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the DemaConsulting.SysML2Tools.Tool Render subsystem
# - RenderCommand implements the CLI render verb
# - Requirements describe observable behavior of the render command

sections:
  - title: Render Subsystem Requirements
    requirements:
      - id: SysML2Tools-Tool-Render-Patterns
        title: >-
          The render command shall accept one or more file glob patterns as positional
          arguments, report an error when no patterns are supplied, and delegate pattern
          resolution to the shared GlobFileCollector.
        justification: |
          File glob patterns are the primary input mechanism for the CLI tool. An error
          on missing patterns gives users an actionable message instead of silent failure.
          Delegating resolution to the shared GlobFileCollector (see the Core Io
          subsystem's own requirements for pattern-resolution semantics) fixes a
          pre-existing defect where render passed raw glob tokens straight to the
          workspace loader, which treats every entry as a literal file path.
        tests:
          - RenderSubsystem_NoFiles_ReportsError
          - RenderSubsystem_GlobPattern_ResolvesMultipleFiles

      - id: SysML2Tools-Tool-Render-NoFilesMatched
        title: >-
          The render command shall report a clear error when one or more file patterns are
          supplied but none of them match any file on disk.
        justification: |
          A pattern that matches nothing (e.g., a typo in a directory name) previously
          proceeded silently to workspace loading with an empty file list. Reporting a
          dedicated "no files matched" error distinguishes this case from "no patterns
          supplied at all" and gives the user an actionable message.
        tests:
          - RenderSubsystem_PatternMatchesNoFiles_ReportsError

      - id: SysML2Tools-Tool-Render-Load
        title: >-
          The render command shall load a SysML workspace from the supplied file patterns
          and report any load diagnostics before rendering.
        justification: |
          Reporting diagnostics before rendering ensures that users can identify and
          correct model errors that would affect diagram output.
        tests:
          - RenderSubsystem_WithFiles_LoadsWorkspace

      - id: SysML2Tools-Tool-Render-Format
        title: >-
          The render command shall select the SVG renderer when the --format option is
          "svg" or absent, and the PNG renderer when --format is "png".
        justification: |
          Format selection through a named option makes the CLI self-documenting and
          avoids dependence on file extension inference.
        tests:
          - RenderSubsystem_FormatSvg_UsesSvgRenderer
          - RenderSubsystem_FormatPng_UsesPngRenderer

      - id: SysML2Tools-Tool-Render-Output
        title: >-
          The render command shall write rendered output files to the directory specified
          by the --output option, defaulting to the current working directory when the
          option is absent.
        justification: |
          Defaulting to the current working directory matches common CLI tool conventions
          and avoids requiring the option for simple single-directory use cases.
        tests:
          - RenderSubsystem_NoOutputDir_UsesCurrentDirectory

      - id: SysML2Tools-Tool-Render-Empty
        title: >-
          The render command shall report a diagnostic message and write no output files
          when the workspace contains no view declarations.
        justification: |
          An explicit message when no views are found prevents user confusion when
          a model loads successfully but produces no diagram output.
        tests:
          - RenderSubsystem_NoViews_ReportsNoOutput

      - id: SysML2Tools-Tool-Render-DepthLimit
        title: >-
          The render command shall limit diagram nesting depth to the value supplied via
          --depth, replacing truncated children with an ellipsis indicator.
        justification: |
          A depth limit prevents overly complex diagrams when large models have deep
          nesting. An ellipsis marker tells the reader that content was omitted.
        tests:
          - RenderSubsystem_WithDepth_LimitsNesting

      - id: SysML2Tools-Tool-Render-AllViewsExport
        title: >-
          The render command shall render every declared view in the workspace, producing
          one output file per view, when --view is not specified.
        justification: |
          Rendering every declared view by default supports bulk "render everything"
          exports for CI pipelines and design-doc publishing without requiring the user
          to invoke the command once per view.
        tests:
          - RenderSubsystem_MultipleViews_NoViewFlag_RendersAllViews

      - id: SysML2Tools-Tool-Render-UnknownViewError
        title: >-
          The render command shall report an error listing all available view names when
          --view specifies a view name that does not exist in the workspace.
        justification: |
          Reporting an error with the list of available view names gives users an
          actionable message when they mistype or misremember a view's display name.
        tests:
          - RenderSubsystem_UnknownViewFlag_ReportsErrorWithAvailableViews

      - id: SysML2Tools-Tool-Render-ViewSelection
        title: >-
          The render command shall render only the view whose display name matches the
          value supplied via --view, when --view is specified.
        justification: |
          View selection enables targeting a single diagram for output in multi-view
          models without generating every diagram in the workspace; it is always
          optional, narrowing the default render-all behavior to one view on request.
        tests:
          - RenderSubsystem_MultipleViews_WithViewFlag_RendersSelectedView

      - id: SysML2Tools-Tool-Render-FormatValidation
        title: >-
          The render command shall reject unsupported --format values with a clear
          ArgumentException naming the invalid value, validated when the command runs
          rather than at argument-parsing time.
        justification: |
          Previously an unrecognized --format value (e.g., "xml") was silently treated as
          "svg", masking user typos. Rejecting unsupported values explicitly, mirroring the
          query command's --format validation, surfaces the mistake instead of silently
          producing an unexpected output format.
        tests:
          - RenderSubsystem_UnsupportedFormat_ThrowsArgumentException

      - id: SysML2Tools-Tool-Render-FileNameCollision
        title: >-
          The render command shall detect and report, before writing any output files, when
          rendering all declared views (--view not specified) would produce two or more
          output files with the same sanitized file name, naming the colliding views and the
          shared file name, and shall abort without writing any files for that run.
        justification: |
          Two declared views in different packages that share the same simple name sanitize
          to the same output file name. Without a collision guard, the second file written
          silently overwrites the first while the final "Rendered N view(s)." message still
          misreports both views as rendered, masking data loss from the user.
        tests:
          - RenderSubsystem_DuplicateViewFileNames_ReportsCollisionError

      - id: SysML2Tools-Tool-Render-LocalizableHelpText
        title: >-
          The render command's help text (RenderCommand.PrintHelp) shall be sourced from
          culture-aware .resx resources via ResourceManager, falling back to invariant
          English, so a future locale-specific .resx requires no code change.
        justification: |
          Mirrors the Program subsystem's resx-based localization approach so render's help
          text is not left as an inconsistent set of hardcoded string literals.
        tests:
          - ResxResource_EveryKey_ResolvesToNonEmptyText
          - ResxResource_KeysAndAccessorProperties_AreInBidirectionalParity

      - id: SysML2Tools-Tool-Render-DynamicView
        title: >-
          The render command shall accept --view-type and --view-target (together, and an
          optional --filter) to synthesize and render an ad-hoc view targeting any resolvable
          element without requiring a view def in the model, and shall reject: --filter supplied
          without both --view-type and --view-target; --view-type or --view-target supplied
          without the other; and --view-type/--view-target combined with --view or --auto —
          each with a clear, specific diagnostic and a non-zero exit code.
        justification: |
          Requiring a view def for every diagram a user wants is a friction point for
          exploratory, one-off diagramming of a specific element. Delegating synthesis to
          DiagramRenderer.SynthesizeDynamicView (Core subsystem) keeps the CLI's own
          responsibility limited to flag validation, mutual-exclusion enforcement, and wiring
          the synthesized view into the existing render pipeline unchanged.
        tests:
          - RenderSubsystem_DynamicViewTypeAndTarget_RendersSynthesizedView
          - RenderSubsystem_DynamicViewTypeInterconnection_RendersSynthesizedView
          - RenderSubsystem_DynamicViewIncompatibleTarget_ReportsDiagnostic
          - RenderSubsystem_DynamicViewUnresolvedTarget_ReportsDiagnostic
          - RenderSubsystem_DynamicViewWithFilter_ProducesNarrowerOutput
          - RenderSubsystem_FilterWithoutViewTypeAndTarget_ReportsError
          - RenderSubsystem_ViewTypeWithoutViewTarget_ReportsError
          - RenderSubsystem_DynamicViewCombinedWithView_ReportsError
          - RenderSubsystem_DynamicViewCombinedWithAuto_ReportsError
          - RenderSubsystem_Help_DocumentsDynamicViewFlags
